.progress-bar-container {
    width: 100%;
    height: 4px;
    background: rgba(59, 130, 246, 0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    border-radius: 2px;
    transition: width 0.3s ease-out;
    animation: shimmer 1.5s infinite;
}

@keyframes shimmer {
    0% { background-position: -100% 0; }
    100% { background-position: 200% 0; }
}

.call-timer {
    font-family: 'Courier New', monospace;
    color: #fde047;
    font-size: 13px;
    font-weight: 700;
    background: rgba(234, 179, 8, 0.2);
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid rgba(234, 179, 8, 0.3);
}

.shift-summary-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1e3a8a, #334155);
    border: 2px solid #3b82f6;
    border-radius: 16px;
    padding: 32px;
    z-index: 10000;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    animation: popIn 0.3s ease-out;
}

.night-mode {
    filter: hue-rotate(180deg) brightness(0.8);
}

.night-mode * {
    color: #ffa500 !important;
}

/* ═══════════════════════════════════════════════
   NYSP MDT - LOADER  (UpdateLog-matched style)
   ═══════════════════════════════════════════════ */

.mdt-loader-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.97) 0%, rgba(15,23,42,0.99) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 1.2s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.mdt-loader-overlay::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    animation: loader-pulse-glow 3s ease-in-out infinite;
    pointer-events: none;
}

@keyframes loader-pulse-glow {
    0%,100% { opacity:0.4; transform:translate(-50%,-50%) scale(1); }
    50%     { opacity:0.7; transform:translate(-50%,-50%) scale(1.15); }
}

.mdt-loader-overlay.fade-out {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.03);
}

/* ── Central card ── */
.mdt-loader-card {
    position: relative;
    z-index: 1;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    border: 2px solid rgba(59,130,246,0.5);
    border-radius: 20px;
    padding: 48px 52px;
    width: 640px;
    max-width: 94vw;
    box-shadow:
        0 25px 80px rgba(59,130,246,0.35),
        0 0 120px rgba(59,130,246,0.15);
    animation: loader-fadein 0.5s ease-out;
    display: flex;
    flex-direction: column;
    gap: 0;
}

@keyframes loader-fadein {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
}

/* ── Header row ── */
.mdt-loader-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 3px solid rgba(59,130,246,0.3);
    margin-bottom: 28px;
}

.mdt-loader-icon-box {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(59,130,246,0.5);
    flex-shrink: 0;
    animation: loader-float 3s ease-in-out infinite;
}

@keyframes loader-float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
}

.mdt-loader-title {
    color: white;
    font-size: 34px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin: 0;
    text-shadow: 0 0 30px rgba(59,130,246,0.8);
    line-height: 1;
}

.mdt-loader-subtitle {
    color: #60a5fa;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 6px 0 0 0;
}

/* ── Check rows ── */
.mdt-loader-checks {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
}

.mdt-check-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(30,58,138,0.25), rgba(15,23,42,0.7));
    border: 1.5px solid rgba(59,130,246,0.25);
    border-radius: 10px;
    transition: all 0.3s;
    min-height: 44px;
}

.mdt-check-row.active {
    border-color: rgba(59,130,246,0.6);
    background: linear-gradient(135deg, rgba(30,58,138,0.45), rgba(15,23,42,0.85));
    box-shadow: 0 4px 20px rgba(59,130,246,0.25);
}

.mdt-check-row.done-ok {
    border-color: rgba(34,197,94,0.4);
    background: linear-gradient(135deg, rgba(20,83,45,0.25), rgba(15,23,42,0.7));
}

.mdt-check-row.done-warn {
    border-color: rgba(234,179,8,0.4);
    background: linear-gradient(135deg, rgba(78,60,12,0.3), rgba(15,23,42,0.7));
}

.mdt-check-icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
}

.mdt-check-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #93c5fd;
    flex-shrink: 0;
    width: 160px;
}

.mdt-check-result {
    font-size: 12px;
    font-weight: 600;
    color: #bfdbfe;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    flex: 1;
}

.mdt-check-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(59,130,246,0.3);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: mdt-spin 0.8s linear infinite;
    flex-shrink: 0;
}

@keyframes mdt-spin {
    to { transform: rotate(360deg); }
}

/* ── Progress bar ── */
.mdt-loader-progress-wrap {
    margin-top: 4px;
}

.mdt-loader-progress-track {
    width: 100%;
    height: 8px;
    background: rgba(59,130,246,0.15);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    position: relative;
}

.mdt-loader-progress-track::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
    animation: loader-shimmer 1.8s infinite;
}

@keyframes loader-shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}

.mdt-loader-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
    background-size: 200% 100%;
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 16px rgba(59,130,246,0.8);
    animation: loader-grad-shift 2s ease infinite;
}

@keyframes loader-grad-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.mdt-loader-progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #60a5fa;
}

/* ── Welcome banner ── */
.mdt-loader-welcome {
    text-align: center;
    margin-top: 20px;
    padding: 16px 24px;
    background: rgba(59,130,246,0.12);
    border: 2px solid rgba(59,130,246,0.4);
    border-radius: 12px;
    color: #93c5fd;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(59,130,246,0.25);
    animation: loader-welcome-pulse 2s ease-in-out infinite;
}

@keyframes loader-welcome-pulse {
    0%,100% { box-shadow: 0 6px 24px rgba(59,130,246,0.25); }
    50%     { box-shadow: 0 8px 36px rgba(59,130,246,0.5); }
}

/* ── Skip button ── */
.mdt-loader-skip {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(37,99,235,0.25));
    border: 2px solid rgba(59,130,246,0.55);
    border-radius: 10px;
    color: white;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10001;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(59,130,246,0.25);
}
.mdt-loader-skip:hover {
    background: linear-gradient(135deg, rgba(59,130,246,0.55), rgba(37,99,235,0.45));
    transform: translateX(-50%) translateY(-2px);
    box-shadow: 0 6px 24px rgba(59,130,246,0.45);
}


@keyframes popIn {
    0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
    }
    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
}

@keyframes pulse-glow {
    0%, 100% { 
        transform: translate(-50%, -50%) scale(1); 
        opacity: 0.3; 
    }
    50% { 
        transform: translate(-50%, -50%) scale(1.2); 
        opacity: 0.6; 
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes rotate-border {
    to { transform: rotate(360deg); }
}

@keyframes float {
    0%, 100% { 
        transform: translateY(0px) rotate(0deg); 
    }
    25% { 
        transform: translateY(-15px) rotate(-2deg); 
    }
    75% { 
        transform: translateY(-15px) rotate(2deg); 
    }
}

@keyframes glow-title {
    from { text-shadow: 0 0 40px rgba(59, 130, 246, 0.8), 0 4px 20px rgba(0, 0, 0, 0.8); }
    to { text-shadow: 0 0 60px rgba(59, 130, 246, 1), 0 4px 30px rgba(0, 0, 0, 0.8); }
}

@keyframes pulse-welcome {
    0%, 100% { 
        transform: scale(1);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
    }
    50% { 
        transform: scale(1.02);
        box-shadow: 0 8px 40px rgba(59, 130, 246, 0.5);
    }
}


@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes status-pulse {
    0% { transform: scale(0.95); opacity: 0; }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); opacity: 1; }
}


@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}



@keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes flash-red {
    0%, 100% { 
        background: linear-gradient(135deg, #ef4444, #dc2626);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
    }
    50% { 
        background: linear-gradient(135deg, #dc2626, #991b1b);
        box-shadow: 0 8px 24px rgba(239, 68, 68, 1);
    }
}

@keyframes spin-mdt {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse-ring {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}


@keyframes pulse-glow-green {
    0%, 100% { 
        box-shadow: 0 0 8px #10b981, 0 0 16px rgba(16, 185, 129, 0.5);
        transform: scale(1);
    }
    50% { 
        box-shadow: 0 0 12px #10b981, 0 0 24px rgba(16, 185, 129, 0.8);
        transform: scale(1.1);
    }
}

@keyframes pulse-glow-red {
    0%, 100% { 
        box-shadow: 0 0 8px #ef4444, 0 0 16px rgba(239, 68, 68, 0.5);
        transform: scale(1);
    }
    50% { 
        box-shadow: 0 0 12px #ef4444, 0 0 24px rgba(239, 68, 68, 0.8);
        transform: scale(1.1);
    }
}

@keyframes warrant-dots {
    0%   { content: '.';   }
    33%  { content: '..';  }
    66%  { content: '...'; }
    100% { content: 'Finalizing';   }
}
@keyframes pulse-border-warrant {
    0%, 100% { 
        border-color: #991b1b;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        transform: scale(1);
    }
    50% { 
        border-color: #ef4444;
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
        transform: scale(1.02);
    }
}

/* Pulse border animation for error vehicle box */
@keyframes pulse-border-red {
    0%, 100% { 
        border-color: #dc2626;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    50% { 
        border-color: #ef4444;
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }
}

@keyframes flash-red-border {
    0%, 100% { 
        border-color: #ef4444;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    50% { 
        border-color: #dc2626;
        box-shadow: 0 0 30px rgba(239, 68, 68, 1);
    }
}

@media (max-width: 1024px) {
    .app-container { flex-direction: column; }
    .sidebar { width: 100%; }
    .results-grid { grid-template-columns: 1fr; }
    .card { max-width: 100%; padding: 20px; }
}

.page-transition-enter {
    opacity: 0;
    transform: translateY(20px);
}

.page-transition-active {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
}

.page-fade-out {
    opacity: 0;
    transform: translateY(-20px);
    transition: opacity 0.3s ease-in, transform 0.3s ease-in;
}

@media (min-width: 1600px) {
    .results-grid { grid-template-columns: 1fr 1.5fr; }
}

const PanicCountdown = ({ onExpire, onCancel }) => {
    const [seconds, setSeconds] = React.useState(10);
    const [slideX, setSlideX] = React.useState(0);
    const [isDragging, setIsDragging] = React.useState(false);
    const dragStartX = React.useRef(null);
    const trackRef = React.useRef(null);
    const onExpireRef = React.useRef(onExpire);
    React.useEffect(() => { onExpireRef.current = onExpire; }, [onExpire]);
    const TRACK_WIDTH = 260;
    const KNOB_WIDTH = 64;
    const MAX_SLIDE = TRACK_WIDTH - KNOB_WIDTH - 8;

    React.useEffect(() => {
        if (seconds <= 0) { onExpireRef.current(); return; }
        const t = setTimeout(() => setSeconds(s => s - 1), 1000);
        return () => clearTimeout(t);
    }, [seconds]);

    const startDrag = (clientX) => { setIsDragging(true); dragStartX.current = clientX - slideX; };
    const moveDrag = (clientX) => {
        if (!isDragging) return;
        const nx = Math.max(0, Math.min(MAX_SLIDE, clientX - dragStartX.current));
        setSlideX(nx);
        if (nx >= MAX_SLIDE - 4) { setIsDragging(false); onExpireRef.current(); }
    };
    const endDrag = () => { setIsDragging(false); setSlideX(0); };

    const pct = seconds / 10;
    const urgentColor = seconds <= 3 ? '#ef4444' : seconds <= 6 ? '#f59e0b' : '#ffffff';

    return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 999999, background: '#0a0a0f', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'space-between', padding: '60px 32px 56px', userSelect: 'none' }}
            onMouseMove={e => moveDrag(e.clientX)} onMouseUp={endDrag} onMouseLeave={endDrag}>
            {/* Top section — title + description + countdown */}
            <div style={{ textAlign: 'center', flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ color: '#ffffff', fontSize: '32px', fontWeight: '800', letterSpacing: '-0.5px', marginBottom: '14px', lineHeight: 1.2 }}>
                    DAPS detected inputs.
                </div>
                <div style={{ color: 'rgba(255,255,255,0.5)', fontSize: '16px', fontWeight: '400', marginBottom: '52px', lineHeight: 1.5, maxWidth: '280px' }}>
                    DAPS will trigger SOS if you don't respond.
                </div>
                {/* Big countdown ring */}
                <div style={{ position: 'relative', width: '130px', height: '130px', marginBottom: '12px' }}>
                    <svg width="130" height="130" style={{ transform: 'rotate(-90deg)' }}>
                        <circle cx="65" cy="65" r="58" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="4" />
                        <circle cx="65" cy="65" r="58" fill="none" stroke={urgentColor} strokeWidth="4"
                            strokeDasharray={`${2 * Math.PI * 58}`}
                            strokeDashoffset={`${2 * Math.PI * 58 * (1 - pct)}`}
                            strokeLinecap="round"
                            style={{ transition: 'stroke-dashoffset 1s linear, stroke 0.3s' }} />
                    </svg>
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <span style={{ color: urgentColor, fontSize: '44px', fontWeight: '900', fontFamily: 'monospace', lineHeight: 1, transition: 'color 0.3s' }}>{seconds}</span>
                    </div>
                </div>
                <div style={{ color: 'rgba(255,255,255,0.3)', fontSize: '12px', letterSpacing: '1.5px', textTransform: 'uppercase' }}>seconds to auto-activate</div>
            </div>

            {/* Bottom section — slide button + cancel */}
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '24px', width: '100%' }}>
                {/* Slide-to-confirm track */}
                <div ref={trackRef} style={{ width: `${TRACK_WIDTH}px`, height: '64px', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.35)', borderRadius: '32px', position: 'relative', overflow: 'hidden', cursor: 'pointer' }}>
                    {/* Track label */}
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgba(255,255,255,0.35)', fontSize: '12px', fontWeight: '700', letterSpacing: '2px', textTransform: 'uppercase', pointerEvents: 'none', paddingLeft: '40px' }}>
                        slide to activate SOS
                    </div>
                    {/* Sliding knob */}
                    <div
                        style={{ position: 'absolute', top: '4px', left: `${4 + slideX}px`, width: `${KNOB_WIDTH}px`, height: '56px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', borderRadius: '28px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(239,68,68,0.5)', cursor: 'grab', transition: isDragging ? 'none' : 'left 0.3s ease', zIndex: 2 }}
                        onMouseDown={e => { e.preventDefault(); startDrag(e.clientX); }}
                        onTouchStart={e => { startDrag(e.touches[0].clientX); }}
                        onTouchMove={e => { moveDrag(e.touches[0].clientX); }}
                        onTouchEnd={endDrag}>
                        <div style={{ color: 'white', fontWeight: '900', fontSize: '13px', letterSpacing: '1px' }}>SOS</div>
                    </div>
                </div>

                {/* Cancel button */}
                <button
                    onClick={onCancel}
                    style={{ width: '60px', height: '60px', borderRadius: '50%', background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', color: 'white', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s', fontSize: '20px' }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.2)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.1)'; }}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
                <div style={{ color: 'rgba(255,255,255,0.3)', fontSize: '11px', letterSpacing: '0.5px', marginTop: '-12px' }}>Cancel</div>
            </div>
        </div>
    );
};

const raceProxies = (promises) => new Promise((resolve) => {
    let remaining = promises.length;
    promises.forEach(p => Promise.resolve(p).then(r => {
        remaining--;
        if (r && r.success) resolve(r);
        else if (remaining === 0) resolve(null);
    }).catch(() => { remaining--; if (remaining === 0) resolve(null); }));
});

async function checkOfficersFlag() {
    console.log('[OFFICERS] 🔄 Checking feature flag...');
    try {
        const cached = localStorage.getItem('officersFlagCache');
        if (cached) {
            const { value, ts } = JSON.parse(cached);
            if (Date.now() - ts < 75000) { // use cache if fresher than 75s
                window.AVAILABLE_OFFICERS_DISABLED = value;
                console.log('[OFFICERS] Using cached flag:', value ? '🚫 DISABLED' : '✅ ENABLED');
                return;
            }
        }
        const response = await fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/officers-config', { cache: 'no-store' });
        const script = await response.text();
        eval(script);
        localStorage.setItem('officersFlagCache', JSON.stringify({ value: window.AVAILABLE_OFFICERS_DISABLED, ts: Date.now() }));
    } catch (err) {
        console.warn('[OFFICERS] Flag check failed, defaulting to enabled:', err.message);
        window.AVAILABLE_OFFICERS_DISABLED = false;
    }
}

async function checkMaintenanceStatus() {
    console.log('[MAINTENANCE] 🔄 Checking status...');
    
    try {
        // RE-FETCH maintenance.js from Cloudflare
        const response = await fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/maintenance', {
            cache: 'no-store'
        });
        
        const maintenanceScript = await response.text();
        
        // Execute the script to update window.MAINTENANCE
        eval(maintenanceScript);
        
        console.log('[MAINTENANCE] Updated from server:', window.MAINTENANCE);

        

        // Get current maintenance status
        const currentStatus = window.MAINTENANCE || false;
        
        // ✅ Get PREVIOUS maintenance status from localStorage
        const previousStatus = localStorage.getItem('maintenanceWasActive') === 'true';
        
        console.log('[MAINTENANCE] Current:', currentStatus, '| Previous:', previousStatus);
        
        // ✅ CHECK: Was maintenance active, but now it's not?
        if (previousStatus && !currentStatus) {
            console.log('[MAINTENANCE] 🔄 Maintenance ENDED! Showing update screen');
            setMaintenanceActive(false);
            setShowUpdateScreen(true);
            setPreviousVersion(APP_VERSION); // Same version (maintenance, not upgrade)
        }
        // If maintenance is currently active
        else if (currentStatus) {
            if (window.APP_GITHUB_BRANCH && window.APP_GITHUB_BRANCH !== 'main') {
                console.log('[MAINTENANCE] 🚧 Maintenance active but bypassed — testing branch');
                setMaintenanceActive(false);
            } else {
                console.log('[MAINTENANCE] 🚧 Maintenance active');
                setMaintenanceActive(true);
            }
        } 
        // Normal operation (no maintenance)
        else {
            console.log('[MAINTENANCE] ✅ No maintenance');
            setMaintenanceActive(false);
        }
        
        // ✅ Save current status for next check
        localStorage.setItem('maintenanceWasActive', currentStatus.toString());
        setLastMaintenanceCheck(Date.now());
        
    } catch (err) {
        console.error('[MAINTENANCE] Check failed:', err);
        setMaintenanceActive(false);
    }
}

const processVoskText = (text) => {
    console.log('[PHONETIC] Raw text from Whisper:', text);
    const words = text.toLowerCase().trim().replace(/[.,!?]/g, '').split(/\s+/);
    let built = '';
    let anyMapped = false;

    for (const w of words) {
        if (w === 'space') { built += ' '; anyMapped = true; continue; }
        if (w === 'enter') continue;
        // Handle raw digits Whisper returns directly ("1", "2", "123")
        if (/^\d+$/.test(w)) {
            built += w;
            anyMapped = true;
            continue;
        }
        // Handle comma-separated digits ("1,2,3")
        if (/^[\d,]+$/.test(w)) {
            built += w.replace(/,/g, '');
            anyMapped = true;
            continue;
        }
        const mapped = PHONETIC_MAP[w];
        if (mapped) {
            built += mapped;
            anyMapped = true;
        } else {
            // Fuzzy match — try prefix matching for partial words (e.g. "alphas" → "alpha")
            const fuzzy = Object.keys(PHONETIC_MAP).find(k => w.startsWith(k) || k.startsWith(w));
            if (fuzzy) {
                built += PHONETIC_MAP[fuzzy];
                anyMapped = true;
            }
        }
    }

    if (!anyMapped || built.trim() === '') {
setVoiceNotif('Phonetic alphabet was not detected during translation. Make sure you have enabled the correct phonetic alphabet in the settings tab.');
        setVoiceActive(false);
        setTimeout(() => setVoiceNotif(''), 4000);
        return;
    }

    const final = built.toUpperCase();
    console.log('[PHONETIC] Mapped result:', final);
    // Apply same variant logic as manual search — try with hyphen inserted
    const withHyphen = (() => {
        const m = final.match(/^([A-Z]{2,})([A-Z])(\d+)$/);
        if (m) return `${m[1]}-${m[2]}${m[3]}`;
        const m2 = final.match(/^([A-Z]{3})(\d{3,4})$/);
        if (m2) return `${m2[1]}-${m2[2]}`;
        const m3 = final.match(/^([A-Z]+)(\d+)$/);
        if (m3) return `${m3[1]}-${m3[2]}`;
        return final;
    })();
    const plateToSearch = withHyphen !== final ? withHyphen : final;
    setLicensePlate(plateToSearch);
setVoiceNotif('Heard: "' + text + '" → Plate set to: ' + plateToSearch + ' - searching...');
    setVoiceActive(false);
    setTimeout(() => setVoiceNotif(''), 3000);
    setTimeout(() => lookupUser(plateToSearch), 300);
};

// Service status polling
const activeServiceAlertsRef = React.useRef({});
useEffect(() => {
    const SERVICE_CHECKS = [
        { key: 'discord',    url: 'https://discordstatus.com/api/v2/status.json',        name: 'Discord' },
        { key: 'github',     url: 'https://www.githubstatus.com/api/v2/status.json',     name: 'GitHub' },
        { key: 'cloudflare', url: 'https://www.cloudflarestatus.com/api/v2/status.json', name: 'Cloudflare' },
        { key: 'groq',       url: 'https://groqstatus.com/api/v2/status.json',           name: 'Groq AI' },
    ];

    const checkServices = async () => {
        const results = {};
        await Promise.all(SERVICE_CHECKS.map(async ({ key, url }) => {
            try {
                const resp = await Promise.race([
                    fetch(url, { cache: 'no-store' }),
                    new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 6000))
                ]);
                if (!resp.ok) { results[key] = 'unknown'; return; }
                const data = await resp.json();
                const indicator = data?.status?.indicator;
                results[key] = indicator === 'none' ? 'operational' : indicator === 'minor' ? 'degraded' : 'outage';
            } catch {
                results[key] = 'unknown';
            }
        }));

        setServiceStatus(prev => ({ ...prev, ...results }));

        // Only add/remove announcements when status actually changes
        SERVICE_CHECKS.forEach(({ key, name }) => {
            const status = results[key];
            const announcementKey = `__service_${key}`;
            const alreadyAlerted = activeServiceAlertsRef.current[key];
            const isProblematic = status === 'degraded' || status === 'outage';

            if (isProblematic && !alreadyAlerted) {
                // New problem — add announcement and mark as alerted
                const severity = status === 'outage'
                    ? 'is currently experiencing a service outage'
                    : 'is currently experiencing degraded performance';
                const msg = `⚠ SERVICE ALERT: ${name} ${severity}. Some CAD features may be unavailable or unstable. Please stand by.`;
                window[`__serviceMsg_${key}`] = msg;
                window.LIVEANNOUNCEMENTS = { ...(window.LIVEANNOUNCEMENTS || {}), [announcementKey]: msg };
                setLiveAnnouncements(prev => ({ ...prev, [announcementKey]: msg }));
                activeServiceAlertsRef.current[key] = true;
            } else if (!isProblematic && alreadyAlerted) {
                // Recovered — remove announcement
                const updated = { ...(window.LIVEANNOUNCEMENTS || {}) };
                delete updated[announcementKey];
                window.LIVEANNOUNCEMENTS = updated;
                setLiveAnnouncements(prev => { const n = { ...prev }; delete n[announcementKey]; return n; });
                activeServiceAlertsRef.current[key] = false;
                delete window[`__serviceMsg_${key}`];
            }
            // If status unchanged — do nothing, no duplicate
        });
    };

    checkServices();
    const interval = setInterval(checkServices, 60000);
    return () => clearInterval(interval);
}, []);

const base64ToArrayBuffer = (base64) => {
    // ✅ Remove data URL prefix if present
    let base64String = base64;
    if (base64.includes('base64,')) {
        base64String = base64.split('base64,')[1];

const executeCommand = (rawInput) => {
    const parts = rawInput.trim().split(/\s+/);
    const cmdPart = parts[0].toLowerCase();
    const argPart = parts.slice(1).join(' ').trim();

    const matched = COMMANDS.find(c => c.cmd === cmdPart);

    if (!matched) {
        triggerCommandBarError('Unknown command');
        return;
    }

    if (matched.requiresInput && !argPart) {
        if (cmdPart === '/search') setCommandBarHint('Enter a license plate to search → opens RUN LICENSEPLATE TAB');
        if (cmdPart === '/lookup') setCommandBarHint('Enter a citizen name or ID → opens ID LOOKUP / CITIZENID');
        return;
    }

    try {
        setCommandBarHint('');
        setCommandBarOpen(false);
        setCommandBarInput('/');

        if (cmdPart === '/search') {
            setActiveView('search');
            setTimeout(() => lookupUser(argPart.toUpperCase()), 100);
        } else if (cmdPart === '/lookup') {
            setSearchUsername(argPart);
            setSearchCitizenId(argPart);
            setActiveView('database-search');
            setTimeout(() => searchByUsername(argPart), 300);
        } else if (cmdPart === '/licenseplate') {
            setActiveView('search');

        } else if (cmdPart === '/calls') {

const checkDatabaseConnection = async () => {
    if (!tokenSaved || !discordToken || !trooperSettings) {
        setDatabaseStatus({ connected: false, checking: false });
        return;
    }
    
    try {
const channelsToCheck = [
    trooperSettings?.RegistrationChannelID,
    trooperSettings?.DatabaseChannelID,
            selectedUserSession
        ].filter(Boolean);
        
        const checks = await Promise.all(
            channelsToCheck.map(async (channelId) => {
                try {
                    const resp = await fetch(`https://discord.com/api/v9/channels/${channelId}`, {
                        headers: { 'Authorization': discordToken }
                    });
                    return resp.ok;
                } catch {
                    return false;
                }
            })
        );
        
        const allValid = checks.every(check => check === true);
        setDatabaseStatus({ connected: allValid, checking: false });
        
        if (!allValid) {
            addLog('⚠️ Database connection error: Invalid channel IDs or token', 'error');
        }
    } catch (e) {
        setDatabaseStatus({ connected: false, checking: false });
        addLog(`❌ Database check failed: ${e.message}`, 'error');
    }
};

// Presence heartbeat — fires immediately then every 80s whenever token/session/status changes
// Presence heartbeat — fires immediately then every 110s, but only sends if data changed or TTL refresh needed
React.useEffect(() => {
    if (!tokenSaved || !trooperSettings?.BadgeID || trooperSettings.BadgeID === 'N/A') return;
    const send = (force = false) => {
if (window.AVAILABLE_OFFICERS_DISABLED) { console.log('[BACKEND DATA OFFICER]: ⛔ Heartbeat skipped — feature disabled by Cloudflare'); return; }
        // Send any pending APEX misread report
        if (pendingApexReport?.corrected && !pendingApexReport.sent) {
            fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/apex-report', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...pendingApexReport, badge: trooperSettings?.BadgeID, reportedAt: Date.now() })
            }).then(() => setPendingApexReport(prev => ({ ...prev, sent: true }))).catch(() => {});
        }
        console.log(`[BACKEND DATA OFFICER]: Sending heartbeat — Badge #${trooperSettings.BadgeID} | ${trooperSettings.FirstName} ${trooperSettings.LastName} | Zone ${trooperSettings.Zone || '-'} | Session ${selectedUserSession || 'none'} | Status ${officerStatus}`);
        const payload = {
            badge: trooperSettings.BadgeID,
            callSign: trooperSettings.CallSign || trooperSettings.BadgeID,
            firstName: trooperSettings.FirstName || '',
            lastName: trooperSettings.LastName || '',
            zone: trooperSettings.Zone || '-',
            session: selectedUserSession || null,
            status: officerStatus
        };
        const fingerprint = JSON.stringify(payload);
        const now = Date.now();
        // Skip write if nothing changed AND last send was under 200s ago (TTL is 250s)
        if (!force && window._lastPresenceFingerprint === fingerprint && window._lastPresenceSent && (now - window._lastPresenceSent) < 200000) {
            console.log('[BACKEND DATA OFFICER]: Heartbeat skipped — no change');
            return;
        }
        window._lastPresenceFingerprint = fingerprint;
        window._lastPresenceSent = now;
        console.log(`[BACKEND DATA OFFICER]: Sending heartbeat — Badge #${trooperSettings.BadgeID} | ${trooperSettings.FirstName} ${trooperSettings.LastName} | Zone ${trooperSettings.Zone || '-'} | Session ${selectedUserSession || 'none'} | Status ${officerStatus}`);
        fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/presence', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(d => console.log(`[BACKEND DATA OFFICER]: Heartbeat acknowledged by Cloudflare —`, d))
        .catch(e => console.error(`[BACKEND DATA OFFICER]: Heartbeat failed —`, e.message));
    };
    console.log(`[BACKEND DATA OFFICER]: Presence system starting for Badge #${trooperSettings.BadgeID}`);
    send(true); // always send on first mount
    const id = setInterval(send, 110000);
    return () => {
        console.log(`[BACKEND DATA OFFICER]: Presence heartbeat stopped`);
        clearInterval(id);
    };
}, [tokenSaved, trooperSettings, selectedUserSession, officerStatus]);

const fetchAvatarAsBase64 = async (userId) => {
    // Proxies to try in order
    const proxies = [
        (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        (url) => url  // direct last resort
    ];

    const thumbnailApiUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png`;

    for (const makeProxied of proxies) {
        try {
            // Step 1: get the JSON that contains the CDN URL
            const jsonResp = await Promise.race([
                fetch(makeProxied(thumbnailApiUrl)),
                new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 5000))
            ]);
            if (!jsonResp.ok) continue;

            const jsonData = await jsonResp.json();
            const cdnUrl = jsonData?.data?.[0]?.imageUrl;
            if (!cdnUrl) continue;

            // Step 2: fetch the actual image bytes through the same proxy
            const imgResp = await Promise.race([
                fetch(makeProxied(cdnUrl)),
                new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 5000))
            ]);
            if (!imgResp.ok) continue;

            const blob = await imgResp.blob();

            // Step 3: convert to base64 data URL
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            console.log(`✅ [AVATAR] Fetched as base64 for userId ${userId} via proxy`);
            return base64; // "data:image/png;base64,..."

        } catch (e) {
            console.warn(`⚠️ [AVATAR] Proxy failed for ${userId}:`, e.message);
        }
    }

    console.error(`❌ [AVATAR] All proxies failed for userId ${userId}`);
    return null;
};

React.useEffect(() => {

        const buttons = document.querySelectorAll('.btn-ripple');

                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.6)';
                ripple.style.pointerEvents = 'none';
                ripple.style.animation = 'ripple-effect 0.6s ease-out';
                
                this.appendChild(ripple);

        });

                const lines = settingsContent.split('\n');
                lines.forEach(line => {
                    const eq = line.indexOf('=');
                    if (eq < 0) return;
                    const key = line.substring(0, eq).trim();

                    if (key === 'DiscordAccountToken') { setDiscordToken(val); localStorage.setItem('discordToken', val); }

if (key === 'ACTIONBAR_KEYBIND') setActionBarKeybind(val);

                    if (key === 'PHONETIC_MODE') setPhoneticMode(val);

                    if (key === 'AmericanDateFormat') setTrooperSettings(prev => ({ ...prev, AmericanDateFormat: val }));
                    
                });

            } else {
                throw new Error(result.error || 'Write failed');
            }
        } else {
            const blob = new Blob([settingsContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;

                        const cleanContent = content.replace(/[^a-zA-Z]/g, '');

const generatePlateVariants = (plate) => {
    const normalized = normalizePlate(plate);
    const variants = new Set();
    
    // Add normalized version (no spaces/hyphens)
    variants.add(normalized);
    
    // Add original (as typed)
    variants.add(plate.toUpperCase());
    
    // Pattern 1: ABC123 → ABC 123, ABC-123
    const letterSplit = normalized.match(/^([A-Z]+)(\d+)$/);
    if (letterSplit) {
        variants.add(`${letterSplit[1]} ${letterSplit[2]}`);
        variants.add(`${letterSplit[1]}-${letterSplit[2]}`);
    }
    
    // Pattern 2: 123ABC → 123 ABC, 123-ABC
    const numLetterSplit = normalized.match(/^(\d+)([A-Z]+)$/);
    if (numLetterSplit) {
        variants.add(`${numLetterSplit[1]} ${numLetterSplit[2]}`);
        variants.add(`${numLetterSplit[1]}-${numLetterSplit[2]}`);
    }
    
    // Pattern 3: V36ZGG → V36 ZGG, V-36-ZGG, V 36ZGG, V36-ZGG
    const mixedPattern = normalized.match(/^([A-Z])(\d+)([A-Z]+)$/);
    if (mixedPattern) {
        variants.add(`${mixedPattern[1]}${mixedPattern[2]} ${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]}-${mixedPattern[2]}-${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]} ${mixedPattern[2]}${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]}${mixedPattern[2]}-${mixedPattern[3]}`);
    }

    // Pattern 4: ABC-D12, QUR-S75 style (letters-letter+digits)
    const dashLetterNum = normalized.match(/^([A-Z]{2,})([A-Z])(\d+)$/);
    if (dashLetterNum) {
        variants.add(`${dashLetterNum[1]}-${dashLetterNum[2]}${dashLetterNum[3]}`);
        variants.add(`${dashLetterNum[1]}-${dashLetterNum[2]}-${dashLetterNum[3]}`);
        variants.add(`${dashLetterNum[1]} ${dashLetterNum[2]}${dashLetterNum[3]}`);
    }

    // Pattern 5: ABC-123 style (3 letters hyphen 3 digits) — JSV-3591, ZVO-3652
    const threeThree = normalized.match(/^([A-Z]{3})(\d{3,4})$/);
    if (threeThree) {
        variants.add(`${threeThree[1]}-${threeThree[2]}`);
        variants.add(`${threeThree[1]} ${threeThree[2]}`);
    }
    
    console.log('🔍 [VARIANTS] Generated variants:', Array.from(variants));
    return Array.from(variants);
};

const getShiftDuration = () => {
    if (!shiftStartTime || !shiftEndTime) return '';
    const diff = shiftEndTime - shiftStartTime;
    const hours = Math.floor(diff / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    return `${hours}h ${minutes}m ${seconds}s`;
};

console.log('🔍 [PARSE] Extracting vehicle blocks...');

    } else {

        const validYears = ['1952', '1995', '1996', '1997', '1998', '1999', '2000', '2001', '2002', '2003', '2004', '2005', '2006', '2007', '2008', '2009', '2010', '2011', '2012', '2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026', '2027', '2028'];
        
        // ✅ THE MISSING YEAR DETECTION LOOP
        for (const line of lines) {
            // Skip empty lines and username mentions
            if (!line || line.includes('<@') || /^@\w/.test(line)) continue;
            
            // Check if this line is a valid year
            const isYear = /^\d{4}$/.test(line) && validYears.includes(line);
            
            if (isYear) {
                // Year found - start new vehicle block
                if (currentCar.length > 0) {
                    console.log('🚗 [YEAR] Completed block with', currentCar.length, 'lines');

                }

                console.log('🚗 [YEAR] Starting new block with year:', line);

                // Separator found - end current block
                if (currentCar.length > 0) {
                    console.log('🚗 [SEP] Separator found, completed block');
                    carBlocks.push([...currentCar]);
                }
                currentCar = [];
            } else if (currentCar.length > 0) {
                // Add line to current block
                currentCar.push(line);
            }
        }
        
        // Push final block
        if (currentCar.length > 0) {
            console.log('📦 [PARSE] Found final vehicle block:', currentCar);
            carBlocks.push(currentCar);
        }
    }

    
    console.log('✅ [PARSE] Total vehicle blocks found:', carBlocks.length);
    
    if (carBlocks.length === 0) {
        console.warn('⚠️ [PARSE] No vehicle blocks found in message');
        console.log('📝 [PARSE] Message content was:', fullText);
        console.log('📝 [PARSE] Lines were:', lines);
        return null;
    }

    
    // Parse each vehicle block with AI
    console.log('🤖 [PARSE] Parsing all vehicles with AI...');
    
    const vehicles = [];
    for (const block of carBlocks) {
        try {
            // Use parseVehicleBlockFromLines which tries AI first
            const vehicle = await parseVehicleBlockFromLines(block, discordUserId, timestamp, message.edited_timestamp);
            
            if (vehicle) {
                vehicles.push(vehicle);
                console.log('✅ [PARSE] Vehicle parsed:', vehicle.plate);
            } else {
                console.warn('⚠️ [PARSE] Vehicle parsing returned null');
            }
        } catch (error) {
            console.error('❌ [PARSE] Error parsing vehicle:', error);
        }
    }
    
    console.log('✅ [PARSE] Parsed', vehicles.length, 'vehicles');
    console.log('═══════════════════════════════════════════════════');
    
    // Return error object instead of null if parsing failed
    if (vehicles.length === 0) {
        console.error('❌ [PARSE] No vehicles could be parsed from message');
        console.error('❌ [PARSE] RETURNING parseError OBJECT');
        const errorObj = {
            parseError: true,
            errorMessage: 'Vehicle details could not be parsed by AI/Manual Parser. Manual search needs to be conducted.'
        };
        console.error('❌ [PARSE] Error object:', errorObj);
        return errorObj;
    }
    
    if (vehicles.length === 1) {
        return vehicles[0];
    }
    
    return {
        multipleVehicles: true,
        vehicles: vehicles
    };
};

const lookupRobloxUser = async (username, retryCount = 0) => {
    const maxRetries = 3;
    
    setLoadingRoblox(true);
    setRobloxError(null); // Clear errors immediately
    setRobloxLoadingStage(retryCount > 0 ? `Retrying... (Attempt ${retryCount + 1}/${maxRetries + 1})` : 'Searching...');
    const cleanUsername = username.trim();
    
    if (!cleanUsername || cleanUsername.length === 0) {
        setRobloxError('Invalid username provided');
        setLoadingRoblox(false);
        addLog('❌ Empty or invalid username', 'error');
        return;
    }
    
    addLog(`🔍 Searching Roblox for: ${cleanUsername}${retryCount > 0 ? ` (Retry ${retryCount}/${maxRetries})` : ''}`, 'info');
    
    try {
        const proxies = [
            { name: 'Direct API', url: (endpoint) => endpoint },
            { name: 'AllOrigins', url: (endpoint) => `https://api.allorigins.win/raw?url=${encodeURIComponent(endpoint)}` },
            { name: 'CorsProxy', url: (endpoint) => `https://corsproxy.io/?${encodeURIComponent(endpoint)}` },
            { name: 'CodeTabs', url: (endpoint) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(endpoint)}` }
        ];
        
        const searchUrl = `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=25`;
        
        addLog('Trying proxy fetch...', 'info');
        
        const searchPromises = proxies.map(async (proxy) => {
            try {
                const resp = await Promise.race([
                    fetch(proxy.url(searchUrl)),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500))
                ]);
                
                if (resp.ok) {
                    const data = await resp.json();
                    if (data?.data?.[0]) {
                        return { success: true, data, proxy: proxy.name };
                    }
                }
                return { success: false };
            } catch (e) {
                return { success: false };
            }
        });
        
        const successResult = await raceProxies(searchPromises);
        
        if (successResult) {
            addLog(`✅ Success with ${successResult.proxy}!`, 'success');
            const exactMatch = successResult.data.data.find(u => u.name.toLowerCase() === username.toLowerCase());
            const userData = exactMatch || successResult.data.data[0];
            
            const userId = userData.id;
            const userName = userData.name;
            
            addLog(`✅ Found: ${userName} (${userId})`, 'success');
            setRobloxLoadingStage('Loading profile...');
            
            let avatarUrl = null;
            let joinDate = 'Unknown';
            let displayName = userData.displayName || userName;
            
            try {
                const avatarPromises = proxies.map(async (proxy) => {
                    try {
                        const avatarResp = await Promise.race([
                            fetch(proxy.url(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png`)),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500))
                        ]);
                        
                        if (avatarResp.ok) {
                            const avatarData = await avatarResp.json();
                            return avatarData?.data?.[0]?.imageUrl;
                        }
                        return null;
                    } catch (e) {
                        return null;
                    }
                });
                
                const detailsPromises = proxies.map(async (proxy) => {
                    try {
                        const detailsResp = await Promise.race([
                            fetch(proxy.url(`https://users.roblox.com/v1/users/${userId}`)),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500))
                        ]);
                        
                        if (detailsResp.ok) {
                            const detailsData = await detailsResp.json();
                            return detailsData;
                        }
                        return null;
                    } catch (e) {
                        return null;
                    }
                });
                
                const [avatarResults, detailsResults] = await Promise.all([
                    Promise.all(avatarPromises),
                    Promise.all(detailsPromises)
                ]);
                
                avatarUrl = avatarResults.find(url => url) || null;
                const detailsData = detailsResults.find(d => d) || null;
                
                if (detailsData) {
                    joinDate = detailsData.created ? new Date(detailsData.created).toLocaleDateString() : 'Unknown';
                    displayName = detailsData.displayName || userData.displayName || userName;
                }
            } catch (e) {
                addLog(`⚠️ Avatar/details partial failure: ${e.message}`, 'info');
            }
            
            setResult({ 
                username: userName, 
                userId: userId, 
                displayName: displayName, 
                avatarUrl: avatarUrl,
                joinDate: joinDate
            });
            
            addLog('✅ Profile loaded!', 'success');
            setLoadingRoblox(false);
            setRobloxLoadingStage('');
            return;
        }
        
        if (retryCount < maxRetries) {
            const waitTime = Math.min(2000 * Math.pow(2, retryCount), 8000);
            addLog(`⚠️ Search failed, retrying in ${waitTime/1000} seconds... (${retryCount + 1}/${maxRetries})`, 'info');
            await new Promise(resolve => setTimeout(resolve, waitTime));
            return lookupRobloxUser(username, retryCount + 1);
        }
        
        const errorMsg = `No Roblox user found for "${username}" after ${maxRetries + 1} attempts`;
        addLog(`❌ ${errorMsg}`, 'error');
        setRobloxError(errorMsg);
        setLoadingRoblox(false);
        setRobloxLoadingStage('');
        
    } catch (e) {
        if (retryCount < maxRetries) {
            const waitTime = Math.min(2000 * Math.pow(2, retryCount), 8000);
            addLog(`⚠️ Error occurred, retrying in ${waitTime/1000} seconds... (${retryCount + 1}/${maxRetries})`, 'info');
            await new Promise(resolve => setTimeout(resolve, waitTime));
            return lookupRobloxUser(username, retryCount + 1);
        }
        
        const errorMsg = `Error: ${e.message} (after ${maxRetries + 1} attempts)`;
        addLog(`❌ ${errorMsg}`, 'error');
        console.error('Full error:', e);
        setRobloxError(errorMsg);
        setLoadingRoblox(false);
        setRobloxLoadingStage('');
    }
};

        let allMessages = [];

                setRecordsLoadingStage(`Found ${streamingRecordsRef.current.length} record${streamingRecordsRef.current.length !== 1 ? 's' : ''}...`);
            }

            allMessages = allMessages.concat(messages);
            lastMessageId = messages[messages.length - 1].id;
            
            if (messages.length < 100) {
                console.log('✅ Last page (received < 100 messages)');
                break;
            }
        }
        
        console.log(`✅ [STEP 3/4] Fetched ${allMessages.length} total messages from ${pageCount} pages`);
        addLog(`Searched ${allMessages.length} messages from database`, 'info');
        
        // STEP 4: Full parse with all details (overwrites streaming results)
        console.log('📋 [STEP 4/4] Full parse for details...');
        
        const records = [];
        let recordCount = {
            citation: 0,
            mailedCitation: 0,
            writtenWarning: 0,
            vehicleRemoval: 0,
            summons: 0,
            arrest: 0,
            pointsAmend: 0,
            benchWarrant: 0,
            arrestWarrant: 0,
            total: 0
        };
        
        for (const msg of allMessages) {
            const content = msg.content;
            
            // Look for mentions of this user
            if (!content.includes(`<@${cleanUserId}>`) && !content.includes(`@${cleanUserId}`)) {
                continue;
            }
            
            // Determine record type
            let recordType = null;
            
            if (content.includes('**Citation**') && !content.includes('**Mailed Citation**')) {
                recordType = 'Citation';
                recordCount.citation++;
            } else if (content.includes('**Mailed Citation**')) {
                recordType = 'Mailed Citation';
                recordCount.mailedCitation++;
            } else if (content.includes('**Written Warning**')) {
                recordType = 'Written Warning';
                recordCount.writtenWarning++;
            } else if (content.includes('**Vehicle Removal**') || content.includes('**NYSDOT Removal Record**')) {
                recordType = 'Vehicle Removal';
                recordCount.vehicleRemoval++;
            } else if (content.includes('**Summons**')) {
                recordType = 'Summons';
                recordCount.summons++;
            } else if (content.includes('**Arrest Report**') || content.includes('**Arrest**')) {
                recordType = 'Arrest';
                recordCount.arrest++;
            } else if (content.includes('**Points Amend**')) {
                recordType = 'Points Amend';
                recordCount.pointsAmend++;
            } else if (content.includes('**Bench Warrant**')) {
                recordType = 'Bench Warrant';
                recordCount.benchWarrant++;
            } else if (content.includes('**Arrest Warrant**')) {
                recordType = 'Arrest Warrant';
                recordCount.arrestWarrant++;
            } else {
                continue; // Not a government record
            }
            
            recordCount.total++;
            console.log(`📄 Found ${recordType} from ${msg.author.username} (${new Date(msg.timestamp).toLocaleDateString()})`);
            
            // Extract penal codes
            const penalCodes = [];
            const codeMatches = content.matchAll(/[`´]§\s*(\d+[A-Z]*)|§\s*(\d+[A-Z]*)/gi);
            for (const match of codeMatches) {
                const code = match[1] || match[2];
                if (code) {
                    penalCodes.push('§ ' + code);
                }
            }
            
            // Extract points
            let totalPoints = null;
            const pointsMatch = content.match(/Points:\s*([\d.]+)/i);
            if (pointsMatch) totalPoints = parseFloat(pointsMatch[1]);
            
            // Extract point change (handles formats like "+ 2 PTS" and "-# + 2 PTS")
            let pointChange = null;
            // Try standard format first: "+ X PTS" or "- X PTS"
            const addMatch = content.match(/[+]\s*(\d+)\s*(?:Points?|PTS)/i);
            if (addMatch) pointChange = '+' + addMatch[1];
            const subMatch = content.match(/[-]\s*(\d+)\s*(?:Points?|PTS)/i);
            if (subMatch) pointChange = '-' + subMatch[1];
            
            // If no match, try alternate format: "-# + X PTS" or "-# - X PTS"
            if (!pointChange) {
                const altAddMatch = content.match(/-#\s*[+]\s*(\d+)\s*(?:Points?|PTS)/i);
                if (altAddMatch) pointChange = '+' + altAddMatch[1];
                const altSubMatch = content.match(/-#\s*[-]\s*(\d+)\s*(?:Points?|PTS)/i);
                if (altSubMatch) pointChange = '-' + altSubMatch[1];
            }
            
            // Extract issuer (for warrants)
            let issuer = null;
            const issuerMatch = content.match(/\/s\/\s*(.+?)(?:\n|$)/i);
            if (issuerMatch) issuer = issuerMatch[1].trim();
            
            // Extract attachments
            const attachments = msg.attachments ? msg.attachments.map(att => ({
                url: att.url,
                proxyUrl: att.proxy_url,
                filename: att.filename,
                width: att.width,
                height: att.height,
                contentType: att.content_type
            })) : [];
            
            const record = {
                id: msg.id,
                type: recordType,
                authorUsername: msg.author.username,
                authorId: msg.author.id,
                timestamp: msg.timestamp,
                editedTimestamp: msg.edited_timestamp,
                content: content,
                penalCodes: penalCodes,
                totalPoints: totalPoints,
                pointChange: pointChange,
                issuer: issuer,
                attachments: attachments,
                citizenId: cleanUserId
            };
            
            records.push(record);
            // Stream records progressively as they're parsed (newest first so far)
            const sorted = [...records].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            setPastRecords(sorted);
            setRecordsLoadingStage(`Loading... ${records.length} record${records.length !== 1 ? 's' : ''} found`);
        }
        
        // Final sort newest first
        records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        console.log('═══════════════════════════════════════════════');
        console.log('✅ [SEARCH COMPLETE] Government Records Summary:');
        console.log(`   Total Records: ${recordCount.total}`);
        console.log(`   📝 Citations: ${recordCount.citation}`);
        console.log(`   📧 Mailed Citations: ${recordCount.mailedCitation}`);
        console.log(`   ⚠️ Written Warnings: ${recordCount.writtenWarning}`);
        console.log(`   🚛 Vehicle Removals: ${recordCount.vehicleRemoval}`);
        console.log(`   📋 Summons: ${recordCount.summons}`);
        console.log(`   🚨 Arrests: ${recordCount.arrest}`);
        console.log(`   ⚖️ Points Amendments: ${recordCount.pointsAmend}`);
        console.log(`   🔴 Bench Warrants: ${recordCount.benchWarrant}`);
        console.log(`   🔴 Arrest Warrants: ${recordCount.arrestWarrant}`);
        console.log('═══════════════════════════════════════════════');
        
        // Sort newest first and set
        records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        setPastRecords(records);
        setRecordsLoadingStage('');
        addLog(`✅ Found ${recordCount.total} government records for ${fetchedUsername}`, 'success');
        
    } catch (error) {
        console.error('❌ [RECORDS] Error:', error);
        console.error('Stack:', error.stack);
        showCustomError('Error', `Failed to fetch records: ${error.message}`);
        setPastRecords([]);
    } finally {
        setLoadingPastRecords(false);
    }
};

// Helper functions to extract data from message content
function extractPlate(content) {
    const plateMatch = content.match(/(?:LICENSE PLATE|PLATE|LP)[\s:]*([A-Z0-9\s]+)/i);
    return plateMatch ? plateMatch[1].trim() : null;
}

function extractVehicle(content) {
    const vehicleMatch = content.match(/(?:VEHICLE|CAR)[\s:]*(\d{4})?\s*([A-Za-z]+)\s+([A-Za-z0-9\s]+)/i);
    return vehicleMatch ? vehicleMatch[0].trim() : null;
}

function extractState(content) {
    const stateMatch = content.match(/(?:STATE|ST)[\s:]([A-Z]{2})/i);
    return stateMatch ? stateMatch[1] : null;
}

function extractColor(content) {
    const colorMatch = content.match(/(?:COLOR|COLOUR)[\s:]*([A-Za-z\s]+)/i);
    return colorMatch ? colorMatch[1].trim() : null;
}

                    const rvKey = PDFLib.PDFName.of('RV');
                    const ffKey = PDFLib.PDFName.of('Ff');
                    
                    const hasRV = rawField.dict.has(rvKey);
                    const ffValue = rawField.dict.get(ffKey);
                    const flags = ffValue ? ffValue.asNumber() : 0;

                    if (hasRV || isRichText) {
                        addLog(`Stripping rich text from: "${name}" (hasRV=${hasRV}, isRichText=${isRichText})`, 'info');

                        // Clear the RichText bit (bit 26) from Ff flags
                        if (isRichText) {

                            rawField.dict.set(ffKey, PDFLib.PDFNumber.of(newFlags));
                        }
                        addLog(`  → Done stripping "${name}"`, 'info');

const handleLogin = async () => {
if (window.MAINTENANCE === true && !(window.APP_GITHUB_BRANCH && window.APP_GITHUB_BRANCH !== 'main')) {
        console.log('[LOGIN] Blocked - Maintenance active');
        setMaintenanceActive(true);
        return;
    }

    setLoginError('');
    setIsLoggingIn(true);

    try {
        const response = await fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: loginUsername.trim(), 
                password: loginPassword 
            })
        });

        const result = await response.json();

        if (!result.success) {
            if (result.reason === 'banned') {
                if (soundSettings?.LoginAccessDenied && SOUNDS.LoginAccessDenied) {
                    try {
                        const audio = new Audio(SOUNDS.LoginAccessDenied);
                        audio.volume = 0.5;
                        audio.play().catch(e => console.log('Sound play failed:', e));
                    } catch (e) {}
                }
                setBanReason(result.bannedReason || 'No reason provided.');
                setShowBanScreen(true);
                setShowLoginScreen(false);
            } else {
                if (soundSettings?.LoginIncorrect && SOUNDS.LoginIncorrect) {
                    try {
                        const audio = new Audio(SOUNDS.LoginIncorrect);
                        audio.volume = 0.5;
                        audio.play().catch(e => console.log('Sound play failed:', e));
                    } catch (e) {}
                }
                setLoginError('Login details were not correct. Make sure you have put the correct details including your username and the password provided.');
            }
            setIsLoggingIn(false);
            return;
        }

        // ✅ Login successful
        const user = result.user;

        if (soundSettings?.LoginPageCorrect && SOUNDS.LoginPageCorrect) {
            try {
                const audio = new Audio(SOUNDS.LoginPageCorrect);
                audio.volume = 0.5;
                audio.play().catch(e => console.log('Sound play failed:', e));
            } catch (e) {}
        }

        console.log('[AUTH] ✅ Login successful for:', user.robloxUsername);

        setAuthenticatedUser(user);
        setTrooperData({
            robloxUsername: user.robloxUsername,
            patrolZone: user.patrolZone,
            firstName: user.firstName,
            lastName: user.lastName,
            badgeId: user.badgeId
        });

        localStorage.setItem('nysp_authenticated_user', JSON.stringify(user));
        localStorage.setItem('nysp_username', user.robloxUsername);

        // Offer to save credentials if not already saved or if they changed
        const savedUser = localStorage.getItem('nysp_saved_username');
        const savedPass = localStorage.getItem('nysp_saved_password');
        if (savedUser !== loginUsername.trim() || savedPass !== loginPassword) {
            setPendingSaveCredentials({ username: loginUsername.trim(), password: loginPassword });
            setShowSavePasswordPrompt(true);
        }
        localStorage.setItem('nysp_zone', user.patrolZone);
        localStorage.setItem('nysp_firstname', user.firstName);
        localStorage.setItem('nysp_lastname', user.lastName);
        localStorage.setItem('nysp_badgeid', user.badgeId);
        localStorage.setItem('nysp_department', user.department || 'NYSP');

        console.log('[AUTH] Trooper data stored:', {
            username: user.robloxUsername,
            zone: user.patrolZone,
            name: `${user.firstName} ${user.lastName}`,
            badge: user.badgeId
        });

        if (!user.callSign) {
            setShowDataCorruptedError(true);
            setIsLoggingIn(false);
            return;
        }

        setTrooperSettings({
            Username: user.robloxUsername,
            Zone: user.patrolZone,
            BadgeID: user.badgeId,
            CallSign: user.callSign || user.badgeId,
            FirstName: user.firstName,
            LastName: user.lastName,
            Department: user.department || 'NYSP'
        });

        setLoginFadingOut(true);
        setIsLoggingIn(false);
        setTimeout(() => {
            setShowLoginScreen(false);
            setLoginFadingOut(false);
            setShowLoader(true);
        }, 400);
        if (compactMode && window.require) {
            try { window.require('electron').ipcRenderer.send('toggle-compact-mode', true); } catch(_) {}
        }

    } catch (error) {
        console.error('[AUTH] Login error:', error);
        setLoginError('Connection error. Please check your internet connection and try again.');
        setIsLoggingIn(false);
    }
};
