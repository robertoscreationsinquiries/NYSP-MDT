    background: rgba(234, 179, 8, 0.2);
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid rgba(234, 179, 8, 0.3);
}

.shift-summary-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #1e3a8a, #334155);
    border: 2px solid #3b82f6;
    border-radius: 16px;
    padding: 32px;
    z-index: 10000;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    animation: popIn 0.3s ease-out;
}

.night-mode {
    filter: hue-rotate(180deg) brightness(0.8);
}

.night-mode * {
    color: #ffa500 !important;
}

/* ═══════════════════════════════════════════════
   NYSP MDT — LOADER  (UpdateLog-matched style)
   ═══════════════════════════════════════════════ */

.mdt-loader-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.97) 0%, rgba(15,23,42,0.99) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 1.2s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.mdt-loader-overlay::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    animation: loader-pulse-glow 3s ease-in-out infinite;
    pointer-events: none;
}

@keyframes loader-pulse-glow {
    0%,100% { opacity:0.4; transform:translate(-50%,-50%) scale(1); }
    50%     { opacity:0.7; transform:translate(-50%,-50%) scale(1.15); }
}

.mdt-loader-overlay.fade-out {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.03);
}

/* ── Central card ── */
.mdt-loader-card {
    position: relative;
    z-index: 1;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    border: 2px solid rgba(59,130,246,0.5);
    border-radius: 20px;
    padding: 48px 52px;
    width: 640px;
    max-width: 94vw;
    box-shadow:
        0 25px 80px rgba(59,130,246,0.35),
        0 0 120px rgba(59,130,246,0.15);
    animation: loader-fadein 0.5s ease-out;
    display: flex;
    flex-direction: column;
    gap: 0;
}

@keyframes loader-fadein {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
}

/* ── Header row ── */
.mdt-loader-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 3px solid rgba(59,130,246,0.3);
    margin-bottom: 28px;
}

.mdt-loader-icon-box {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(59,130,246,0.5);
    flex-shrink: 0;
    animation: loader-float 3s ease-in-out infinite;
}

@keyframes loader-float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
}

.mdt-loader-title {
    color: white;
    font-size: 34px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin: 0;
    text-shadow: 0 0 30px rgba(59,130,246,0.8);
    line-height: 1;
}

.mdt-loader-subtitle {
    color: #60a5fa;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 6px 0 0 0;
}

/* ── Check rows ── */
.mdt-loader-checks {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
}

.mdt-check-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(30,58,138,0.25), rgba(15,23,42,0.7));
    border: 1.5px solid rgba(59,130,246,0.25);
    border-radius: 10px;
    transition: all 0.3s;
    min-height: 44px;
}

.mdt-check-row.active {
    border-color: rgba(59,130,246,0.6);
    background: linear-gradient(135deg, rgba(30,58,138,0.45), rgba(15,23,42,0.85));
    box-shadow: 0 4px 20px rgba(59,130,246,0.25);
}

.mdt-check-row.done-ok {
    border-color: rgba(34,197,94,0.4);
    background: linear-gradient(135deg, rgba(20,83,45,0.25), rgba(15,23,42,0.7));
}

.mdt-check-row.done-warn {
    border-color: rgba(234,179,8,0.4);
    background: linear-gradient(135deg, rgba(78,60,12,0.3), rgba(15,23,42,0.7));
}

.mdt-check-icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
}

.mdt-check-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #93c5fd;
    flex-shrink: 0;
    width: 160px;
}

.mdt-check-result {
    font-size: 12px;
    font-weight: 600;
    color: #bfdbfe;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    flex: 1;
}

.mdt-check-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(59,130,246,0.3);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: mdt-spin 0.8s linear infinite;
    flex-shrink: 0;
}

@keyframes mdt-spin {
    to { transform: rotate(360deg); }
}

/* ── Progress bar ── */
.mdt-loader-progress-wrap {
    margin-top: 4px;
}

.mdt-loader-progress-track {
    width: 100%;
    height: 8px;
    background: rgba(59,130,246,0.15);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    position: relative;
}

.mdt-loader-progress-track::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
    animation: loader-shimmer 1.8s infinite;
}

@keyframes loader-shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}

.mdt-loader-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
    background-size: 200% 100%;
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 16px rgba(59,130,246,0.8);
    animation: loader-grad-shift 2s ease infinite;
}

@keyframes loader-grad-shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.mdt-loader-progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #60a5fa;
}

/* ── Welcome banner ── */
.mdt-loader-welcome {
    text-align: center;
    margin-top: 20px;
    padding: 16px 24px;
    background: rgba(59,130,246,0.12);
    border: 2px solid rgba(59,130,246,0.4);
    border-radius: 12px;
    color: #93c5fd;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(59,130,246,0.25);
    animation: loader-welcome-pulse 2s ease-in-out infinite;
}

@keyframes loader-welcome-pulse {
    0%,100% { box-shadow: 0 6px 24px rgba(59,130,246,0.25); }
    50%     { box-shadow: 0 8px 36px rgba(59,130,246,0.5); }
}

/* ── Skip button ── */
.mdt-loader-skip {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(37,99,235,0.25));
    border: 2px solid rgba(59,130,246,0.55);
    border-radius: 10px;
    color: white;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10001;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(59,130,246,0.25);
}
.mdt-loader-skip:hover {
    background: linear-gradient(135deg, rgba(59,130,246,0.55), rgba(37,99,235,0.45));
    transform: translateX(-50%) translateY(-2px);
    box-shadow: 0 6px 24px rgba(59,130,246,0.45);
}


@keyframes popIn {
    0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
    }
    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
}

@keyframes pulse-glow {
    0%, 100% { 
        transform: translate(-50%, -50%) scale(1); 
        opacity: 0.3; 
    }
    50% { 
        transform: translate(-50%, -50%) scale(1.2); 
        opacity: 0.6; 
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes rotate-border {
    to { transform: rotate(360deg); }
}

@keyframes float {
    0%, 100% { 
        transform: translateY(0px) rotate(0deg); 
    }
    25% { 
        transform: translateY(-15px) rotate(-2deg); 
    }
    75% { 
        transform: translateY(-15px) rotate(2deg); 
    }
}

@keyframes glow-title {
    from { text-shadow: 0 0 40px rgba(59, 130, 246, 0.8), 0 4px 20px rgba(0, 0, 0, 0.8); }
    to { text-shadow: 0 0 60px rgba(59, 130, 246, 1), 0 4px 30px rgba(0, 0, 0, 0.8); }
}

@keyframes pulse-welcome {
    0%, 100% { 
        transform: scale(1);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
    }
    50% { 
        transform: scale(1.02);
        box-shadow: 0 8px 40px rgba(59, 130, 246, 0.5);
    }
}


@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes status-pulse {
    0% { transform: scale(0.95); opacity: 0; }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); opacity: 1; }
}


@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}



@keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes flash-red {
    0%, 100% { 
        background: linear-gradient(135deg, #ef4444, #dc2626);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
    }
    50% { 
        background: linear-gradient(135deg, #dc2626, #991b1b);
        box-shadow: 0 8px 24px rgba(239, 68, 68, 1);
    }
}

@keyframes spin-mdt {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse-ring {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}


@keyframes pulse-glow-green {
    0%, 100% { 
        box-shadow: 0 0 8px #10b981, 0 0 16px rgba(16, 185, 129, 0.5);
        transform: scale(1);
    }
    50% { 
        box-shadow: 0 0 12px #10b981, 0 0 24px rgba(16, 185, 129, 0.8);
        transform: scale(1.1);
    }
}

@keyframes pulse-glow-red {
    0%, 100% { 
        box-shadow: 0 0 8px #ef4444, 0 0 16px rgba(239, 68, 68, 0.5);
        transform: scale(1);
    }
    50% { 
        box-shadow: 0 0 12px #ef4444, 0 0 24px rgba(239, 68, 68, 0.8);
        transform: scale(1.1);
    }
}

@keyframes pulse-border-warrant {
    0%, 100% { 
        border-color: #991b1b;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        transform: scale(1);
    }
    50% { 
        border-color: #ef4444;
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
        transform: scale(1.02);
    }
}

/* Pulse border animation for error vehicle box */
@keyframes pulse-border-red {
    0%, 100% { 
        border-color: #dc2626;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    50% { 
        border-color: #ef4444;
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }
}

@keyframes flash-red-border {
    0%, 100% { 
        border-color: #ef4444;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    50% { 
        border-color: #dc2626;
        box-shadow: 0 0 30px rgba(239, 68, 68, 1);
    }
}

@media (max-width: 1024px) {
    .app-container { flex-direction: column; }
    .sidebar { width: 100%; }
    .results-grid { grid-template-columns: 1fr; }
    .card { max-width: 100%; padding: 20px; }
}

.page-transition-enter {
    opacity: 0;
    transform: translateY(20px);
}

.page-transition-active {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
}

.page-fade-out {
    opacity: 0;
    transform: translateY(-20px);
    transition: opacity 0.3s ease-in, transform 0.3s ease-in;
}

@media (min-width: 1600px) {
    .results-grid { grid-template-columns: 1fr 1.5fr; }
}

async function checkMaintenanceStatus() {
    console.log('[MAINTENANCE] 🔄 Checking status...');
    
    try {
        // RE-FETCH maintenance.js from Cloudflare
        const response = await fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/maintenance', {
            cache: 'no-store'
        });
        
        const maintenanceScript = await response.text();
        
        // Execute the script to update window.MAINTENANCE
        eval(maintenanceScript);
        
        console.log('[MAINTENANCE] Updated from server:', window.MAINTENANCE);
        
        // Get current maintenance status
        const currentStatus = window.MAINTENANCE || false;
        
        // ✅ Get PREVIOUS maintenance status from localStorage
        const previousStatus = localStorage.getItem('maintenanceWasActive') === 'true';
        
        console.log('[MAINTENANCE] Current:', currentStatus, '| Previous:', previousStatus);
        
        // ✅ CHECK: Was maintenance active, but now it's not?
        if (previousStatus && !currentStatus) {
            console.log('[MAINTENANCE] 🔄 Maintenance ENDED! Showing update screen');
            setMaintenanceActive(false);
            setShowUpdateScreen(true);
            setPreviousVersion(APP_VERSION); // Same version (maintenance, not upgrade)
        }
        // If maintenance is currently active
        else if (currentStatus) {
            console.log('[MAINTENANCE] 🚧 Maintenance active');
            setMaintenanceActive(true);
        } 
        // Normal operation (no maintenance)
        else {
            console.log('[MAINTENANCE] ✅ No maintenance');
            setMaintenanceActive(false);
        }
        
        // ✅ Save current status for next check
        localStorage.setItem('maintenanceWasActive', currentStatus.toString());
        setLastMaintenanceCheck(Date.now());
        
    } catch (err) {
        console.error('[MAINTENANCE] Check failed:', err);
        setMaintenanceActive(false);
    }
}

const processVoskText = (text) => {
    console.log('[PHONETIC] Raw text from Whisper:', text);
    const words = text.toLowerCase().trim().replace(/[.,!?]/g, '').split(/\s+/);
    let built = '';
    let anyMapped = false;

    for (const w of words) {
        if (w === 'space') { built += ' '; anyMapped = true; continue; }
        if (w === 'enter') continue;
        // Handle raw digits Whisper returns directly ("1", "2", "123")
        if (/^\d+$/.test(w)) {
            built += w;
            anyMapped = true;
            continue;
        }
        // Handle comma-separated digits ("1,2,3")
        if (/^[\d,]+$/.test(w)) {
            built += w.replace(/,/g, '');
            anyMapped = true;
            continue;
        }
        const mapped = PHONETIC_MAP[w];
        if (mapped) {
            built += mapped;
            anyMapped = true;
        }
    }

    if (!anyMapped || built.trim() === '') {
setVoiceNotif('Phonetic alphabet was not used during translation.');
        setVoiceActive(false);
        setTimeout(() => setVoiceNotif(''), 4000);
        return;
    }

    const final = built.toUpperCase();
    console.log('[PHONETIC] Mapped result:', final);
    setLicensePlate(final);
setVoiceNotif('✅ Heard: "' + text + '" → Plate set to: ' + final + ' — searching...');
    setVoiceActive(false);
    setTimeout(() => setVoiceNotif(''), 3000);
    setTimeout(() => lookupUser(final), 300);
};



const startVoicePlate = async () => {
    if (!useMicrophone) return;
    if (voiceActive) { stopVoicePlate(); return; }
    setVoiceNotif('Starting...');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceStreamRef.current = stream;

        // Live volume meter
        const ctx = new AudioContext();
        voiceAudioCtxRef.current = ctx;
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const meterData = new Uint8Array(analyser.frequencyBinCount);
        const meterTick = () => {
            if (!voiceStreamRef.current) return;
            analyser.getByteFrequencyData(meterData);
            const avg = meterData.reduce((a,b) => a+b,0) / meterData.length;
            setMicLevel(Math.min(100, Math.round((avg / 128) * 100)));
            requestAnimationFrame(meterTick);
        };
        meterTick();

        // Record using MediaRecorder
        const recorder = new MediaRecorder(stream);
        voiceProcessorRef.current = recorder;
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = async () => {
            setVoiceNotif('Processing...');
            setMicLevel(0);
            try {
const blob = new Blob(chunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('file', blob, 'audio.wav');
                formData.append('model', 'whisper-large-v3-turbo');
                formData.append('response_format', 'json');
                const apiKey = groqConsoleAPIKey || window.GROQ_CONSOLE_API_KEY || localStorage.getItem('groqConsoleAPIKey');
                const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + apiKey },
                    body: formData
                });
                const data = await res.json();
                console.log('[WHISPER] Response:', JSON.stringify(data));
                const text = data?.text?.trim();
                if (text) {
                    processVoskText(text);
                } else if (data?.error) {
                    setVoiceNotif('Groq error: ' + data.error.message);
                } else {
                    setVoiceNotif('No speech detected, try again');
                }
} catch(e) {
                setVoiceNotif('Error: ' + e.message);
                setVoiceActive(false);
            }
        };
        recorder.start();
        setVoiceActive(true);
        setVoiceNotif('Recording - click 🎙️ again when done to search');
    } catch(e) {
        setVoiceNotif('Error: ' + (e.message || 'Mic denied'));
        setVoiceActive(false);
    }
};

const base64ToArrayBuffer = (base64) => {
    // ✅ Remove data URL prefix if present
    let base64String = base64;
    if (base64.includes('base64,')) {
        base64String = base64.split('base64,')[1];
    }
    
    const binaryString = window.atob(base64String);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes.buffer;
};

    { cmd: '/lookup', requiresInput: true },

const getCommandSuggestion = (input) => {
    if (!input.startsWith('/')) return '';
    const lower = input.toLowerCase();
    const match = COMMANDS.find(c => c.cmd.startsWith(lower) && c.cmd !== lower);
    return match ? match.cmd.slice(lower.length) : '';
};

const executeCommand = (rawInput) => {
    const parts = rawInput.trim().split(/\s+/);
    const cmdPart = parts[0].toLowerCase();
    const argPart = parts.slice(1).join(' ').trim();

    const matched = COMMANDS.find(c => c.cmd === cmdPart);

    if (!matched) {
        triggerCommandBarError('Unknown command');
        return;
    }

    if (matched.requiresInput && !argPart) {
        if (cmdPart === '/search') setCommandBarHint('Enter a license plate to search → opens RUN LICENSEPLATE TAB');
        if (cmdPart === '/lookup') setCommandBarHint('Enter a citizen name or ID → opens ID LOOKUP / CITIZENID');
        return;
    }

    try {
        setCommandBarHint('');
        setCommandBarOpen(false);
        setCommandBarInput('/');

        if (cmdPart === '/search') {
            setActiveView('search');
            setTimeout(() => lookupUser(argPart.toUpperCase()), 100);
        } else if (cmdPart === '/lookup') {
            setSearchUsername(argPart);
            setSearchCitizenId(argPart);
            setActiveView('database-search');
            setTimeout(() => searchByUsername(argPart), 300);
        } else if (cmdPart === '/licenseplate') {
            setActiveView('search');
        } else if (cmdPart === '/citizen') {
            setActiveView('database-search');
        } else if (cmdPart === '/calls') {
            setActiveView('calls');
        } else if (cmdPart === '/home') {
            setActiveView('home');
        }
    } catch (err) {
        triggerCommandBarError('Command failed – try again');
    }
};

useEffect(() => {
    // Helper: update one row in the check list
    const setCheck = (index, status, result) => {
        setLoaderChecks(prev => {
            const next = [...prev];
            next[index] = { ...next[index], status, result };
            return next;
        });
    };

    const runLoader = async () => {
        setShowLoader(true);
        setLoaderProgress(0);
        setLoaderStatus('BOOTING...');

        // tiny initial yield so React paints the card before we start
        await new Promise(r => setTimeout(r, 150));

        // ──────────────────────────────────────────────────────────
        // CHECK 0: Runtime libraries
        // ──────────────────────────────────────────────────────────
        setCheck(0, 'running', 'Checking...');
        setLoaderStatus('CHECKING RUNTIME LIBRARIES');
        await new Promise(r => setTimeout(r, 80));

        const libChecks = {
            React:   typeof React    !== 'undefined',
            ReactDOM:typeof ReactDOM !== 'undefined',
            Babel:   typeof Babel    !== 'undefined',
            PDFLib:  typeof PDFLib   !== 'undefined',
        };
        const libOk    = Object.values(libChecks).filter(Boolean).length;
        const libTotal = Object.keys(libChecks).length;
        const allLibs  = libOk === libTotal;
        setCheck(0,
            allLibs ? 'ok' : 'warn',
            allLibs
                ? `${libOk}/${libTotal} loaded`
                : `${libOk}/${libTotal} — missing: ${Object.entries(libChecks).filter(([,v])=>!v).map(([k])=>k).join(', ')}`
        );
        setLoaderProgress(14);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // CHECK 1: Settings file
        // ──────────────────────────────────────────────────────────
        setCheck(1, 'running', 'Reading...');
        setLoaderStatus('LOADING SETTINGS FILE');
        await new Promise(r => setTimeout(r, 80));

        let rawSettings = {};
        try {
            const resp = await Promise.race([
                fetch('settings_NYSPTOOL.txt'),
                new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
            ]);
            if (resp.ok) {
                const text = await resp.text();
                text.split('\n').forEach(line => {
                    const t = line.trim();
                    if (t && !t.startsWith('#')) {
                        const eq = t.indexOf('=');
                        if (eq > -1) {
                            const k = t.substring(0, eq).trim();
                            const v = t.substring(eq + 1).trim();
                            if (k && v) rawSettings[k] = v;
                        }
                    }
                });
                const n = Object.keys(rawSettings).length;
                setCheck(1, 'ok', `${n} keys loaded`);
            } else {
                setCheck(1, 'warn', 'File not found — using defaults');
            }
        } catch (e) {
            setCheck(1, 'warn', 'Unavailable — using defaults');
        }
        setLoaderProgress(28);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // CHECK 2: Saved credentials (localStorage)
        // ──────────────────────────────────────────────────────────
        setCheck(2, 'running', 'Reading...');
        setLoaderStatus('LOADING SAVED CREDENTIALS');
        await new Promise(r => setTimeout(r, 80));

        let credCount = 0;
        const groqKeySource     = rawSettings['GroqConsoleAPIKey']    || localStorage.getItem('groqConsoleAPIKey') || '';
        const discordTokenSource= rawSettings['DiscordAccountToken']  || localStorage.getItem('discordToken')     || '';
        try {
            if (groqKeySource)                          credCount++;
            if (localStorage.getItem('soundSettings')) credCount++;
            if (localStorage.getItem('visualEffects')) credCount++;
        } catch (_) {}
        setCheck(2, credCount > 0 ? 'ok' : 'warn',
            credCount > 0 ? `${credCount} item${credCount>1?'s':''} found` : 'Nothing in storage');
        setLoaderProgress(42);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // CHECK 3: Discord token
        // ──────────────────────────────────────────────────────────
        setCheck(3, 'running', 'Pinging Discord...');
        setLoaderStatus('VERIFYING DISCORD TOKEN');
        await new Promise(r => setTimeout(r, 80));

        if (discordTokenSource) {
            try {
                const dr = await Promise.race([
                    fetch('https://discord.com/api/v9/users/@me', {
                        headers: { 'Authorization': discordTokenSource }
                    }),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
                ]);
                if (dr.ok) {
                    const me = await dr.json();
                    setCheck(3, 'ok', `Connected as ${me.username}`);
                } else if (dr.status === 401) {
                    setCheck(3, 'warn', 'Token invalid (401)');
                } else {
                    setCheck(3, 'warn', `HTTP ${dr.status}`);
                }
            } catch (e) {
                setCheck(3, 'warn', 'Unreachable');
            }
        } else {
            setCheck(3, 'warn', 'No token — configure in settings');
        }
        setLoaderProgress(58);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // CHECK 4: Roblox API proxy
        // ──────────────────────────────────────────────────────────
        setCheck(4, 'running', 'Testing proxies...');
        setLoaderStatus('TESTING ROBLOX API');
        await new Promise(r => setTimeout(r, 80));

        const probes = [
            { label: 'Direct',      url: 'https://users.roblox.com/v1/users/1' },
            { label: 'CorsProxy',   url: 'https://corsproxy.io/?https://users.roblox.com/v1/users/1' },
            { label: 'AllOrigins',  url: 'https://api.allorigins.win/raw?url=https://users.roblox.com/v1/users/1' },
        ];
        let robloxWorking = null;
        for (const p of probes) {
            try {
                const pr = await Promise.race([
                    fetch(p.url),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))
                ]);
                if (pr.ok) { robloxWorking = p.label; break; }
            } catch (_) {}
        }
        setCheck(4,
            robloxWorking ? 'ok' : 'warn',
            robloxWorking ? `Online via ${robloxWorking}` : 'All proxies failed'
        );
        setLoaderProgress(76);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // CHECK 5: Groq AI key
        // ──────────────────────────────────────────────────────────
        setCheck(5, 'running', 'Verifying key...');
        setLoaderStatus('VERIFYING AI PARSER');
        await new Promise(r => setTimeout(r, 80));

        if (groqKeySource && groqKeySource.startsWith('gsk_') && groqKeySource.length > 20) {
            try {
                const gr = await Promise.race([
                    fetch('https://api.groq.com/openai/v1/models', {
                        headers: { 'Authorization': `Bearer ${groqKeySource}` }
                    }),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000))
                ]);
                setCheck(5, gr.ok ? 'ok' : 'warn',
                    gr.ok ? 'Key valid & connected' : `Key present (${gr.status})`);
            } catch (_) {
                setCheck(5, 'ok', 'Key present (Groq unreachable)');
            }
        } else if (groqKeySource) {
            setCheck(5, 'warn', 'Key format invalid — must start with gsk_');
        } else {
            setCheck(5, 'warn', 'No key — vehicle parsing disabled');
        }
        setLoaderProgress(92);
        await new Promise(r => setTimeout(r, 100));

        // ──────────────────────────────────────────────────────────
        // DONE
        // ──────────────────────────────────────────────────────────
        setLoaderProgress(100);
        setLoaderStatus('SYSTEM READY');
        await new Promise(r => setTimeout(r, 400));

        setShowWelcome(true);
        await new Promise(r => setTimeout(r, 1600));

        const el = document.querySelector('.mdt-loader-overlay');
        if (el) el.classList.add('fade-out');
        setLoaderProgress(100);
        setLoaderStatus('System ready');
        
        // Loader stays open — user must click ENTER APP
        setLoaderStatus('SYSTEM READY');
    };

    runLoader();

    // Failsafe only updates progress/status, never closes the loader
    const failsafe = setTimeout(() => {
        console.warn('[LOADER] Failsafe — forcing 100% after 25s');
        setLoaderProgress(100);
        setLoaderStatus('SYSTEM READY');
    }, 25000);

    return () => clearTimeout(failsafe);
}, []);

const fetchAvatarAsBase64 = async (userId) => {
    // Proxies to try in order
    const proxies = [
        (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        (url) => url  // direct last resort
    ];

    const thumbnailApiUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png`;

    for (const makeProxied of proxies) {
        try {
            // Step 1: get the JSON that contains the CDN URL
            const jsonResp = await Promise.race([
                fetch(makeProxied(thumbnailApiUrl)),
                new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 5000))
            ]);
            if (!jsonResp.ok) continue;

            const jsonData = await jsonResp.json();
            const cdnUrl = jsonData?.data?.[0]?.imageUrl;
            if (!cdnUrl) continue;

            // Step 2: fetch the actual image bytes through the same proxy
            const imgResp = await Promise.race([
                fetch(makeProxied(cdnUrl)),
                new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 5000))
            ]);
            if (!imgResp.ok) continue;

            const blob = await imgResp.blob();

            // Step 3: convert to base64 data URL
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            console.log(`✅ [AVATAR] Fetched as base64 for userId ${userId} via proxy`);
            return base64; // "data:image/png;base64,..."

        } catch (e) {
            console.warn(`⚠️ [AVATAR] Proxy failed for ${userId}:`, e.message);
        }
    }

    console.error(`❌ [AVATAR] All proxies failed for userId ${userId}`);
    return null;
};

                ripple.style.animation = 'ripple-effect 0.6s ease-out';

useEffect(() => {

            const currentUser = window.AUTHORIZED_USERS[user.robloxUsername];
            
            if (currentUser && currentUser.banned === true) {

                setBanReason(currentUser.bannedReason || 'No reason provided.');

                setShowLoginScreen(false);

            } else {

PANIC_ENABLED=${panicEnabled ? 'TRUE' : 'FALSE'}

    try {
        if (window.require) {
            const { ipcRenderer } = window.require('electron');
            const result = await ipcRenderer.invoke('write-cad-settings', { content: settingsContent });
            if (result.success) {
                addLog(`✅ Settings written to: ${result.path}`, 'success');

                // Re-inject settings into the live app without restart
                const lines = settingsContent.split('\n');
                lines.forEach(line => {
                    const eq = line.indexOf('=');
                    if (eq < 0) return;
                    const key = line.substring(0, eq).trim();
                    const val = line.substring(eq + 1).trim();
                    if (key === 'DiscordAccountToken') { setDiscordToken(val); localStorage.setItem('discordToken', val); }
                    if (key === 'GroqConsoleAPIKey') { setGroqConsoleAPIKey(val); localStorage.setItem('groqConsoleAPIKey', val); window.GROQ_CONSOLE_API_KEY = val; }
                    if (key === 'DyslexiaFont') setDyslexiaFont(val === 'TRUE');
                    if (key === 'VisualEffects') setVisualEffects(val === 'TRUE');
                                        if (key === 'SIDETAB_NAVIGATION' || key === 'MiniMode') { const enabled = val === 'TRUE'; setCompactMode(enabled); if (enabled && window.require) { try { window.require('electron').ipcRenderer.send('toggle-compact-mode', true); } catch(_) {} } }
if (key === 'ACTIONBAR_KEYBIND') setActionBarKeybind(val);
if (key === 'KEYBINDS_REQUIRE_FOCUS') setKeybindsRequireFocus(val === 'TRUE');
                    if (key === 'PANIC_ENABLED') setPanicEnabled(val === 'TRUE');
                    if (key === 'PANIC_HOTKEY') { setPanicHotkey(val); setPanicHotkeyDraft(val); }
                    if (key === 'PANIC_TRIGGER_MODE') { setPanicTriggerMode(val); setPanicTriggerModeDraft(val); }
                    if (key === 'ACKNOWLEDGE_KEYBIND') { setAcknowledgeKeybind(val); setAcknowledgeKeybindDraft(val); }
                    if (key === 'AmericanDateFormat') setTrooperSettings(prev => ({ ...prev, AmericanDateFormat: val }));
                    
                });

                showCustomError('Settings Exported', `CADSystemSettings.txt updated successfully. All settings are now live — no restart required.`, true);
            } else {
                throw new Error(result.error || 'Write failed');
            }
        } else {
            const blob = new Blob([settingsContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'CADSystemSettings.txt';
            a.click();
            URL.revokeObjectURL(url);
            addLog('✅ Settings downloaded as CADSystemSettings.txt', 'success');
            showCustomError('Settings Exported', 'CADSystemSettings.txt has been downloaded. Replace your existing file with this one.', true);
        }
    } catch (err) {
        addLog(`❌ Export failed: ${err.message}`, 'error');
        showCustomError('Export Failed', err.message);
    }

// Update live settings — only merge non-officer fields to avoid overwriting auth backend data
    setTrooperSettings(prev => ({

        RegistrationChannelID: editableTrooperSettings?.RegistrationChannelID || prev.RegistrationChannelID,

        AmericanDateFormat: editableTrooperSettings?.AmericanDateFormat || prev.AmericanDateFormat,
    }));
    setUseMicrophone(useMicrophone);

const generatePlateVariants = (plate) => {
    const normalized = normalizePlate(plate);
    const variants = new Set();
    
    // Add normalized version (no spaces/hyphens)
    variants.add(normalized);
    
    // Add original (as typed)
    variants.add(plate.toUpperCase());
    
    // Pattern 1: ABC123 → ABC 123, ABC-123
    const letterSplit = normalized.match(/^([A-Z]+)(\d+)$/);
    if (letterSplit) {
        variants.add(`${letterSplit[1]} ${letterSplit[2]}`);
        variants.add(`${letterSplit[1]}-${letterSplit[2]}`);
    }
    
    // Pattern 2: 123ABC → 123 ABC, 123-ABC
    const numLetterSplit = normalized.match(/^(\d+)([A-Z]+)$/);
    if (numLetterSplit) {
        variants.add(`${numLetterSplit[1]} ${numLetterSplit[2]}`);
        variants.add(`${numLetterSplit[1]}-${numLetterSplit[2]}`);
    }
    
    // Pattern 3: V36ZGG → V36 ZGG, V-36-ZGG, V 36ZGG, V36-ZGG
    const mixedPattern = normalized.match(/^([A-Z])(\d+)([A-Z]+)$/);
    if (mixedPattern) {
        variants.add(`${mixedPattern[1]}${mixedPattern[2]} ${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]}-${mixedPattern[2]}-${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]} ${mixedPattern[2]}${mixedPattern[3]}`);
        variants.add(`${mixedPattern[1]}${mixedPattern[2]}-${mixedPattern[3]}`);
    }
    
    console.log('🔍 [VARIANTS] Generated variants:', Array.from(variants));
    return Array.from(variants);
};

const copyToClipboard = (text, fieldName) => {
    if (!text || text === 'Unknown' || text === 'UNKNOWN') {
        addLog('Ã¢ÂÅ’ Cannot copy: Invalid or unknown value', 'error');

    let parsed = null;
    
    // STEP 1: Try Groq AI first (ALWAYS)
    console.log('🤖 [VEHICLE] Attempting Groq AI parsing...');
    
    // Get API key from multiple sources
    console.log('🔑 [VEHICLE] Checking for Groq API key...');

    const apiKey = window.GROQ_API_KEY || 
                   window.GROQ_CONSOLE_API_KEY || 
                   localStorage.getItem('groqConsoleAPIKey');
    
    if (!apiKey) {
        console.error('❌ [VEHICLE] No Groq API key found!');
        console.error('❌ [VEHICLE] Please ensure GroqConsoleAPIKey is set in NYSP_settingstool.txt');
        console.log('🔧 [VEHICLE] Skipping AI, using manual parser');
    } else {
        console.log('✅ [VEHICLE] API key found, calling parseWithGroqAI...');
        console.log('🔑 [VEHICLE] Key starts with:', apiKey.substring(0, 8) + '...');
        
        try {
            const aiResult = await parseWithGroqAI(block, apiKey);
            
            if (aiResult && aiResult.make && aiResult.make !== 'Unknown') {
                console.log('✅ [VEHICLE] Groq AI parsing successful!');
                console.log('📊 [VEHICLE] AI Result:', aiResult);
                
                // Use AI data and convert field names to match UI expectations
                parsed = aiResult;
                
                // CRITICAL: Convert .type to .vehicleType for UI compatibility
                if (parsed.type && !parsed.vehicleType) {
                    console.log('🔄 [VEHICLE] Converting .type to .vehicleType:', parsed.type);
                    parsed.vehicleType = parsed.type;
                    delete parsed.type;  // Remove old field name
                }
                
                console.log('✅ [VEHICLE] After field conversion:', parsed);
                
                addLog('✅ AI parsing successful', 'success');
            } else {
                // AI FAILED - Don't fall back to manual parser when API key exists
                console.error('❌ [VEHICLE] AI returned incomplete data - STOPPING');
                console.error('❌ [VEHICLE] When API key exists, manual parser is NOT used');
                addLog('❌ AI unable to parse registration', 'error');
                
                // Return null to indicate parse failure
                console.log('════════════════════════════════════════════════════');
                return null;
            }
        } catch (aiError) {
            // AI ERROR - Don't fall back to manual parser when API key exists
            console.error('❌ [VEHICLE] Groq AI parsing failed:', aiError.message);
            console.error('❌ [VEHICLE] Error stack:', aiError.stack);
            console.error('❌ [VEHICLE] When API key exists, manual parser is NOT used');
            addLog(`❌ AI error: ${aiError.message}`, 'error');
            
            // Return null to indicate parse failure
            console.log('════════════════════════════════════════════════════');
            return null;
        }
    }

    
    // STEP 2: Use manual parser ONLY if no API key (AI was skipped)
    // If API key exists and we're here, AI must have succeeded
    if ((!apiKey) && (!parsed || !parsed.make || parsed.make === 'Unknown')) {
        console.log('🔧 [FALLBACK] Using manual line-by-line parser...');
        
        const date = new Date(edited_timestamp || timestamp);
        const displayTime = date.toLocaleString('en-US', {
            month: '2-digit',
            day: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
        
        // Filter out Discord ID line
        const dataLines = block.filter(line => 
            !line.trim().startsWith('<@') && 
            !line.trim().startsWith('@') &&
            line.trim().length > 0
        );
        
        console.log('📋 [FALLBACK] Filtered lines:', dataLines);
        
parsed = {
            year: 'Unknown',
            make: 'Unknown',
            model: 'Unknown',
            color: 'Unknown',
            vehicleType: 'Unknown',
            state: 'Unknown',
            plate: 'Unknown',
            timestamp: displayTime,
            phoneticPlate: '',
            hasHandicapPermit: false,
            discordUserId: discordUserId,  // ENSURE this is set
            isEdited: !!edited_timestamp,
            isIncomplete: true,
            parseError: true  // Mark as parse error
        };

        
// Parse line by line (attempt regardless of line count)
        // Extract whatever data is available, fill rest with Unknown
        parsed.year = dataLines[0] || 'Unknown';
        parsed.make = dataLines[1] || 'Unknown';
        parsed.model = dataLines[2] || 'Unknown';
        parsed.color = dataLines[3] || 'Unknown';
        parsed.vehicleType = dataLines[4] || 'Unknown';
        parsed.state = dataLines[5] || 'Unknown';
        parsed.plate = dataLines[6] ? dataLines[6].replace(/\s+/g, '').toUpperCase() : 'Unknown';
        parsed.phoneticPlate = parsed.plate !== 'Unknown' ? convertToPhonetic(parsed.plate) : '';
        
        console.log(`📋 [FALLBACK] Parsed from ${dataLines.length} lines:`, parsed);
        
        // Check if manual parsing actually got useful data
        const hasUsefulData = parsed.year !== 'Unknown' || 
                             parsed.make !== 'Unknown' || 
                             parsed.plate !== 'Unknown';
        
        if (!hasUsefulData) {
            console.error('❌ [FALLBACK] Manual parse got only Unknown values');
            parsed.isIncomplete = true;
            parsed.parseError = true;
            addLog(`🔧 Fallback: Failed - no useful data from ${dataLines.length} lines`, 'error');
        } else {
            parsed.isIncomplete = false;
            delete parsed.parseError;  // Remove parse error flag if manual parse succeeded
            console.log('✅ [FALLBACK] Manual parsing successful:', parsed);
            addLog(`🔧 Fallback: ${parsed.plate}`, 'warning');
        }

        
        // Only log success if we actually got useful data
        if (!parsed.isIncomplete && !parsed.parseError) {
            addLog(`🔧 Fallback: ${parsed.plate}`, 'warning');
        } else {
            addLog(`🔧 Fallback: Failed - all Unknown values`, 'error');
        }
    }
    
    // STEP 3: Add metadata if AI was successful
    if (parsed && parsed.make !== 'Unknown') {
        const date = new Date(edited_timestamp || timestamp);
        const displayTime = date.toLocaleString('en-US', {
            month: '2-digit',
            day: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
        
        // Ensure all fields are present
        if (!parsed.timestamp) parsed.timestamp = displayTime;
        if (!parsed.discordUserId) parsed.discordUserId = discordUserId;
        if (!parsed.isEdited) parsed.isEdited = !!edited_timestamp;
        if (!parsed.phoneticPlate && parsed.plate && parsed.plate !== 'Unknown') {
            parsed.phoneticPlate = convertToPhonetic(parsed.plate);
        }
        if (!parsed.hasHandicapPermit) {
            const blockText = block.join('\n').toLowerCase();
            parsed.hasHandicapPermit = blockText.includes('handicap');
        }
        if (parsed.isIncomplete === undefined) {
            parsed.isIncomplete = parsed.year === 'Unknown' || parsed.make === 'Unknown';
        }
        
        console.log('✅ [VEHICLE] Final result:', parsed);
        addLog(`✅ ${parsed.year} ${parsed.make} ${parsed.model} - ${parsed.plate}`, 'success');
    }
    
    // CRITICAL: Check if vehicle is unparseable (has Unknown values)
    if (parsed && (parsed.plate === 'Unknown' || parsed.make === 'Unknown' || 
        parsed.year === 'Unknown' || parsed.isIncomplete === true)) {
        console.error('❌ [VEHICLE] Vehicle has Unknown values - returning null');
        console.log('════════════════════════════════════════════════════');
        return null;  // Return null so calling code knows parse failed
    }
    
    console.log('════════════════════════════════════════════════════');
    
    return parsed;
};

        const aiResponse = data.choices[0].message.content;
        
        console.log('✅ [BATCH] AI Response received');
        console.log('📄 [BATCH] Response preview:', aiResponse.substring(0, 200) + '...');
        
        // Parse JSON array
        let vehiclesArray;
        try {
            // Try direct parse
            vehiclesArray = JSON.parse(aiResponse);
        } catch (e) {
            // Try extracting from code block
            const jsonMatch = aiResponse.match(/```(?:json)?\s*(\[[\s\S]*?\])\s*```/);
            if (jsonMatch) {
                vehiclesArray = JSON.parse(jsonMatch[1]);
            } else {
                // Try finding array in text
                const arrayMatch = aiResponse.match(/\[[\s\S]*\]/);
                if (arrayMatch) {
                    vehiclesArray = JSON.parse(arrayMatch[0]);
                } else {
                    throw new Error('Could not parse JSON array from response');
                }
            }
        }
        
        if (!Array.isArray(vehiclesArray)) {
            console.error('❌ [BATCH] Response is not an array');
            return [];
        }
        
        console.log('✅ [BATCH] Parsed', vehiclesArray.length, 'vehicles from AI');
        
        // Add metadata to each vehicle
        const processedVehicles = vehiclesArray.map((vehicle, index) => {
            const vb = vehicleBlocks[index];
            
            // Convert .type to .vehicleType
            if (vehicle.type && !vehicle.vehicleType) {
                vehicle.vehicleType = vehicle.type;
                delete vehicle.type;
            }
            
            // Add metadata
            vehicle.discordUserId = discordUserId;
            vehicle.timestamp = vb.timestamp;
            vehicle.editedTimestamp = vb.edited_timestamp;
            
            // Format timestamp
            if (vehicle.timestamp) {
                const date = new Date(vehicle.timestamp);
                vehicle.registeredDate = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            
            // Phonetic plate
            if (vehicle.plate && vehicle.plate !== 'Unknown') {
                vehicle.phoneticPlate = convertToPhonetic(vehicle.plate);
            }
            
            return vehicle;
        });
        
        // Filter out incomplete vehicles
        const validVehicles = processedVehicles.filter(v => {
            const isValid = v.year !== 'Unknown' && 
                           v.make !== 'Unknown' && 
                           v.plate !== 'Unknown';
            
            if (!isValid) {
                console.warn('⚠️ [BATCH] Filtered out incomplete vehicle:', v);
            }
            
            return isValid;
        });
        
        console.log('✅ [BATCH] Returning', validVehicles.length, 'valid vehicles');
        console.log('═══════════════════════════════════════════════════');
        
        return validVehicles;
        
    } catch (error) {
        console.error('❌ [BATCH] Error during batch parsing:', error);
        console.error('❌ [BATCH] Stack:', error.stack);
        return [];
    }
};



const parseRegistration = async (message) => {
    console.log('═══════════════════════════════════════════════════');
    console.log('📋 [PARSE] parseRegistration called');
    console.log('📋 [PARSE] Message ID:', message.id);
    console.log('═══════════════════════════════════════════════════');
    
    addLog('Parsing registration (AI-powered, multi-vehicle support)...', 'info');
    
    const fullText = message.content;
    const lines = fullText.split('\n').map(l => l.trim());
    
    const userIdMatch = fullText.match(/<@(\d+)>/);
    const discordUserId = userIdMatch ? userIdMatch[1] : 'Unknown';
    
    const timestamp = message.edited_timestamp || message.timestamp;
    
    console.log('👤 [PARSE] Discord User ID:', discordUserId);
    console.log('📅 [PARSE] Timestamp:', timestamp);
    
    const carBlocks = [];
    let currentCar = [];
    let inCar = false;
    
    const validYears = ['1952', '1995', '2001', '2002', '2004', '2005', '2006', '2008', '2009', '2010', '2011', '2012', '2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'];
    
console.log('🔍 [PARSE] Extracting vehicle blocks...');
    
    // ENHANCED: Detect if this is a labeled format
    const hasLabeledFormat = lines.some(line => 
        /^(Owner Of Vehicle|Year.*Make.*Model|Type Of Vehicle|Color Of Vehicle|License Plate|State Where)/i.test(line)
    );
    
    if (hasLabeledFormat) {
        console.log('📋 [PARSE] Detected LABELED FORMAT registration');
        
        // For labeled format, treat entire message as one vehicle block
        // Filter out only the data lines (skip owner line)
        const dataLines = lines.filter(line => 
            line && 
            !line.includes('<@') && 
            !line.toLowerCase().startsWith('owner of vehicle')
        );
        
        if (dataLines.length > 0) {
            console.log('📦 [PARSE] Created vehicle block from labeled format:', dataLines);
            carBlocks.push(dataLines);
        }
    } else {
        // ORIGINAL: Year-based block detection
        console.log('📋 [PARSE] Using YEAR-BASED block detection');
        
        const validYears = ['1952', '1995', '1996', '1997', '1998', '1999', '2000', '2001', '2002', '2003', '2004', '2005', '2006', '2007', '2008', '2009', '2010', '2011', '2012', '2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026', '2027', '2028'];
        
        // ✅ THE MISSING YEAR DETECTION LOOP
        for (const line of lines) {
            // Skip empty lines and username mentions
            if (!line || line.includes('<@')) continue;
            
            // Check if this line is a valid year
            const isYear = /^\d{4}$/.test(line) && validYears.includes(line);
            
            if (isYear) {
                // Year found - start new vehicle block
                if (currentCar.length > 0) {
                    console.log('🚗 [YEAR] Completed block with', currentCar.length, 'lines');
                    carBlocks.push([...currentCar]);
                }
                currentCar = [line];
                console.log('🚗 [YEAR] Starting new block with year:', line);
            } else if (line.startsWith('---') || line.startsWith('===')) {
                // Separator found - end current block
                if (currentCar.length > 0) {
                    console.log('🚗 [SEP] Separator found, completed block');
                    carBlocks.push([...currentCar]);
                }
                currentCar = [];
            } else if (currentCar.length > 0) {
                // Add line to current block
                currentCar.push(line);
            }
        }
        
        // Push final block
        if (currentCar.length > 0) {
            console.log('📦 [PARSE] Found final vehicle block:', currentCar);
            carBlocks.push(currentCar);
        }
    }

    
    console.log('✅ [PARSE] Total vehicle blocks found:', carBlocks.length);
    
    if (carBlocks.length === 0) {
        console.warn('⚠️ [PARSE] No vehicle blocks found in message');
        console.log('📝 [PARSE] Message content was:', fullText);
        console.log('📝 [PARSE] Lines were:', lines);
        return null;
    }

    
    // Parse each vehicle block with AI
    console.log('🤖 [PARSE] Parsing all vehicles with AI...');
    
    const vehicles = [];
    for (const block of carBlocks) {
        try {
            // Use parseVehicleBlockFromLines which tries AI first
            const vehicle = await parseVehicleBlockFromLines(block, discordUserId, timestamp, message.edited_timestamp);
            
            if (vehicle) {
                vehicles.push(vehicle);
                console.log('✅ [PARSE] Vehicle parsed:', vehicle.plate);
            } else {
                console.warn('⚠️ [PARSE] Vehicle parsing returned null');
            }
        } catch (error) {
            console.error('❌ [PARSE] Error parsing vehicle:', error);
        }
    }
    
    console.log('✅ [PARSE] Parsed', vehicles.length, 'vehicles');
    console.log('═══════════════════════════════════════════════════');
    
    // Return error object instead of null if parsing failed
    if (vehicles.length === 0) {
        console.error('❌ [PARSE] No vehicles could be parsed from message');
        console.error('❌ [PARSE] RETURNING parseError OBJECT');
        const errorObj = {
            parseError: true,
            errorMessage: 'Vehicle details could not be parsed by AI/Manual Parser. Manual search needs to be conducted.'
        };
        console.error('❌ [PARSE] Error object:', errorObj);
        return errorObj;
    }
    
    if (vehicles.length === 1) {
        return vehicles[0];
    }
    
    return {
        multipleVehicles: true,
        vehicles: vehicles
    };
};

const lookupRobloxUser = async (username, retryCount = 0) => {
    const maxRetries = 3;
    
    setLoadingRoblox(true);
    setRobloxError(null); // Clear errors immediately
    setRobloxLoadingStage(retryCount > 0 ? `Retrying... (Attempt ${retryCount + 1}/${maxRetries + 1})` : 'Searching...');
    const cleanUsername = username.trim();
    
    if (!cleanUsername || cleanUsername.length === 0) {
        setRobloxError('Invalid username provided');
        setLoadingRoblox(false);
        addLog('❌ Empty or invalid username', 'error');
        return;
    }
    
    addLog(`🔍 Searching Roblox for: ${cleanUsername}${retryCount > 0 ? ` (Retry ${retryCount}/${maxRetries})` : ''}`, 'info');
    
    try {
        const proxies = [
            { name: 'Direct API', url: (endpoint) => endpoint },
            { name: 'AllOrigins', url: (endpoint) => `https://api.allorigins.win/raw?url=${encodeURIComponent(endpoint)}` },
            { name: 'CorsProxy', url: (endpoint) => `https://corsproxy.io/?${encodeURIComponent(endpoint)}` },
            { name: 'CodeTabs', url: (endpoint) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(endpoint)}` }
        ];
        
        const searchUrl = `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=25`;
        
        addLog('Trying proxy fetch...', 'info');
        
        const searchPromises = proxies.map(async (proxy) => {
            try {
                const resp = await Promise.race([
                    fetch(proxy.url(searchUrl)),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
                ]);
                
                if (resp.ok) {
                    const data = await resp.json();
                    if (data?.data?.[0]) {
                        return { success: true, data, proxy: proxy.name };
                    }
                }
                return { success: false };
            } catch (e) {
                return { success: false };
            }
        });
        
        const results = await Promise.all(searchPromises);
        const successResult = results.find(r => r.success);
        
        if (successResult) {
            addLog(`✅ Success with ${successResult.proxy}!`, 'success');
            const exactMatch = successResult.data.data.find(u => u.name.toLowerCase() === username.toLowerCase());
            const userData = exactMatch || successResult.data.data[0];
            
            const userId = userData.id;
            const userName = userData.name;
            
            addLog(`✅ Found: ${userName} (${userId})`, 'success');
            setRobloxLoadingStage('Loading profile...');
            
            let avatarUrl = null;
            let joinDate = 'Unknown';
            let displayName = userData.displayName || userName;
            
            try {
                const avatarPromises = proxies.map(async (proxy) => {
                    try {
                        const avatarResp = await Promise.race([
                            fetch(proxy.url(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png`)),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000))
                        ]);
                        
                        if (avatarResp.ok) {
                            const avatarData = await avatarResp.json();
                            return avatarData?.data?.[0]?.imageUrl;
                        }
                        return null;
                    } catch (e) {
                        return null;
                    }
                });
                
                const detailsPromises = proxies.map(async (proxy) => {
                    try {
                        const detailsResp = await Promise.race([
                            fetch(proxy.url(`https://users.roblox.com/v1/users/${userId}`)),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000))
                        ]);
                        
                        if (detailsResp.ok) {
                            const detailsData = await detailsResp.json();
                            return detailsData;
                        }
                        return null;
                    } catch (e) {
                        return null;
                    }
                });
                
                const [avatarResults, detailsResults] = await Promise.all([
                    Promise.all(avatarPromises),
                    Promise.all(detailsPromises)
                ]);
                
                avatarUrl = avatarResults.find(url => url) || null;
                const detailsData = detailsResults.find(d => d) || null;
                
                if (detailsData) {
                    joinDate = detailsData.created ? new Date(detailsData.created).toLocaleDateString() : 'Unknown';
                    displayName = detailsData.displayName || userData.displayName || userName;
                }
            } catch (e) {
                addLog(`⚠️ Avatar/details partial failure: ${e.message}`, 'info');
            }
            
            setResult({ 
                username: userName, 
                userId: userId, 
                displayName: displayName, 
                avatarUrl: avatarUrl,
                joinDate: joinDate
            });
            
            addLog('✅ Profile loaded!', 'success');
            setLoadingRoblox(false);
            setRobloxLoadingStage('');
            return;
        }
        
        if (retryCount < maxRetries) {
            const waitTime = Math.min(2000 * Math.pow(2, retryCount), 8000);
            addLog(`⚠️ Search failed, retrying in ${waitTime/1000} seconds... (${retryCount + 1}/${maxRetries})`, 'info');
            await new Promise(resolve => setTimeout(resolve, waitTime));
            return lookupRobloxUser(username, retryCount + 1);
        }
        
        const errorMsg = `No Roblox user found for "${username}" after ${maxRetries + 1} attempts`;
        addLog(`❌ ${errorMsg}`, 'error');
        setRobloxError(errorMsg);
        setLoadingRoblox(false);
        setRobloxLoadingStage('');
        
    } catch (e) {
        if (retryCount < maxRetries) {
            const waitTime = Math.min(2000 * Math.pow(2, retryCount), 8000);
            addLog(`⚠️ Error occurred, retrying in ${waitTime/1000} seconds... (${retryCount + 1}/${maxRetries})`, 'info');
            await new Promise(resolve => setTimeout(resolve, waitTime));
            return lookupRobloxUser(username, retryCount + 1);
        }
        
        const errorMsg = `Error: ${e.message} (after ${maxRetries + 1} attempts)`;
        addLog(`❌ ${errorMsg}`, 'error');
        console.error('Full error:', e);
        setRobloxError(errorMsg);
        setLoadingRoblox(false);
        setRobloxLoadingStage('');
    }
};

            let pointChange = null;
            // Try standard format first: "+ X PTS" or "- X PTS"
            const addMatch = content.match(/[+]\s*(\d+)\s*(?:Points?|PTS)/i);
            if (addMatch) pointChange = '+' + addMatch[1];
            const subMatch = content.match(/[-]\s*(\d+)\s*(?:Points?|PTS)/i);
            if (subMatch) pointChange = '-' + subMatch[1];
            
            // If no match, try alternate format: "-# + X PTS" or "-# - X PTS"
            if (!pointChange) {
                const altAddMatch = content.match(/-#\s*[+]\s*(\d+)\s*(?:Points?|PTS)/i);
                if (altAddMatch) pointChange = '+' + altAddMatch[1];
                const altSubMatch = content.match(/-#\s*[-]\s*(\d+)\s*(?:Points?|PTS)/i);
                if (altSubMatch) pointChange = '-' + altSubMatch[1];
            }
            
            // Extract issuer (for warrants)
            let issuer = null;
            const issuerMatch = content.match(/\/s\/\s*(.+?)(?:\n|$)/i);
            if (issuerMatch) issuer = issuerMatch[1].trim();
            
            // Extract attachments
            const attachments = msg.attachments ? msg.attachments.map(att => ({
                url: att.url,
                proxyUrl: att.proxy_url,
                filename: att.filename,
                width: att.width,
                height: att.height,
                contentType: att.content_type
            })) : [];
            
            const record = {
                id: msg.id,
                type: recordType,
                authorUsername: msg.author.username,
                authorId: msg.author.id,
                timestamp: msg.timestamp,
                editedTimestamp: msg.edited_timestamp,
                content: content,
                penalCodes: penalCodes,
                totalPoints: totalPoints,
                pointChange: pointChange,
                issuer: issuer,
                attachments: attachments,
                citizenId: cleanUserId
            };
            
            records.push(record);
        }
        
        // Sort by timestamp (newest first)
        records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        console.log('═══════════════════════════════════════════════');
        console.log('✅ [SEARCH COMPLETE] Government Records Summary:');
        console.log(`   Total Records: ${recordCount.total}`);
        console.log(`   📝 Citations: ${recordCount.citation}`);
        console.log(`   📧 Mailed Citations: ${recordCount.mailedCitation}`);
        console.log(`   ⚠️ Written Warnings: ${recordCount.writtenWarning}`);
        console.log(`   🚛 Vehicle Removals: ${recordCount.vehicleRemoval}`);
        console.log(`   📋 Summons: ${recordCount.summons}`);
        console.log(`   🚨 Arrests: ${recordCount.arrest}`);
        console.log(`   ⚖️ Points Amendments: ${recordCount.pointsAmend}`);
        console.log(`   🔴 Bench Warrants: ${recordCount.benchWarrant}`);
        console.log(`   🔴 Arrest Warrants: ${recordCount.arrestWarrant}`);
        console.log('═══════════════════════════════════════════════');
        
        setPastRecords(records);
        addLog(`✅ Found ${recordCount.total} government records for ${fetchedUsername}`, 'success');
        
    } catch (error) {
        console.error('❌ [RECORDS] Error:', error);
        console.error('Stack:', error.stack);
        showCustomError('Error', `Failed to fetch records: ${error.message}`);
        setPastRecords([]);
    } finally {
        setLoadingPastRecords(false);
    }
};

// Helper functions to extract data from message content
function extractPlate(content) {
    const plateMatch = content.match(/(?:LICENSE PLATE|PLATE|LP)[\s:]*([A-Z0-9\s]+)/i);
    return plateMatch ? plateMatch[1].trim() : null;
}

function extractVehicle(content) {
    const vehicleMatch = content.match(/(?:VEHICLE|CAR)[\s:]*(\d{4})?\s*([A-Za-z]+)\s+([A-Za-z0-9\s]+)/i);
    return vehicleMatch ? vehicleMatch[0].trim() : null;
}

function extractState(content) {
    const stateMatch = content.match(/(?:STATE|ST)[\s:]([A-Z]{2})/i);
    return stateMatch ? stateMatch[1] : null;
}

function extractColor(content) {
    const colorMatch = content.match(/(?:COLOR|COLOUR)[\s:]*([A-Za-z\s]+)/i);
    return colorMatch ? colorMatch[1].trim() : null;
}

                    const rawField = field.acroField;
                    if (!rawField || !rawField.dict) return;

                    // Check for RV entry (rich text value) in the field dict directly
                    const rvKey = PDFLib.PDFName.of('RV');
                    const ffKey = PDFLib.PDFName.of('Ff');
                    
                    const hasRV = rawField.dict.has(rvKey);
                    const ffValue = rawField.dict.get(ffKey);
                    const flags = ffValue ? ffValue.asNumber() : 0;
                    const isRichText = (flags >> 25) & 1;

                    if (hasRV || isRichText) {

                        }

const handleLogin = async () => {
    if (window.MAINTENANCE === true) {
        console.log('[LOGIN] Blocked - Maintenance active');
        setMaintenanceActive(true);
        return; // Stops login
    }

    setLoginError('');
    setIsLoggingIn(true);

    try {
        const response = await fetch('https://ny-cad-proxy.robertoscreationsinquiries.workers.dev/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: loginUsername.trim(), 
                password: loginPassword 
            })
        });

        const result = await response.json();

        if (!result.success) {
            if (result.reason === 'banned') {
                if (soundSettings?.LoginAccessDenied && SOUNDS.LoginAccessDenied) {
                    try {
                        const audio = new Audio(SOUNDS.LoginAccessDenied);
                        audio.volume = 0.5;
                        audio.play().catch(e => console.log('Sound play failed:', e));
                    } catch (e) {}
                }
                setBanReason(result.bannedReason || 'No reason provided.');
                setShowBanScreen(true);
                setShowLoginScreen(false);
            } else {
                if (soundSettings?.LoginIncorrect && SOUNDS.LoginIncorrect) {
                    try {
                        const audio = new Audio(SOUNDS.LoginIncorrect);
                        audio.volume = 0.5;
                        audio.play().catch(e => console.log('Sound play failed:', e));
                    } catch (e) {}
                }
                setLoginError('Login details were not correct. Make sure you have put the correct details including your username and the password provided.');
            }
            setIsLoggingIn(false);
            return;
        }

        // ✅ Login successful
        const user = result.user;

        if (soundSettings?.LoginPageCorrect && SOUNDS.LoginPageCorrect) {
            try {
                const audio = new Audio(SOUNDS.LoginPageCorrect);
                audio.volume = 0.5;
                audio.play().catch(e => console.log('Sound play failed:', e));
            } catch (e) {}
        }

        console.log('[AUTH] ✅ Login successful for:', user.robloxUsername);

        setAuthenticatedUser(user);
        setTrooperData({
            robloxUsername: user.robloxUsername,
            patrolZone: user.patrolZone,
            firstName: user.firstName,
            lastName: user.lastName,
            badgeId: user.badgeId
        });

        localStorage.setItem('nysp_authenticated_user', JSON.stringify(user));
        localStorage.setItem('nysp_username', user.robloxUsername);
        localStorage.setItem('nysp_zone', user.patrolZone);
        localStorage.setItem('nysp_firstname', user.firstName);
        localStorage.setItem('nysp_lastname', user.lastName);
        localStorage.setItem('nysp_badgeid', user.badgeId);
        localStorage.setItem('nysp_department', user.department || 'NYSP');

        console.log('[AUTH] Trooper data stored:', {
            username: user.robloxUsername,
            zone: user.patrolZone,
            name: `${user.firstName} ${user.lastName}`,
            badge: user.badgeId
        });

        setTrooperSettings({
            Username: user.robloxUsername,
            Zone: user.patrolZone,
            BadgeID: user.badgeId,
            FirstName: user.firstName,
            LastName: user.lastName,
            Department: user.department || 'NYSP'
        });

        setShowLoginScreen(false);
        setShowLoader(true);
        setIsLoggingIn(false);

    } catch (error) {
        console.error('[AUTH] Login error:', error);
        setLoginError('Connection error. Please check your internet connection and try again.');
        setIsLoggingIn(false);
    }
};
const handleLogout = () => {
    console.log('[AUTH] Logging out');
    localStorage.removeItem('nysp_authenticated_user');
    localStorage.removeItem('nysp_username');
