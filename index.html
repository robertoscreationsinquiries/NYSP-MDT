{showPanicTriggeredPopup && (
    <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 9999999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(12px)' }}>
        <div style={{ width: '420px', borderRadius: '16px', overflow: 'hidden', background: 'linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0f1419 100%)', border: '1px solid rgba(239,68,68,0.4)', boxShadow: '0 0 0 1px rgba(239,68,68,0.2), 0 32px 80px rgba(0,0,0,0.9), 0 0 80px rgba(239,68,68,0.15)', animation: 'panicPulse 1.5s ease-in-out infinite' }}>
            {/* Top accent bar */}
            <div style={{ height: '3px', background: 'linear-gradient(90deg, #dc2626, #ef4444, #dc2626)', backgroundSize: '200% 100%' }} />
            {/* Header */}
            <div style={{ padding: '28px 28px 20px', borderBottom: '1px solid rgba(239,68,68,0.15)', position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', top: '-40%', right: '-5%', width: '50%', height: '200%', background: 'radial-gradient(circle, rgba(239,68,68,0.08) 0%, transparent 70%)', pointerEvents: 'none' }} />
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                    <div style={{ width: '48px', height: '48px', borderRadius: '12px', background: 'linear-gradient(135deg, #dc2626, #991b1b)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, boxShadow: '0 4px 16px rgba(239,68,68,0.4)', animation: 'panicSpin 1.5s ease-in-out infinite' }}>
                        <svg width="24" height="24" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
                    </div>
                    <div>
                        <div style={{ color: '#fca5a5', fontSize: '10px', fontWeight: '700', letterSpacing: '2.5px', textTransform: 'uppercase', marginBottom: '3px' }}>- EMERGENCY ALERT -</div>
                        <div style={{ color: 'white', fontSize: '18px', fontWeight: '800', letterSpacing: '0.5px' }}>Panic Signal Activated</div>
                    </div>
                </div>
            </div>
            {/* Body */}
            <div style={{ padding: '20px 28px 24px' }}>
                {/* Status row */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '18px' }}>
                    <div style={{ background: 'rgba(239,68,68,0.06)', border: '1px solid rgba(239,68,68,0.15)', borderRadius: '8px', padding: '10px 14px' }}>
                        <div style={{ color: '#6b7280', fontSize: '9px', fontWeight: '700', letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '4px' }}>Activated At</div>
                        <div style={{ color: 'white', fontSize: '13px', fontWeight: '700', fontFamily: 'monospace' }}>{panicTriggeredTime}</div>
                    </div>
                    <div style={{ background: 'rgba(239,68,68,0.06)', border: '1px solid rgba(239,68,68,0.15)', borderRadius: '8px', padding: '10px 14px' }}>
                        <div style={{ color: '#6b7280', fontSize: '9px', fontWeight: '700', letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '4px' }}>Status</div>
                        <div style={{ color: '#fca5a5', fontSize: '13px', fontWeight: '700' }}>BROADCASTING</div>
                    </div>
                </div>
                {/* Message */}
                <div style={{ background: 'rgba(239,68,68,0.04)', border: '1px solid rgba(239,68,68,0.1)', borderLeft: '3px solid #dc2626', borderRadius: '8px', padding: '12px 14px', marginBottom: '20px' }}>
                    <div style={{ color: '#fecaca', fontSize: '12px', lineHeight: '1.7' }}>
                        All active units have been notified of your distress signal. Remain in a safe position and update your location when possible. Do not dismiss this alert unless the situation has been resolved.
                    </div>
                </div>
                {/* Button */}
                <button onClick={() => setShowPanicTriggeredPopup(false)}
                    style={{ width: '100%', padding: '13px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '9px', color: '#fca5a5', fontSize: '12px', fontWeight: '800', cursor: 'pointer', letterSpacing: '2px', textTransform: 'uppercase', transition: 'all 0.15s' }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.2)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.5)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.1)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.3)'; }}>
                    Acknowledged
                </button>
            </div>
        </div>
    </div>
)}

{showSavePasswordPrompt && (
    <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 999998, display: 'flex', alignItems: 'flex-start', justifyContent: 'flex-end', padding: '60px 24px 0 0', pointerEvents: 'none' }}>
        <div style={{ width: '340px', background: 'linear-gradient(135deg, #0a0f1e, #111827)', border: '1px solid rgba(59,130,246,0.3)', borderRadius: '12px', boxShadow: '0 8px 32px rgba(0,0,0,0.6)', overflow: 'hidden', pointerEvents: 'all', animation: 'fadeIn 0.2s ease-out' }}>
            <div style={{ padding: '16px 18px', borderBottom: '1px solid rgba(59,130,246,0.1)', display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{ width: '36px', height: '36px', background: 'linear-gradient(135deg, #1e3a8a, #3b82f6)', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <svg width="18" height="18" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                </div>
                <div>
                    <div style={{ color: 'white', fontSize: '13px', fontWeight: '700' }}>Save login details?</div>
                    <div style={{ color: '#6b7280', fontSize: '11px', marginTop: '1px' }}>Your credentials will be stored locally on this device.</div>
                </div>
            </div>
            <div style={{ padding: '12px 18px', background: 'rgba(255,255,255,0.02)', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                    <span style={{ color: '#6b7280', fontSize: '11px' }}>Username</span>
                    <span style={{ color: '#e2e8f0', fontSize: '11px', fontWeight: '600', fontFamily: 'monospace' }}>{pendingSaveCredentials?.username}</span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: '#6b7280', fontSize: '11px' }}>Password</span>
                    <span style={{ color: '#e2e8f0', fontSize: '11px', fontFamily: 'monospace' }}>{'•'.repeat(Math.min(pendingSaveCredentials?.password?.length || 0, 16))}</span>
                </div>
            </div>
            <div style={{ display: 'flex', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
                <button onClick={() => {
                    localStorage.removeItem('nysp_saved_username');
                    localStorage.removeItem('nysp_saved_password');
                    setShowSavePasswordPrompt(false);
                    setPendingSaveCredentials(null);
                }} style={{ flex: 1, padding: '12px', background: 'transparent', border: 'none', borderRight: '1px solid rgba(255,255,255,0.05)', color: '#6b7280', fontSize: '12px', fontWeight: '600', cursor: 'pointer' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                    Never
                </button>
                <button onClick={() => {
                    setShowSavePasswordPrompt(false);
                    setPendingSaveCredentials(null);
                }} style={{ flex: 1, padding: '12px', background: 'transparent', border: 'none', borderRight: '1px solid rgba(255,255,255,0.05)', color: '#94a3b8', fontSize: '12px', fontWeight: '600', cursor: 'pointer' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                    Not now
                </button>
                <button onClick={() => {
                    localStorage.setItem('nysp_saved_username', pendingSaveCredentials.username);
                    localStorage.setItem('nysp_saved_password', pendingSaveCredentials.password);
                    setShowSavePasswordPrompt(false);
                    setPendingSaveCredentials(null);
                }} style={{ flex: 1, padding: '12px', background: 'transparent', border: 'none', color: '#60a5fa', fontSize: '12px', fontWeight: '700', cursor: 'pointer' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(59,130,246,0.08)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                    Save
                </button>
            </div>
        </div>
    </div>
)}

{showPhoneticCompare && (
    <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2000, backdropFilter: 'blur(6px)', padding: '20px', animation: 'fadeIn 0.2s ease-out' }}
        onClick={e => { if (e.target === e.currentTarget) setShowPhoneticCompare(false); }}>
        <div style={{ background: 'linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0f1419 100%)', border: '1px solid rgba(245,158,11,0.25)', borderRadius: '14px', width: '100%', maxWidth: '700px', maxHeight: '80vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 4px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04)' }}>
            {/* Header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '16px', padding: '20px 24px', flexShrink: 0, background: 'linear-gradient(135deg, rgba(15,23,42,0.95), rgba(120,53,15,0.3))', borderBottom: '1px solid rgba(245,158,11,0.2)', position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', top: '-60%', right: '-5%', width: '40%', height: '220%', background: 'radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%)', pointerEvents: 'none' }} />
                <div style={{ width: '44px', height: '44px', background: 'linear-gradient(135deg, #92400e, #f59e0b)', borderRadius: '11px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 16px rgba(245,158,11,0.4)', flexShrink: 0 }}>
                    <svg width="22" height="22" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                </div>
                <div style={{ flex: 1, position: 'relative', zIndex: 1 }}>
                    <div style={{ color: 'white', fontSize: '16px', fontWeight: '800', letterSpacing: '1px' }}>Phonetic Alphabet Comparison</div>
                    <div style={{ color: '#fcd34d', fontSize: '11px', marginTop: '2px', fontWeight: '500' }}>Police vs NATO - currently active: <strong>{phoneticMode}</strong></div>
                </div>
                <button onClick={() => setShowPhoneticCompare(false)}
                    style={{ width: '32px', height: '32px', minWidth: '32px', borderRadius: '8px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#f87171', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', flexShrink: 0, padding: 0 }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.2)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.4)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.08)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.2)'; }}>
                    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            {/* Content - two columns */}
            <div style={{ flex: 1, overflowY: 'auto', minHeight: 0, padding: '20px 24px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                    {[
                        { label: '🚔 Police Phonetic', accent: '#3b82f6', mode: 'POLICE', map: {A:'Adam',B:'Boy',C:'Charles',D:'David',E:'Edward',F:'Frank',G:'George',H:'Henry',I:'Ida',J:'John',K:'King',L:'Lincoln',M:'Mary',N:'Nora',O:'Ocean',P:'Paul',Q:'Queen',R:'Robert',S:'Sam',T:'Tom',U:'Union',V:'Victor',W:'William',X:'X-Ray',Y:'Young',Z:'Zebra'} },
                        { label: '🌐 NATO Phonetic', accent: '#f59e0b', mode: 'NATO', map: {A:'Alpha',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliett',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-Ray',Y:'Yankee',Z:'Zulu'} }
                    ].map(({ label, accent, mode, map }) => (
                        <div key={mode} style={{ background: phoneticMode === mode ? `${accent}10` : 'rgba(255,255,255,0.02)', border: `1px solid ${phoneticMode === mode ? `${accent}40` : 'rgba(255,255,255,0.06)'}`, borderRadius: '10px', overflow: 'hidden', transition: 'all 0.15s' }}>
                            <div style={{ padding: '12px 16px', borderBottom: `1px solid ${phoneticMode === mode ? `${accent}30` : 'rgba(255,255,255,0.05)'}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: phoneticMode === mode ? `${accent}15` : 'rgba(255,255,255,0.02)' }}>
                                <span style={{ color: phoneticMode === mode ? accent : '#6b7280', fontSize: '12px', fontWeight: '800', letterSpacing: '1px', textTransform: 'uppercase' }}>{label}</span>
                                {phoneticMode === mode && <span style={{ background: `${accent}20`, border: `1px solid ${accent}50`, borderRadius: '4px', padding: '2px 8px', color: accent, fontSize: '9px', fontWeight: '800', letterSpacing: '1.5px' }}>ACTIVE</span>}
                            </div>
                            <div style={{ padding: '10px 16px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '2px 12px' }}>
                                {Object.entries(map).map(([letter, word]) => (
                                    <div key={letter} style={{ display: 'flex', gap: '8px', padding: '3px 0', borderBottom: '1px solid rgba(255,255,255,0.03)', alignItems: 'baseline' }}>
                                        <span style={{ color: accent, fontWeight: '800', fontSize: '12px', fontFamily: 'monospace', minWidth: '14px' }}>{letter}</span>
                                        <span style={{ color: '#94a3b8', fontSize: '11px' }}>{word}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    </div>
)}

{commandBarOpen && (
    <div style={{ position: 'fixed', inset: 0, zIndex: 99999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)' }}
        onClick={(e) => { if (e.target === e.currentTarget) { setCommandBarOpen(false); setCommandBarInput('/'); } }}>
        <div style={{ width: '600px', background: '#0f1419', border: '1px solid rgba(59,130,246,0.4)', borderRadius: '14px', padding: '20px', boxShadow: '0 20px 60px rgba(0,0,0,0.8)' }}>
            
            {/* Error flash */}
            {commandBarError && (
                <div style={{ color: '#ef4444', fontSize: '12px', fontWeight: '700', letterSpacing: '1px', marginBottom: '8px', textAlign: 'center', animation: 'flash-red 0.3s ease-in-out' }}>
                    {commandBarError}
                </div>
            )}

            {/* Input wrapper with ghost text */}
            <div style={{ position: 'relative', marginBottom: '8px' }}>
                {/* Ghost suggestion overlay */}
                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, padding: '14px 16px', fontSize: '16px', fontFamily: 'monospace', letterSpacing: '1px', pointerEvents: 'none', color: 'transparent', whiteSpace: 'pre' }}>
                    <span style={{ color: 'transparent' }}>{commandBarInput}</span>
                    <span style={{ color: 'rgba(255,255,255,0.25)' }}>{getCommandSuggestion(commandBarInput)}</span>
                </div>
                <input
                    autoFocus
                    type="text"
                    value={commandBarInput}
                    onChange={(e) => {
                        const val = e.target.value;
                        setCommandBarInput(val.startsWith('/') ? val : '/' + val);
                        setCommandBarHint('');
                        setCommandBarError('');
                    }}
                    onKeyDown={(e) => {
                        if (e.key === 'Tab') {
                            e.preventDefault();
                            const suggestion = getCommandSuggestion(commandBarInput);
                            if (suggestion) {
                                const completed = commandBarInput + suggestion;
                                const cmd = COMMANDS.find(c => c.cmd === completed.trim());
                                setCommandBarInput(cmd?.requiresInput ? completed + ' ' : completed);
                            }
                        } else if (e.key === 'Enter') {
                            executeCommand(commandBarInput);
                        } else if (e.key === 'Escape') {
                            setCommandBarOpen(false);
                            setCommandBarInput('/');
                        }
                    }}
                    style={{ width: '100%', padding: '14px 16px', background: 'rgba(255,255,255,0.05)', border: `1px solid ${commandBarError ? 'rgba(239,68,68,0.6)' : 'rgba(59,130,246,0.35)'}`, borderRadius: '10px', color: 'white', fontSize: '16px', fontFamily: 'monospace', letterSpacing: '1px', outline: 'none', boxSizing: 'border-box', position: 'relative', zIndex: 1, background: 'transparent' }}
                />
            </div>

            {/* TAB hint */}
            {getCommandSuggestion(commandBarInput) && (
                <div style={{ color: 'rgba(255,255,255,0.35)', fontSize: '11px', marginBottom: '8px', letterSpacing: '1px' }}>
                    Press TAB to accept suggestion
                </div>
            )}

            {/* Input-required hint */}
            {commandBarHint && (
                <div style={{ color: '#fbbf24', fontSize: '12px', marginBottom: '8px', letterSpacing: '0.5px' }}>
                    {commandBarHint}
                </div>
            )}

            {/* Command list */}
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '12px', borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: '12px' }}>
                {COMMANDS.map(c => (
                    <span key={c.cmd} style={{ padding: '3px 10px', background: 'rgba(59,130,246,0.1)', border: '1px solid rgba(59,130,246,0.2)', borderRadius: '6px', color: '#60a5fa', fontSize: '11px', fontFamily: 'monospace', cursor: 'pointer' }}
                        onClick={() => { setCommandBarInput(c.requiresInput ? c.cmd + ' ' : c.cmd); setCommandBarHint(''); }}>
                        {c.cmd}{c.requiresInput ? ' {input}' : ''}
                    </span>
                ))}
                <span style={{ marginLeft: 'auto', color: 'rgba(255,255,255,0.2)', fontSize: '11px', alignSelf: 'center' }}>ESC to close</span>
            </div>
        </div>
    </div>
)}

{activeView === 'home' ? (
    <div style={{ maxWidth: '100%', margin: '0 auto', padding: '16px 20px', width: '100%', animation: 'fadeIn 0.4s ease-out', boxSizing: 'border-box', background: 'linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0f1419 100%)', minHeight: '100vh', WebkitMaskImage: 'radial-gradient(ellipse 95% 92% at 50% 50%, black 60%, transparent 100%)', maskImage: 'radial-gradient(ellipse 95% 92% at 50% 50%, black 60%, transparent 100%)' }}>
        <div style={{ height: 'calc(100vh - 56px)', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '12px' }}>

            {/* ── HEADER ── */}
            <div style={{ padding: '16px 20px', borderRadius: '12px', background: 'linear-gradient(135deg, rgba(15,23,42,0.97), rgba(30,58,138,0.35))', border: '1px solid rgba(59,130,246,0.2)', boxShadow: '0 4px 24px rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', gap: '16px', position: 'relative', overflow: 'hidden', flexShrink: 0 }}>
                <div style={{ position: 'absolute', top: '-50%', right: '-5%', width: '40%', height: '200%', background: 'radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%)', pointerEvents: 'none' }} />
                <div style={{ width: '48px', height: '48px', background: 'linear-gradient(135deg, #1e3a8a, #3b82f6)', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 6px 20px rgba(59,130,246,0.5)', border: '1px solid rgba(96,165,250,0.3)', flexShrink: 0 }}>
                    <Shield size={26} style={{ color: 'white' }} />
                </div>
                <div style={{ flex: 1, position: 'relative', zIndex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', flexWrap: 'wrap' }}>
                        <h1 style={{ color: 'white', fontSize: '18px', fontWeight: '800', margin: 0, letterSpacing: '0.5px' }}>
                            {selectedDepartment === 'NYSP' ? 'New York State Police' : selectedDepartment === 'DISPATCHER' ? 'Dispatcher' : 'East Greenbush Police Department'}
                        </h1>
                        <span style={{ color: '#3b82f6', fontSize: '10px', fontWeight: '700', letterSpacing: '2px', background: 'rgba(59,130,246,0.12)', padding: '2px 7px', borderRadius: '4px', border: '1px solid rgba(59,130,246,0.25)' }}>EST. 2025</span>
                    </div>
                    <p style={{ color: '#60a5fa', fontSize: '11px', margin: '2px 0 0', fontWeight: '500' }}>
                        {currentTime.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })} — {currentTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}
                    </p>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.25)', borderRadius: '16px', padding: '6px 12px', flexShrink: 0 }}>
                    <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: '#10b981', boxShadow: '0 0 8px #10b981', animation: 'pulse-dot 2s ease-in-out infinite' }} />
                    <span style={{ color: '#34d399', fontSize: '11px', fontWeight: '700', letterSpacing: '1px' }}>ONLINE</span>
                </div>
            </div>

            {/* TOKEN WARNING */}
            {tokenExpiryWarning && (
                <div style={{ background: 'linear-gradient(135deg, rgba(239,68,68,0.15), rgba(220,38,38,0.08))', border: '1px solid rgba(239,68,68,0.35)', borderRadius: '10px', padding: '12px 16px', display: 'flex', alignItems: 'center', gap: '12px', flexShrink: 0 }}>
                    <span style={{ fontSize: '20px' }}>⚠️</span>
                    <div style={{ flex: 1 }}>
                        <div style={{ color: '#fca5a5', fontSize: '12px', fontWeight: '700', marginBottom: '1px' }}>TOKEN EXPIRY WARNING</div>

                            <button onClick={() => setChatTab('bolo')} style={{ padding: '3px 8px', borderRadius: '5px', border: 'none', cursor: 'pointer', fontSize: '9px', fontWeight: '700', letterSpacing: '1px', textTransform: 'uppercase', background: chatTab === 'bolo' ? 'rgba(248,113,113,0.25)' : 'transparent', color: chatTab === 'bolo' ? '#f87171' : '#4b5563', transition: 'all 0.15s', position: 'relative' }}>

                            AVAILABLE OFFICERS

                                    const alreadyInList = onlineOfficers.some(o => String(o.badge) === String(trooperSettings.BadgeID));

                                {onlineOfficers.length === 0 && !tokenSaved ? (
                                    <div style={{ color: '#374151', fontSize: '11px', textAlign: 'center', paddingTop: '8px' }}>No officers online in this session</div>

                                    const isMe = String(o.badge) === String(trooperSettings?.BadgeID);

                {/* ── NOT FOUND ── */}
                {registration && registration.notFound && (
                    <div style={{ marginTop: '4px', padding: '20px 24px', background: 'linear-gradient(135deg, rgba(239,68,68,0.15), rgba(220,38,38,0.1))', border: '1px solid rgba(239,68,68,0.35)', borderRadius: '14px', display: 'flex', alignItems: 'center', gap: '16px', animation: visualEffects ? 'shake-animation 0.5s ease-in-out' : 'none', boxShadow: '0 4px 16px rgba(239,68,68,0.15)' }}>

                            {registration.registrations.map((reg, idx) => (
                                <div
                                    key={idx}
                                    onClick={() => {
                                        setRegistration(reg);

                                                if (memberData) {
                                                    const serverName = memberData.nick || memberData.user.global_name || memberData.user.username;
                                                    lookupRobloxUser(serverName);
                                                }

                                        }

                                    style={{ padding: '16px', background: reg.parseFailed ? 'rgba(239,68,68,0.06)' : 'rgba(59,130,246,0.08)', border: reg.parseFailed ? '1px solid rgba(239,68,68,0.25)' : '1px solid rgba(59,130,246,0.25)', borderRadius: '10px', cursor: 'pointer', transition: 'all 0.2s' }}

                                    {reg.parseFailed ? (
                                    <>
                                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                                <span style={{ background: 'rgba(245,158,11,0.15)', border: '1px solid rgba(245,158,11,0.35)', borderRadius: '4px', padding: '2px 8px', color: '#fde68a', fontSize: '9px', fontWeight: '800', letterSpacing: '1.5px' }}>⚠ IMPROPER REGISTRATION</span>
                                            </div>
                                            {reg.registeredAt && <span style={{ color: '#475569', fontSize: '10px', fontFamily: 'monospace' }}>{reg.registeredAt}</span>}
                                        </div>
                                        {reg.rawDiscordMessage ? (
                                            <div style={{ background: 'rgba(0,0,0,0.25)', border: '1px solid rgba(245,158,11,0.15)', borderRadius: '8px', overflow: 'hidden' }}>
                                                <div style={{ padding: '5px 10px', background: 'rgba(245,158,11,0.08)', borderBottom: '1px solid rgba(245,158,11,0.12)', fontSize: '9px', color: '#fbbf24', fontWeight: '700', letterSpacing: '2px' }}>RAW DISCORD RECORD</div>
                                                <div style={{ padding: '8px 10px' }}>
                                                    {reg.rawDiscordMessage.split('\n').filter(l => l.trim()).map((line, i) => (
                                                        <div key={i} style={{ display: 'flex', gap: '8px', padding: '2px 0', borderBottom: '1px solid rgba(255,255,255,0.03)' }}>
                                                            <span style={{ color: '#475569', fontSize: '10px', fontFamily: 'monospace', minWidth: '18px', flexShrink: 0 }}>{String(i+1).padStart(2,'0')}</span>
                                                            <span style={{ color: '#fde68a', fontSize: '11px', fontFamily: 'monospace', wordBreak: 'break-word' }}>{line}</span>

                                    </>
                                ) : (

                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>

                                            <span className="info-label">{label}:</span>
                                            <div className="skel" style={{ height: '13px', width: i === 1 ? '110px' : i === 3 ? '140px' : '90px', borderRadius: '4px' }} />
                                        </div>
                                    ))}
                                    {/* Warrant badge shimmer */}
                                    <div className="skel" style={{ height: '42px', borderRadius: '10px', marginTop: '14px' }} />
                                </>
                            ) : robloxError ? (
                                <>
                                    <div style={{ padding: '16px', textAlign: 'center', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '10px', marginBottom: '14px' }}>

                                    </div>

                                </>
                            ) : result ? (
                                <>
                                    {result?.avatarUrl && (<div className="avatar-container"><img src={result.avatarUrl} alt="Avatar" className="avatar-img" onError={(e) => { const src = e.currentTarget.src; if (!src.includes('corsproxy.io')) { e.currentTarget.src = `https://corsproxy.io/?${encodeURIComponent(src)}`; } else { e.currentTarget.onerror = null; e.currentTarget.style.display = 'none'; } }} /></div>)}
                                    {result?.username && (<div className="info-item"><span className="info-label">Roblox Username:</span><span className="info-value">{result.username}</span></div>)}
                                    {result?.userId && (<div className="info-item"><span className="info-label">User ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{result.userId}</span><button className="copy-btn btn-ripple" onClick={() => copyToClipboard(result.userId, 'roblox')}>{copiedField === 'roblox' ? 'Copied!' : 'Copy'}</button></div></div>)}
                                    {result?.displayName && (<div className="info-item"><span className="info-label">Display Name:</span><span className="info-value">{result.displayName}</span></div>)}
                                    {result?.joinDate && (<div className="info-item"><span className="info-label">Join Date:</span><span className="info-value">{result.joinDate}</span></div>)}
                                    <div className="info-item"><span className="info-label">Discord ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{registration?.discordUserId || 'UNKNOWN'}</span><button className="copy-btn btn-ripple" onClick={() => copyToClipboard(registration?.discordUserId, 'discord-owner')}>{copiedField === 'discord-owner' ? 'Copied!' : 'Copy'}</button></div></div>
                                    <div style={{ marginTop: '14px', padding: '12px 16px', background: warrantFlash ? '#dc2626' : (warrantInfo ? '#ef4444' : 'rgba(255,255,255,0.05)'), border: `1px solid ${warrantInfo ? '#991b1b' : 'rgba(255,255,255,0.1)'}`, borderRadius: '10px', transition: 'all 0.3s', animation: warrantInfo ? 'pulse-border-warrant 2s infinite' : 'none', boxShadow: warrantInfo ? '0 0 20px rgba(239,68,68,0.5)' : 'none' }}>
                                        <div style={{ color: warrantInfo ? '#fff' : (warrantChecking ? '#fbbf24' : '#86efac'), fontSize: '13px', fontWeight: '700' }}>
                                            {warrantChecking ? (
                                                <WarrantDots />
                                            ) : warrantInfo ? (
                                                <>WARRANT: ACTIVE {warrantInfo.bench > 0 && `BENCH WARRANT${warrantInfo.bench > 1 ? ` (${warrantInfo.bench})` : ''}`}{warrantInfo.bench > 0 && warrantInfo.arrest > 0 && ', '}{warrantInfo.arrest > 0 && `ARREST WARRANT${warrantInfo.arrest > 1 ? ` (${warrantInfo.arrest})` : ''}`}</>
                                            ) : ('WARRANT: NO ACTIVE WARRANTS')}
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div style={{ padding: '16px', textAlign: 'center', background: 'rgba(251,191,36,0.1)', border: '1px solid rgba(251,191,36,0.25)', borderRadius: '10px', marginBottom: '14px' }}>
                                        <p style={{ color: '#fde047', fontSize: '14px', marginBottom: '6px', fontWeight: '600' }}>Roblox User Not Found</p>
                                        <p style={{ color: '#bfdbfe', fontSize: '12px', opacity: 0.8 }}>Citation can still be exported.</p>
                                    </div>
                                    <div className="info-item"><span className="info-label">Discord ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{searchResults?.discordUserId || 'UNKNOWN'}</span><button className="copy-btn btn-ripple" onClick={(e) => { e.stopPropagation(); copyToClipboard(searchResults?.discordUserId || 'UNKNOWN', 'discord'); }}>{copiedField === 'discord' ? 'Copied!' : 'Copy'}</button></div></div>
                                </>
                            )}

                            {!loadingRoblox && (
                                <>
                                    <button onClick={() => { setShowDatabaseHistory(true); const _uid = registration?.discordUserId || searchResults?.discordUserId || ''; setDatabaseSearchId(_uid); if (_uid) setTimeout(() => searchPastRecords(_uid), 100); }}

                                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.12)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; e.currentTarget.style.transform = 'translateY(0)'; }}>
                                        VIEW GOVERNMENT RECORDS
                                    </button>

                                    
                                    {!isDispatcher && <button onClick={() => {
                                        const citationReg = registration?.parseFailed
                                            ? { ...registration, timestamp: registration.registeredAt || '' }
                                            : registration;
                                        generateCitation(result, citationReg);

                                        style={{ width: '100%', marginTop: '10px', padding: '12px', background: 'linear-gradient(135deg, #10b981, #059669)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.5px', boxShadow: '0 4px 12px rgba(16,185,129,0.3)', transition: 'all 0.2s' }}
                                        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = '0 6px 18px rgba(16,185,129,0.5)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 12px rgba(16,185,129,0.3)'; }}>
                                        EXPORT PRE-FILLED CITATION
                                    </button>}

                                    {!isDispatcher && <button onClick={async () => {
                                        console.log('🚨 [ARREST] FILE ARREST/SUMMONS REPORT clicked');
                                        let ownerData = null, dataSource = null;
                                        if (searchResults?.robloxUser?.username) { ownerData = searchResults.robloxUser; dataSource = 'searchResults.robloxUser'; }
                                        else if (registration?.robloxUser?.username) { ownerData = registration.robloxUser; dataSource = 'registration.robloxUser'; }
                                        else if (result?.username) { ownerData = result; dataSource = 'result'; }
                                        else if (registration?.username) { ownerData = { username: registration.username, userId: registration.userId || registration.robloxUserId, displayName: registration.displayName, joinDate: registration.joinDate, avatarUrl: registration.avatarUrl }; dataSource = 'registration (direct)'; }
                                        if (ownerData?.username) {
                                            addLog(`🚨 Filing arrest report for ${ownerData.username}`, 'info');
                                            try { await generateArrestReport(ownerData); } catch (error) { showCustomError('Error', `Failed to generate arrest report: ${error.message}`); }
                                        } else {
                                            showCustomError('Error', 'Vehicle owner information not available.\n\nTry searching the license plate again.');
                                        }
                                    }}
                                        style={{ width: '100%', marginTop: '10px', padding: '12px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.5px', boxShadow: '0 4px 12px rgba(239,68,68,0.3)', transition: 'all 0.2s' }}
                                        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = '0 6px 18px rgba(239,68,68,0.5)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 12px rgba(239,68,68,0.3)'; }}>
                                        FILE ARREST REPORT
                                    </button>}
                                </>
                            )}
                        </div>

                        {/* PARSE FAILURE */}
                        {registration && registration.parseFailed && (
                            <div className="vehicle-box" style={{ border: '2px solid rgba(239,68,68,0.5)', borderRadius: '14px', background: 'linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.9))', animation: visualEffects ? 'pulse-border-red 2s infinite' : 'none' }}>
                                <div className="box-header" style={{ borderRadius: '12px 12px 0 0', borderBottom: '1px solid rgba(239,68,68,0.3)' }}>
                                    <Car size={16} /> Vehicle Details
                                    <span style={{ marginLeft: '10px', padding: '2px 9px', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.4)', borderRadius: '4px', fontSize: '10px', color: '#f87171', fontWeight: '700', letterSpacing: '1px' }}>IMPROPER REG</span>
                                </div>

                                {/* Status banner */}
                                <div style={{ margin: '14px 14px 0', padding: '10px 14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '8px', display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <span style={{ fontSize: '18px', flexShrink: 0 }}>⚠️</span>
                                    <div>
                                        <div style={{ fontSize: '11px', fontWeight: '800', color: '#ef4444', letterSpacing: '1px', textTransform: 'uppercase' }}>Vehicle Improperly Registered</div>
                                        <div style={{ fontSize: '11px', color: '#94a3b8', marginTop: '2px' }}>Raw record shown below, manual verification required</div>
                                    </div>
                                </div>

                                {/* Plate display - same style as normal vehicle box */}
                                {registration.plate && (
                                    <div style={{ background: 'linear-gradient(135deg, #064e3b, #065f46)', border: '2px solid #10b981', borderRadius: '12px', padding: '16px', textAlign: 'center', margin: '14px', boxShadow: '0 4px 16px rgba(16,185,129,0.15)' }}>
                                        <div style={{ fontSize: '11px', color: '#6ee7b7', fontWeight: '700', marginBottom: '6px', letterSpacing: '3px' }}>LICENSE PLATE</div>

                                        <div style={{ fontSize: '11px', color: '#6ee7b7', fontWeight: '700', marginTop: '8px', marginBottom: '4px', letterSpacing: '2px' }}>PHONETIC SPELLING</div>
                                        <div style={{ fontSize: '13px', fontWeight: '700', color: '#a7f3d0', letterSpacing: '2px' }}>{registration.phoneticPlate || 'N/A'}</div>
                                    </div>
                                )}

                                {/* Registered date/time */}
                                {registration.registeredAt && (
                                    <div style={{ margin: '10px 14px 0', padding: '8px 14px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: '8px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <span style={{ fontSize: '10px', color: '#fde68a', fontWeight: '700', letterSpacing: '1.5px', textTransform: 'uppercase' }}>Registered:</span>

                                    </div>
                                )}

                                {/* Raw Discord message */}
                                {registration.rawDiscordMessage && (
                                    <div style={{ margin: '0 14px 14px', background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: '10px', overflow: 'hidden' }}>
                                        <div style={{ padding: '8px 14px', background: 'rgba(239,68,68,0.08)', borderBottom: '1px solid rgba(239,68,68,0.15)', fontSize: '10px', color: '#f87171', fontWeight: '700', letterSpacing: '2px', textTransform: 'uppercase' }}>
                                            Raw Discord Record
                                        </div>
                                        <div style={{ padding: '12px 14px' }}>

                                        <Accessibility size={18} /> HANDICAP PERMIT
                                    </div>

                    </div>
                )}

                
            </div>
        )}
    </div>
)}

if (searchCooldown || loadingSearch || !searchCitizenId || searchCitizenId.trim() === '') return;

                                    <div style={{ color: '#fca5a5', fontSize: '13px', fontWeight: '800', marginBottom: '4px', textTransform: 'uppercase', letterSpacing: '1px' }}>VEHICLE REGISTRATION WARNING</div>

{/* ── REGISTERED VEHICLES ── */}
{(searchResults.vehicles?.length > 0 || searchResults.failedVehicleRaw?.length > 0) && (

                                    ))}
                                    {searchResults.failedVehicleRaw?.map((raw, idx) => {

                                            </div>
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', padding: '12px' }}>

                                                    <div style={{ fontSize: '9px', color: '#fde68a', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>STATUS</div>

                                                <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '8px', padding: '10px' }}>
                                                    <div style={{ fontSize: '9px', color: '#fde68a', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>ACTION</div>
                                                    <div style={{ fontSize: '13px', color: 'white', fontWeight: '700' }}>Manual Search</div>
                                                </div>
                                                {rawTimestamp && (
                                                    <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '8px', padding: '10px', gridColumn: '1 / -1' }}>
                                                        <div style={{ fontSize: '9px', color: '#fde68a', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>REGISTERED AT</div>
                                                        <div style={{ fontSize: '12px', color: 'white', fontWeight: '700', fontFamily: 'monospace' }}>{rawTimestamp}</div>
                                                    </div>
                                                )}
                                                <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '8px', padding: '10px', gridColumn: '1 / -1' }}>
                                                    <div style={{ fontSize: '9px', color: '#fde68a', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>RAW DISCORD MESSAGE</div>
                                                    <div style={{ fontFamily: 'monospace', fontSize: '11px', color: '#fde68a', lineHeight: '1.7', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                                                        {rawContent.split('\n').map((line, i) => (
                                                            <div key={i}><span style={{ color: '#6b7280', userSelect: 'none', marginRight: '8px' }}>{String(i + 1).padStart(2, '0')}</span>{line}</div>
      ))}
                                    </div>
                                </div>
                            </div>
                            <div style={{ margin: '0 12px 12px', background: 'rgba(245,158,11,0.06)', borderRadius: '8px', padding: '8px 12px' }}>
                                <div style={{ fontSize: '11px', color: '#fde68a', fontWeight: '600' }}>

                            </div>
                        </div>

                    })}
                </div>

                                {/* Citation with selected vehicle */}
                                {selectedVehicleForCitation && !isDispatcher && (
                                    <button onClick={async () => {
                                        if (!searchResults || !selectedVehicleForCitation) { showCustomError('Error', 'Please select a vehicle first.'); return; }

                                        const tempRegistration = { discordUserId: searchResults?.discordUserId || 'UNKNOWN', year: selectedVehicleForCitation.year || '', make: selectedVehicleForCitation.make || '', model: selectedVehicleForCitation.model || '', plate: selectedVehicleForCitation.plate || '', state: selectedVehicleForCitation.state || '', color: selectedVehicleForCitation.color || '', vehicleType: selectedVehicleForCitation.vehicleType || '', timestamp: selectedVehicleForCitation.timestamp || new Date().toLocaleString(), phoneticPlate: selectedVehicleForCitation.phoneticPlate || '', hasHandicapPermit: selectedVehicleForCitation.hasHandicapPermit || false, isEdited: selectedVehicleForCitation.isEdited || false };

                                        EXPORT PRE-FILLED CITATION (WITH REGISTRATION)
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                )}

                
            </div>
        )}
    </div>
)}





{activeView === 'settings' && (
    <div className="card" style={{ background: 'linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,58,138,0.3))', border: '1px solid rgba(59,130,246,0.2)', borderRadius: '16px', padding: '32px' }}>

                    <span style={{ fontSize: '48px', color: 'white', fontWeight: 'bold' }}>!</span>

                {/* shared sub-styles as inline helpers */}
                {(() => {

section: (accent, accentFaint) => ({ background: `${accentFaint}`, border: `1px solid ${accent}30`, borderRadius: '14px', padding: '20px 22px', marginBottom: '20px', borderLeft: `4px solid ${accent}` }),
