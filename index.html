                    </div>
                    {useMicrophone && (
                        <div style={{ marginTop: '8px', padding: '10px 14px', background: voiceActive ? 'rgba(220,38,38,0.08)' : 'rgba(59,130,246,0.06)', border: '1px solid ' + (voiceActive ? 'rgba(220,38,38,0.25)' : 'rgba(59,130,246,0.15)'), borderRadius: '8px', fontSize: '12px', color: voiceActive ? '#fca5a5' : '#6b7280' }}>
                            {voiceActive
                                ? '● Experimental Voice to Plate function is in use. Make use of the phonetic alphabet.'
                                : 'Experimental Voice to Plate function is available. Click the microphone icon to start using this feature.'}
                        </div>
                    )}
                    {voiceActive && (
                        <div style={{ marginTop: '6px', height: '6px', borderRadius: '3px', background: 'rgba(255,255,255,0.08)', overflow: 'hidden' }}>
                            <div style={{ height: '100%', width: micLevel + '%', background: micLevel > 85 ? '#ef4444' : micLevel > 55 ? '#a855f7' : '#3b82f6', transition: 'width 0.08s', borderRadius: '3px' }}></div>
                        </div>
                    )}
                    {voiceNotif && (
                        <div style={{ marginTop: '6px', padding: '8px 12px', background: voiceNotif.startsWith('❌') ? 'rgba(239,68,68,0.1)' : 'rgba(59,130,246,0.1)', border: '1px solid ' + (voiceNotif.startsWith('❌') ? 'rgba(239,68,68,0.3)' : 'rgba(59,130,246,0.25)'), borderRadius: '8px', color: voiceNotif.startsWith('❌') ? '#fca5a5' : '#93c5fd', fontSize: '12px' }}>{voiceNotif}</div>
                    )}

                    {loading && searchProgress > 0 && (
                        <div style={{ marginTop: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '6px', overflow: 'hidden', height: '4px' }}>
                            <div style={{ height: '100%', width: `${searchProgress}%`, background: 'linear-gradient(90deg, #3b82f6, #60a5fa)', transition: 'width 0.3s ease', borderRadius: '6px' }}></div>
                        </div>
                    )}
                </div>

                {/* ── ERROR ── */}
                {error && (
                    <div className={`${visualEffects ? 'shake-animation' : ''}`} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '16px 20px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '12px', marginBottom: '16px' }}>
                        <XCircle size={20} style={{ color: '#f87171', flexShrink: 0 }} />
                        <p style={{ color: '#fca5a5', fontSize: '14px', margin: 0 }}>{error}</p>
                    </div>
                )}

                {/* ── NOT FOUND ── */}
                {registration && registration.notFound && (
                    <div style={{ marginTop: '4px', padding: '20px 24px', background: 'linear-gradient(135deg, rgba(239,68,68,0.15), rgba(220,38,38,0.1))', border: '1px solid rgba(239,68,68,0.35)', borderRadius: '14px', display: 'flex', alignItems: 'center', gap: '16px', animation: visualEffects ? 'shake-animation 0.5s ease-in-out' : 'none', boxShadow: '0 4px 16px rgba(239,68,68,0.15)' }}>
                        <div style={{ width: '48px', height: '48px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, boxShadow: '0 4px 12px rgba(239,68,68,0.4)' }}>
                            <XCircle size={26} style={{ color: 'white' }} />
                        </div>
                        <div>
                            <div style={{ color: '#fca5a5', fontSize: '16px', fontWeight: '800', marginBottom: '4px', textTransform: 'uppercase', letterSpacing: '1px' }}>NO REGISTRATION FOUND</div>
                            <div style={{ color: '#fecaca', fontSize: '13px', lineHeight: '1.6', opacity: 0.85 }}>
                                The license plate "{licensePlate}" does not appear in the vehicle registration database. The vehicle may be unregistered or the plate may have been entered incorrectly.
                            </div>
                        </div>
                    </div>
                )}

                {/* ── MULTIPLE MATCHES ── */}
                {registration && registration.multipleMatches && (
                    <div style={{ marginTop: '4px', background: 'linear-gradient(135deg, rgba(59,130,246,0.1), rgba(37,99,235,0.06))', border: '1px solid rgba(59,130,246,0.25)', borderRadius: '14px', padding: '20px', boxShadow: '0 4px 24px rgba(0,0,0,0.3)' }} className={visualEffects ? 'pulse-animation' : ''}>
                        <div style={{ color: '#93c5fd', fontSize: '16px', fontWeight: '800', marginBottom: '6px' }}>
                            Multiple Matches — Select Vehicle ({registration.registrations.length})
                        </div>
                        <p style={{ color: '#bfdbfe', fontSize: '13px', marginBottom: '16px', opacity: 0.8 }}>Click on a registration to view full details</p>
                        <div style={{ maxHeight: '600px', overflowY: 'auto', display: 'grid', gap: '10px' }}>
                            {registration.registrations.map((reg, idx) => (
                                <div
                                    key={idx}
                                    onClick={() => {
                                        setRegistration(reg);
                                        if (tokenSaved) {
                                            const memberUrl = `https://discord.com/api/v9/guilds/888585906020311060/members/${reg.discordUserId}`;
                                            fetch(memberUrl, { headers: { 'Authorization': discordToken } }).then(resp => { if (resp.ok) return resp.json(); }).then(memberData => {
                                                if (memberData) {
                                                    const serverName = memberData.nick || memberData.user.global_name || memberData.user.username;
                                                    lookupRobloxUser(serverName);
                                                }
                                            });
                                        }
                                    }}
                                    style={{ padding: '16px', background: 'rgba(59,130,246,0.08)', border: '1px solid rgba(59,130,246,0.25)', borderRadius: '10px', cursor: 'pointer', transition: 'all 0.2s' }}
                                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(59,130,246,0.18)'; e.currentTarget.style.borderColor = 'rgba(59,130,246,0.5)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
                                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(59,130,246,0.08)'; e.currentTarget.style.borderColor = 'rgba(59,130,246,0.25)'; e.currentTarget.style.transform = 'translateY(0)'; }}
                                >
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                                        <div>
                                            <div style={{ color: '#93c5fd', fontSize: '11px', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>VEHICLE</div>
                                            <div style={{ color: 'white', fontSize: '14px', fontWeight: '700' }}>{reg.year} {reg.make} {reg.model}</div>
                                            <div style={{ color: '#bfdbfe', fontSize: '12px', marginTop: '2px', opacity: 0.8 }}>{reg.color} {reg.vehicleType}</div>
                                        </div>
                                        <div>
                                            <div style={{ color: '#93c5fd', fontSize: '11px', fontWeight: '700', marginBottom: '4px', letterSpacing: '1px' }}>PLATE</div>
                                            <div style={{ color: 'white', fontSize: '18px', fontWeight: '800', fontFamily: 'monospace', background: 'rgba(59,130,246,0.2)', padding: '4px 10px', borderRadius: '6px', display: 'inline-block', letterSpacing: '2px' }}>{reg.plate}</div>
                                            <div style={{ color: '#bfdbfe', fontSize: '12px', marginTop: '2px', opacity: 0.8 }}>{reg.state}</div>
                                        </div>
                                    </div>
                                    <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid rgba(59,130,246,0.2)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div style={{ color: '#64748b', fontSize: '11px' }}>{reg.timestamp}</div>
                                        <div style={{ color: '#3b82f6', fontSize: '12px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.5px' }}>→ View Full Details</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ── RESULTS ── */}
                {(result || registration || loadingRoblox || robloxError) && registration && !registration.notFound && !registration.multipleMatches && (
                    <div className={`results-grid ${visualEffects ? 'pulse-animation' : ''}`}>

                        {/* OWNER BOX */}
                        <div style={{ padding: '20px', background: 'linear-gradient(135deg, rgba(16,185,129,0.1), rgba(5,150,105,0.06))', border: '1px solid rgba(16,185,129,0.25)', borderRadius: '14px', boxShadow: '0 4px 24px rgba(0,0,0,0.3)' }}>
                            <div style={{ color: '#34d399', fontSize: '11px', fontWeight: '700', marginBottom: '16px', textTransform: 'uppercase', letterSpacing: '2px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <User size={14} />
                                <span style={{ width: '3px', height: '12px', background: 'linear-gradient(180deg, #34d399, #10b981)', borderRadius: '2px' }}></span>
                                Registered Owner
                            </div>

                            {registration?.parseWarning && (
                                <div style={{ marginBottom: '14px', padding: '14px 18px', background: 'linear-gradient(135deg, #ff6b00, #ff4500)', border: '1px solid #ff0000', borderRadius: '10px', display: 'flex', alignItems: 'center', gap: '14px', boxShadow: '0 0 20px rgba(255,0,0,0.4)' }}>
                                    <span style={{ fontSize: '24px' }}>⚠️</span>
                                    <div>
                                        <div style={{ color: '#fff', fontSize: '11px', fontWeight: '700', marginBottom: '4px', letterSpacing: '0.5px' }}>⚠️ WARNING — INCOMPLETE REGISTRATIONS</div>
                                        <div style={{ color: '#fff', fontSize: '13px', lineHeight: '1.5' }}>{registration.parseWarning.message}</div>
                                    </div>
                                </div>
                            )}

                            {loadingRoblox ? (
                                <div className="mdt-progress-wrapper">
                                    <div className="mdt-spinner"><div className="mdt-spinner-ring"></div><div className="mdt-spinner-ring"></div></div>
                                    <div className="mdt-progress-text">{robloxLoadingStage || 'PROCESSING...'}</div>
                                    {searchProgress > 0 && (<><div className="mdt-progress-bar-outer"><div className="mdt-progress-bar-inner" style={{ width: `${searchProgress}%` }}></div></div><div style={{ color: '#60a5fa', fontSize: '12px', fontWeight: '700' }}>{searchProgress}%</div></>)}
                                </div>
                            ) : robloxError ? (
                                <>
                                    <div style={{ padding: '16px', textAlign: 'center', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '10px', marginBottom: '14px' }}>
                                        <p style={{ color: '#fca5a5', fontSize: '15px', fontWeight: '700', marginBottom: '6px' }}>BACKEND ERROR</p>
                                        <p style={{ color: '#fecaca', fontSize: '13px', marginBottom: '6px' }}>{robloxError}</p>
                                        <p style={{ color: '#bfdbfe', fontSize: '12px', opacity: 0.8 }}>Citation can still be exported with Discord and vehicle data.</p>
                                    </div>
                                    <div className="info-item"><span className="info-label">Discord ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{searchResults?.discordUserId || 'UNKNOWN'}</span><button className="copy-btn btn-ripple" onClick={(e) => { e.stopPropagation(); copyToClipboard(searchResults?.discordUserId || 'UNKNOWN', 'discord'); }}>{copiedField === 'discord' ? 'Copied!' : 'Copy'}</button></div></div>
                                </>
                            ) : result ? (
                                <>
                                    {result?.avatarUrl && (<div className="avatar-container"><img src={result.avatarUrl} alt="Avatar" className="avatar-img" onError={(e) => { const src = e.currentTarget.src; if (!src.includes('corsproxy.io')) { e.currentTarget.src = `https://corsproxy.io/?${encodeURIComponent(src)}`; } else { e.currentTarget.onerror = null; e.currentTarget.style.display = 'none'; } }} /></div>)}
                                    {result?.username && (<div className="info-item"><span className="info-label">Roblox Username:</span><span className="info-value">{result.username}</span></div>)}
                                    {result?.userId && (<div className="info-item"><span className="info-label">User ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{result.userId}</span><button className="copy-btn btn-ripple" onClick={() => copyToClipboard(result.userId, 'roblox')}>{copiedField === 'roblox' ? 'Copied!' : 'Copy'}</button></div></div>)}
                                    {result?.displayName && (<div className="info-item"><span className="info-label">Display Name:</span><span className="info-value">{result.displayName}</span></div>)}
                                    {result?.joinDate && (<div className="info-item"><span className="info-label">Join Date:</span><span className="info-value">{result.joinDate}</span></div>)}
                                    <div className="info-item"><span className="info-label">Discord ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{registration?.discordUserId || 'UNKNOWN'}</span><button className="copy-btn btn-ripple" onClick={() => copyToClipboard(registration?.discordUserId, 'discord-owner')}>{copiedField === 'discord-owner' ? 'Copied!' : 'Copy'}</button></div></div>
                                    <div style={{ marginTop: '14px', padding: '12px 16px', background: warrantFlash ? '#dc2626' : (warrantInfo ? '#ef4444' : 'rgba(255,255,255,0.05)'), border: `1px solid ${warrantInfo ? '#991b1b' : 'rgba(255,255,255,0.1)'}`, borderRadius: '10px', transition: 'all 0.3s', animation: warrantInfo ? 'pulse-border-warrant 2s infinite' : 'none', boxShadow: warrantInfo ? '0 0 20px rgba(239,68,68,0.5)' : 'none' }}>
                                        <div style={{ color: warrantInfo ? '#fff' : '#86efac', fontSize: '13px', fontWeight: '700' }}>
                                            {warrantInfo ? (<>WARRANT: ACTIVE {warrantInfo.bench > 0 && `BENCH WARRANT${warrantInfo.bench > 1 ? ` (${warrantInfo.bench})` : ''}`}{warrantInfo.bench > 0 && warrantInfo.arrest > 0 && ', '}{warrantInfo.arrest > 0 && `ARREST WARRANT${warrantInfo.arrest > 1 ? ` (${warrantInfo.arrest})` : ''}`}</>) : ('WARRANT: NO ACTIVE WARRANTS')}
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div style={{ padding: '16px', textAlign: 'center', background: 'rgba(251,191,36,0.1)', border: '1px solid rgba(251,191,36,0.25)', borderRadius: '10px', marginBottom: '14px' }}>
                                        <p style={{ color: '#fde047', fontSize: '14px', marginBottom: '6px', fontWeight: '600' }}>Roblox User Not Found</p>
                                        <p style={{ color: '#bfdbfe', fontSize: '12px', opacity: 0.8 }}>Citation can still be exported.</p>
                                    </div>
                                    <div className="info-item"><span className="info-label">Discord ID:</span><div style={{ display: 'flex', alignItems: 'center' }}><span className="info-value">{searchResults?.discordUserId || 'UNKNOWN'}</span><button className="copy-btn btn-ripple" onClick={(e) => { e.stopPropagation(); copyToClipboard(searchResults?.discordUserId || 'UNKNOWN', 'discord'); }}>{copiedField === 'discord' ? 'Copied!' : 'Copy'}</button></div></div>
                                </>
                            )}

                            {!loadingRoblox && (
                                <>
                                    <button onClick={() => { setShowDatabaseHistory(true); setDatabaseSearchId(registration?.discordUserId || searchResults?.discordUserId || ''); }}
                                        style={{ width: '100%', marginTop: '12px', padding: '12px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '10px', color: '#cbd5e1', fontSize: '13px', fontWeight: '700', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.5px', transition: 'all 0.2s' }}
                                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.12)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; e.currentTarget.style.transform = 'translateY(0)'; }}>
                                        VIEW GOVERNMENT RECORDS
                                    </button>

                                    <button onClick={() => { generateCitation(result, registration); }}
                                        style={{ width: '100%', marginTop: '10px', padding: '12px', background: 'linear-gradient(135deg, #10b981, #059669)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.5px', boxShadow: '0 4px 12px rgba(16,185,129,0.3)', transition: 'all 0.2s' }}
                                        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = '0 6px 18px rgba(16,185,129,0.5)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 12px rgba(16,185,129,0.3)'; }}>
                                        EXPORT PRE-FILLED CITATION
                                    </button>

                                    <button onClick={async () => {
                                        console.log('🚨 [ARREST] FILE ARREST/SUMMONS REPORT clicked');
                                        let ownerData = null, dataSource = null;
                                        if (searchResults?.robloxUser?.username) { ownerData = searchResults.robloxUser; dataSource = 'searchResults.robloxUser'; }
                                        else if (registration?.robloxUser?.username) { ownerData = registration.robloxUser; dataSource = 'registration.robloxUser'; }
                                        else if (result?.username) { ownerData = result; dataSource = 'result'; }
                                        else if (registration?.username) { ownerData = { username: registration.username, userId: registration.userId || registration.robloxUserId, displayName: registration.displayName, joinDate: registration.joinDate, avatarUrl: registration.avatarUrl }; dataSource = 'registration (direct)'; }
                                        if (ownerData?.username) {
                                            addLog(`🚨 Filing arrest report for ${ownerData.username}`, 'info');
                                            try { await generateArrestReport(ownerData); } catch (error) { showCustomError('Error', `Failed to generate arrest report: ${error.message}`); }
                                        } else {
                                            showCustomError('Error', 'Vehicle owner information not available.\n\nTry searching the license plate again.');
                                        }
                                    }}
                                        style={{ width: '100%', marginTop: '10px', padding: '12px', background: 'linear-gradient(135deg, #ef4444, #dc2626)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.5px', boxShadow: '0 4px 12px rgba(239,68,68,0.3)', transition: 'all 0.2s' }}
                                        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = '0 6px 18px rgba(239,68,68,0.5)'; }}
                                        onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 12px rgba(239,68,68,0.3)'; }}>
                                        FILE ARREST/SUMMONS REPORT
                                    </button>
                                </>
                            )}
                        </div>

                        {/* PARSE FAILURE */}
                        {registration && registration.parseFailed && (
                            <div className="vehicle-box" style={{ border: '2px solid rgba(239,68,68,0.5)', borderRadius: '14px', background: 'linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.9))', animation: visualEffects ? 'pulse-border-red 2s infinite' : 'none' }}>
                                <div className="box-header" style={{ borderRadius: '12px 12px 0 0', borderBottom: '1px solid rgba(239,68,68,0.3)' }}>
                                    <Car size={16} /> Vehicle Details
                                    <span style={{ marginLeft: '10px', padding: '2px 9px', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.4)', borderRadius: '4px', fontSize: '10px', color: '#f87171', fontWeight: '700', letterSpacing: '1px' }}>IMPROPER REG</span>
                                </div>

                                {/* Status banner */}
                                <div style={{ margin: '14px 14px 0', padding: '10px 14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '8px', display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <span style={{ fontSize: '18px', flexShrink: 0 }}>⚠️</span>
                                    <div>
                                        <div style={{ fontSize: '11px', fontWeight: '800', color: '#ef4444', letterSpacing: '1px', textTransform: 'uppercase' }}>Vehicle Improperly Registered</div>
                                        <div style={{ fontSize: '11px', color: '#94a3b8', marginTop: '2px' }}>Raw record shown below, manual verification required</div>
                                    </div>
                                </div>

                                {/* Plate display — same style as normal vehicle box */}
                                {registration.plate && (
                                    <div style={{ background: 'linear-gradient(135deg, #064e3b, #065f46)', border: '2px solid #10b981', borderRadius: '12px', padding: '16px', textAlign: 'center', margin: '14px', boxShadow: '0 4px 16px rgba(16,185,129,0.15)' }}>
                                        <div style={{ fontSize: '11px', color: '#6ee7b7', fontWeight: '700', marginBottom: '6px', letterSpacing: '3px' }}>LICENSE PLATE</div>
                                        <div style={{ fontSize: '28px', fontWeight: '900', color: 'white', letterSpacing: '6px', fontFamily: 'monospace', textShadow: '0 2px 8px rgba(0,0,0,0.4)' }}>{registration.plate}</div>
                                        <div style={{ fontSize: '11px', color: '#6ee7b7', fontWeight: '700', marginTop: '8px', marginBottom: '4px', letterSpacing: '2px' }}>PHONETIC SPELLING</div>
                                        <div style={{ fontSize: '13px', fontWeight: '700', color: '#a7f3d0', letterSpacing: '2px' }}>{registration.phoneticPlate || 'N/A'}</div>
                                    </div>
                                )}

                                {/* Raw Discord message */}
                                {registration.rawDiscordMessage && (
                                    <div style={{ margin: '0 14px 14px', background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: '10px', overflow: 'hidden' }}>
                                        <div style={{ padding: '8px 14px', background: 'rgba(239,68,68,0.08)', borderBottom: '1px solid rgba(239,68,68,0.15)', fontSize: '10px', color: '#f87171', fontWeight: '700', letterSpacing: '2px', textTransform: 'uppercase' }}>
                                            Raw Discord Record
                                        </div>
                                        <div style={{ padding: '12px 14px' }}>
                                            {registration.rawDiscordMessage.split('\n').filter(l => l.trim() !== '').map((line, i) => (
                                                <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: '10px', padding: '5px 0', borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                                                    <span style={{ fontSize: '10px', color: '#475569', fontWeight: '600', minWidth: '18px', textAlign: 'right', flexShrink: 0 }}>{i + 1}</span>
                                                    <span style={{ fontSize: '12px', color: '#cbd5e1', fontFamily: 'monospace', lineHeight: '1.6', wordBreak: 'break-word' }}>{line}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Footer badge */}
                                <div style={{ margin: '0 14px 14px', padding: '8px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '8px', textAlign: 'center', fontSize: '11px', color: '#f87171', fontWeight: '700', letterSpacing: '1px' }}>
                                    ⛔ MANUAL SEARCH REQUIRED
                                </div>
                            </div>
                        )}

                        {/* VEHICLE BOX */}
                        {registration && !registration.parseFailed && (
                            <div className="vehicle-box" style={{ border: recentRegistrationFlash ? '2px solid #ef4444' : '1px solid rgba(255,255,255,0.1)', borderRadius: '14px', animation: recentRegistrationFlash ? 'flash-red-border 1.5s infinite' : 'none', background: 'linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,58,138,0.1))' }}>
                                <div className="box-header" style={{ borderRadius: '12px 12px 0 0' }}>
                                    <Car size={16} /> Vehicle Details
                                    {recentRegistrationFlash && (<span style={{ marginLeft: '12px', padding: '3px 10px', background: '#ef4444', color: 'white', fontSize: '10px', fontWeight: '700', borderRadius: '4px', animation: 'pulse-glow 1s infinite' }}>RECENT EDIT</span>)}
                                </div>

                                {/* License Plate Display */}

if (searchCooldown || loadingSearch || !searchCitizenId || searchCitizenId.trim() === '') return;

                                            </div>

                                </div>

                                    <button onClick={async () => {

                                        EXPORT PRE-FILLED CITATION (WITH REGISTRATION)
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                )}

                
            </div>
        )}
    </div>
)}

                            color: '#94a3b8',
                            fontSize: '15px',
                            textAlign: 'center'
                        }}>
                            Fetching all messages from government database channel<br/>
                            This may take a moment for large channels...
                        </div>
                    </div>
                )}
                
                {/* Records List */}
                {!loadingPastRecords && pastRecords?.length > 0 && (
                    <div style={{
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '20px'
                    }}>
                        {pastRecords.map((record, index) => (
                            <div
                                key={record.id || index}
                                style={{
                                    background: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(220, 38, 38, 0.15))'
                                        : 'linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9))',
                                    border: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? '2px solid rgba(239, 68, 68, 0.6)'
                                        : '2px solid rgba(59, 130, 246, 0.3)',
                                    borderRadius: '16px',
                                    padding: '24px',
                                    transition: 'all 0.2s',
                                    animation: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'pulse-border-warrant 2s infinite'
                                        : 'none'
                                }}
                                onMouseEnter={(e) => {
                                    e.currentTarget.style.transform = 'translateX(6px)';
                                    e.currentTarget.style.boxShadow = '0 12px 32px rgba(0, 0, 0, 0.5)';
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.transform = 'translateX(0)';
                                    e.currentTarget.style.boxShadow = 'none';
                                }}
                            >
                                {/* Record Header */}
                                <div style={{
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center',
                                    marginBottom: '20px',
                                    paddingBottom: '16px',
                                    borderBottom: '1px solid rgba(255, 255, 255, 0.1)'
                                }}>
                                    <div style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '16px'
                                    }}>
                                        {/* Record Type Badge */}
                                        <div style={{
                                            padding: '10px 20px',
                                            background: record.type === 'Citation' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Mailed Citation' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Written Warning' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Vehicle Removal' ? 'rgba(168, 85, 247, 0.2)' :
                                                      record.type === 'Summons' ? 'rgba(249, 115, 22, 0.2)' :
                                                      record.type === 'Arrest' ? 'rgba(239, 68, 68, 0.2)' :
                                                      record.type === 'Points Amend' ? 'rgba(34, 197, 94, 0.2)' :
                                                      record.type === 'Bench Warrant' ? 'rgba(220, 38, 38, 0.3)' :
                                                      record.type === 'Arrest Warrant' ? 'rgba(220, 38, 38, 0.3)' :
                                                      'rgba(59, 130, 246, 0.2)',
                                            border: '2px solid ' + (
                                                record.type === 'Citation' ? 'rgba(234, 179, 8, 0.4)' :
                                                record.type === 'Summons' ? 'rgba(249, 115, 22, 0.4)' :
                                                record.type === 'Arrest' ? 'rgba(239, 68, 68, 0.4)' :
                                                record.type === 'Points Amend' ? 'rgba(34, 197, 94, 0.4)' :
                                                record.type === 'Bench Warrant' ? 'rgba(220, 38, 38, 0.6)' :
                                                record.type === 'Arrest Warrant' ? 'rgba(220, 38, 38, 0.6)' :
                                                'rgba(59, 130, 246, 0.4)'
                                            ),
                                            borderRadius: '10px',
                                            color: record.type === 'Citation' ? '#fbbf24' :
                                                  record.type === 'Summons' ? '#fb923c' :
                                                  record.type === 'Arrest' ? '#f87171' :
                                                  record.type === 'Points Amend' ? '#4ade80' :
                                                  record.type === 'Bench Warrant' ? '#fca5a5' :
                                                  record.type === 'Arrest Warrant' ? '#fca5a5' :
                                                  '#93c5fd',
                                            fontSize: '14px',
                                            fontWeight: '700',
                                            textTransform: 'uppercase',
                                            letterSpacing: '1.2px'
                                        }}>
                                            {(record.type === 'Bench Warrant' || record.type === 'Arrest Warrant') ? '! ' : ''}
                                            {record.type}
                                        </div>
                                        
                                        {/* Date */}
                                        <div style={{
                                            color: '#94a3b8',
                                            fontSize: '14px',
                                            fontWeight: '500'
                                        }}>
                                            DATE: {new Date(record.timestamp).toLocaleString('en-US', {
                                                month: '2-digit',
                                                day: '2-digit',
                                                year: 'numeric',
                                                hour: '2-digit',
                                                minute: '2-digit',
                                                hour12: false
                                            })}
                                        </div>
                                    </div>
                                    
                                    {/* Author */}
                                    <div style={{
                                        color: '#cbd5e1',
                                        fontSize: '14px',
                                        fontWeight: '600',
                                        padding: '8px 16px',
                                        background: 'rgba(255, 255, 255, 0.05)',
                                        borderRadius: '8px',
                                        border: '1px solid rgba(255, 255, 255, 0.1)'
                                    }}>
                                        Issued by: {record.authorUsername}
                                    </div>
                                </div>
                                
                                {/* Record Details Grid */}
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
                                    gap: '16px',
                                    marginBottom: '20px'
                                }}>
                                    {/* Penal Codes */}
                                    {record.penalCodes && record.penalCodes.length > 0 && (
                                        <div style={{
                                            background: 'rgba(59, 130, 246, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(59, 130, 246, 0.2)'
                                        }}>
                                            <div style={{
                                                color: '#93c5fd',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Violations:
                                            </div>
                                            <div style={{
                                                color: 'white',
                                                fontSize: '16px',
                                                fontWeight: '700',
                                                fontFamily: 'monospace'
                                            }}>
                                                {record.penalCodes.join(', ')}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Total Points */}
                                    {record.totalPoints !== null && (
                                        <div style={{
                                            background: 'rgba(234, 179, 8, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(234, 179, 8, 0.2)'
                                        }}>
                                            <div style={{
                                                color: '#fde047',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Total Points:
                                            </div>
                                            <div style={{
                                                color: '#fef08a',
                                                fontSize: '28px',
                                                fontWeight: '900'
                                            }}>
                                                {record.totalPoints}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Point Change */}
                                    {record.pointChange && (
                                        <div style={{
                                            background: record.pointChange.startsWith('+') 
                                                ? 'rgba(239, 68, 68, 0.1)' 
                                                : 'rgba(34, 197, 94, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid ' + (record.pointChange.startsWith('+') 
                                                ? 'rgba(239, 68, 68, 0.2)' 
                                                : 'rgba(34, 197, 94, 0.2)')
                                        }}>
                                            <div style={{
                                                color: record.pointChange.startsWith('+') ? '#fca5a5' : '#86efac',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                {record.pointChange.startsWith('+') ? 'Points Added:' : 'Points Reduced:'}
                                            </div>
                                            <div style={{
                                                color: record.pointChange.startsWith('+') ? '#f87171' : '#4ade80',
                                                fontSize: '28px',
                                                fontWeight: '900'
                                            }}>
                                                {record.pointChange} PTS
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Issuer (for warrants) */}
                                    {record.issuer && (
                                        <div style={{
                                            background: 'rgba(167, 139, 250, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(167, 139, 250, 0.2)'
                                        }}>
                                            <div style={{
                                                color: '#c4b5fd',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Issued By Court Staff:
                                            </div>
                                            <div style={{
                                                color: '#e9d5ff',
                                                fontSize: '16px',
                                                fontWeight: '700'
                                            }}>
                                                {record.issuer}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                {/* Attachments */}
                                {record.attachments && record.attachments.length > 0 && (
                                    <div style={{
                                        marginTop: '20px',
                                        paddingTop: '20px',
                                        borderTop: '1px solid rgba(255, 255, 255, 0.1)'
                                    }}>
                                        <div style={{
                                            color: '#93c5fd',
                                            fontSize: '13px',
                                            fontWeight: '700',
                                            marginBottom: '16px',
                                            textTransform: 'uppercase',
                                            letterSpacing: '0.8px'
                                        }}>
                                            Attachments: ({record.attachments.length})
                                        </div>
                                        <div style={{
                                            display: 'grid',
                                            gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))',
                                            gap: '16px'
                                        }}>
                                            {record.attachments.map((att, attIndex) => (
                                                <div
                                                    key={attIndex}
                                                    onClick={() => {
                                                        setImageGallery({
                                                            images: record.attachments,
                                                            currentIndex: attIndex,
                                                            recordType: record.type
                                                        });
                                                    }}
                                                    style={{
                                                        position: 'relative',
                                                        paddingBottom: '100%',
                                                        background: 'rgba(0, 0, 0, 0.4)',
                                                        borderRadius: '12px',
                                                        overflow: 'hidden',
                                                        cursor: 'pointer',
                                                        border: '2px solid rgba(59, 130, 246, 0.3)',
                                                        transition: 'all 0.2s'
                                                    }}
                                                    onMouseEnter={(e) => {
                                                        e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.6)';
                                                        e.currentTarget.style.transform = 'scale(1.05)';
                                                        e.currentTarget.style.boxShadow = '0 8px 24px rgba(59, 130, 246, 0.3)';
                                                    }}
                                                    onMouseLeave={(e) => {
                                                        e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.3)';
                                                        e.currentTarget.style.transform = 'scale(1)';
                                                        e.currentTarget.style.boxShadow = 'none';
                                                    }}
                                                >
                                                    <img
                                                        src={att.url}
                                                        alt={att.filename}
                                                        style={{
                                                            position: 'absolute',
                                                            top: 0,
                                                            left: 0,
                                                            width: '100%',
                                                            height: '100%',
                                                            objectFit: 'cover'
                                                        }}
                                                    />
                                                    {record.attachments.length > 1 && (
                                                        <div style={{
                                                            position: 'absolute',
                                                            bottom: '10px',
                                                            right: '10px',
                                                            background: 'rgba(0, 0, 0, 0.8)',
                                                            color: 'white',
                                                            padding: '6px 12px',
                                                            borderRadius: '6px',
                                                            fontSize: '12px',
                                                            fontWeight: '700'
                                                        }}>
                                                            {attIndex + 1}/{record.attachments.length}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                )}
                
                {/* No Records */}
                {!loadingPastRecords && (!pastRecords || pastRecords.length === 0) && (
                    <div style={{
                        textAlign: 'center',
                        padding: '100px 20px',
                        color: '#94a3b8'
                    }}>
                        <div style={{ fontSize: '80px', marginBottom: '24px' }}>❌</div>
                        <h3 style={{
                            fontSize: '24px',
                            fontWeight: '700',
                            color: '#cbd5e1',
                            marginBottom: '12px'
                        }}>
                            No Government Records Found
                        </h3>
                        <p style={{ fontSize: '16px', color: '#94a3b8' }}>
                            {databaseSearchId 
                                ? `No government records found in database for CitizenID: ${databaseSearchId}`
                                : 'Enter a Discord User ID and click "Search" to begin'}
                        </p>
                    </div>
                )}
            </div>
        </div>
    </div>
)}

{/* Image Gallery Modal */}
{imageGallery && (
    <div 
        style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            background: 'rgba(0, 0, 0, 0.97)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 11000,
            padding: '40px'
        }}
        onClick={() => setImageGallery(null)}
    >
        {/* Close Button */}
        <button
            onClick={() => setImageGallery(null)}
            style={{
                position: 'absolute',
                top: '30px',
                right: '30px',
                background: 'rgba(239, 68, 68, 0.2)',
                border: '2px solid rgba(239, 68, 68, 0.4)',
                borderRadius: '12px',
                color: '#fca5a5',
                fontSize: '32px',
                width: '60px',
                height: '60px',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                zIndex: 11002,
                transition: 'all 0.2s'
            }}
            onMouseEnter={(e) => {
                e.currentTarget.style.background = 'rgba(239, 68, 68, 0.4)';
                e.currentTarget.style.transform = 'scale(1.1)';
            }}
            onMouseLeave={(e) => {
                e.currentTarget.style.background = 'rgba(239, 68, 68, 0.2)';
                e.currentTarget.style.transform = 'scale(1)';
            }}
        >
            x
        </button>
        
        {/* Previous Button */}
        {imageGallery.images.length > 1 && imageGallery.currentIndex > 0 && (
            <button
                onClick={(e) => {
                    e.stopPropagation();
                    setImageGallery({
                        ...imageGallery,
                        currentIndex: imageGallery.currentIndex - 1
                    });
                }}
                style={{
                    position: 'absolute',
                    left: '30px',
                    background: 'rgba(59, 130, 246, 0.3)',
                    border: '2px solid rgba(59, 130, 246, 0.5)',
                    borderRadius: '50%',
                    color: '#93c5fd',
                    fontSize: '40px',
                    width: '70px',
                    height: '70px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 11002,
                    transition: 'all 0.2s'
                }}
                onMouseEnter={(e) => {
                    e.currentTarget.style.background = 'rgba(59, 130, 246, 0.5)';
                    e.currentTarget.style.transform = 'scale(1.1)';
                }}
                onMouseLeave={(e) => {
                    e.currentTarget.style.background = 'rgba(59, 130, 246, 0.3)';
                    e.currentTarget.style.transform = 'scale(1)';
                }}
            >
                ←
            </button>
        )}
        
        {/* Image Container */}
        <div 
            onClick={(e) => e.stopPropagation()}
            style={{
                maxWidth: '90vw',
                maxHeight: '90vh',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '30px'
            }}
        >
            <img
                src={imageGallery.images[imageGallery.currentIndex].url}
                alt="Evidence"
                style={{
                    maxWidth: '100%',
                    maxHeight: '80vh',
                    objectFit: 'contain',
                    borderRadius: '16px',
                    border: '4px solid rgba(59, 130, 246, 0.5)',
                    boxShadow: '0 30px 80px rgba(0, 0, 0, 0.9)'
                }}
            />
            
            {/* Image Counter */}
            {imageGallery.images.length > 1 && (
                <div style={{
                    background: 'rgba(30, 41, 59, 0.95)',
                    border: '2px solid rgba(59, 130, 246, 0.4)',
                    borderRadius: '12px',
                    padding: '16px 32px',
                    color: '#93c5fd',
                    fontSize: '20px',
                    fontWeight: '700',
                    backdropFilter: 'blur(10px)'
                }}>
                    {imageGallery.currentIndex + 1} / {imageGallery.images.length}
                </div>
            )}
        </div>
        
        {/* Next Button */}
        {imageGallery.images.length > 1 && imageGallery.currentIndex < imageGallery.images.length - 1 && (
            <button
                onClick={(e) => {
                    e.stopPropagation();
                    setImageGallery({
                        ...imageGallery,
                        currentIndex: imageGallery.currentIndex + 1
                    });
                }}
                style={{
                    position: 'absolute',
                    right: '30px',
                    background: 'rgba(59, 130, 246, 0.3)',
                    border: '2px solid rgba(59, 130, 246, 0.5)',
                    borderRadius: '50%',
                    color: '#93c5fd',
                    fontSize: '40px',
                    width: '70px',
                    height: '70px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 11002,
                    transition: 'all 0.2s'
                }}
                onMouseEnter={(e) => {
                    e.currentTarget.style.background = 'rgba(59, 130, 246, 0.5)';
                    e.currentTarget.style.transform = 'scale(1.1)';
                }}
                onMouseLeave={(e) => {
                    e.currentTarget.style.background = 'rgba(59, 130, 246, 0.3)';
                    e.currentTarget.style.transform = 'scale(1)';
                }}
            >
                →
            </button>
        )}
    </div>
)}
{/* Offline Indicator */}
{isOffline && (
    <div className="offline-indicator">
          OFFLINE - No Internet Connection
    </div>
)}

{showUsefulLinks && (
    <div style={{
        position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
        background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 2000, backdropFilter: 'blur(6px)', padding: '20px', animation: 'fadeIn 0.2s ease-out'
    }} onClick={e => { if (e.target === e.currentTarget) setShowUsefulLinks(false); }}>
        <div style={{
            background: 'linear-gradient(135deg, #0a0f1e 0%, #111827 50%, #0f1419 100%)',
            border: '1px solid rgba(59,130,246,0.25)', borderRadius: '14px',
            width: '100%', maxWidth: '860px', height: '75vh',
            display: 'flex', flexDirection: 'column', overflow: 'hidden',
            boxShadow: '0 4px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04)'
        }}>
            {/* Header */}
            <div style={{
                display: 'flex', alignItems: 'center', gap: '16px', padding: '20px 24px', flexShrink: 0,
                background: 'linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,58,138,0.4))',
                borderBottom: '1px solid rgba(59,130,246,0.2)', position: 'relative', overflow: 'hidden'
            }}>
                <div style={{ position: 'absolute', top: '-60%', right: '-5%', width: '40%', height: '220%', background: 'radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%)', pointerEvents: 'none' }} />
                <div style={{ width: '44px', height: '44px', background: 'linear-gradient(135deg, #1e3a8a, #3b82f6)', borderRadius: '11px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 16px rgba(59,130,246,0.4)', flexShrink: 0 }}>
                    <svg width="22" height="22" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                </div>
                <div style={{ flex: 1, position: 'relative', zIndex: 1 }}>
                    <div style={{ color: 'white', fontSize: '16px', fontWeight: '800', letterSpacing: '1px' }}>USEFUL LINKS</div>
                    <div style={{ color: '#60a5fa', fontSize: '11px', marginTop: '2px', fontWeight: '500' }}>{selectedDepartment === 'NYSP' ? 'New York State Police' : 'East Greenbush Police Department'}</div>
                </div>
                {/* Department pill */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', background: selectedDepartment === 'NYSP' ? 'rgba(59,130,246,0.1)' : 'rgba(16,185,129,0.1)', border: `1px solid ${selectedDepartment === 'NYSP' ? 'rgba(59,130,246,0.25)' : 'rgba(16,185,129,0.25)'}`, borderRadius: '20px', padding: '5px 12px', marginRight: '8px', position: 'relative', zIndex: 1 }}>
                    <Shield size={12} style={{ color: selectedDepartment === 'NYSP' ? '#60a5fa' : '#34d399' }} />
                    <span style={{ fontSize: '10px', fontWeight: '700', letterSpacing: '1px', color: selectedDepartment === 'NYSP' ? '#60a5fa' : '#34d399' }}>{selectedDepartment === 'NYSP' ? 'NYSP' : 'EGPD'}</span>
                </div>
<button
    onClick={() => setShowUsefulLinks(false)}
    style={{ width: '32px', height: '32px', minWidth: '32px', minHeight: '32px', borderRadius: '8px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#f87171', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', flexShrink: 0, padding: 0 }}
    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.2)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.4)'; }}
    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.08)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.2)'; }}
>
    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
</button>
            </div>

            {/* Links grid */}
            <div style={{ flex: 1, overflowY: 'auto', minHeight: 0, padding: '20px 24px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: '10px' }}>
                    {USEFUL_LINKS[selectedDepartment || 'NYSP'].map((link, index) => (
                        <a key={index} href="#" rel="noopener noreferrer"
    onClick={(e) => {
        e.preventDefault();
        if (window.require) {
            try {
                const { shell } = window.require('electron');
                shell.openExternal(link.url);
            } catch(_) { window.open(link.url, '_blank'); }
        } else {
            window.open(link.url, '_blank');

            URL.revokeObjectURL(url);
