                borderBottom: '1px solid rgba(59,130,246,0.2)', position: 'relative', overflow: 'hidden'
            }}>
                <div style={{ position: 'absolute', top: '-60%', right: '-5%', width: '40%', height: '220%', background: 'radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%)', pointerEvents: 'none' }} />
                <div style={{ width: '44px', height: '44px', background: 'linear-gradient(135deg, #1e3a8a, #3b82f6)', borderRadius: '11px', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 16px rgba(59,130,246,0.4)', flexShrink: 0 }}>
                    <svg width="22" height="22" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <div style={{ flex: 1, position: 'relative', zIndex: 1 }}>
                    <div style={{ color: 'white', fontSize: '16px', fontWeight: '800', letterSpacing: '1px' }}>GOVERNMENT RECORDS</div>
                    <div style={{ color: '#60a5fa', fontSize: '11px', marginTop: '2px', fontWeight: '500' }}>
                        {databaseSearchUsername && databaseSearchId ? (
                            <span>Viewing: <span style={{ color: '#f1f5f9', fontWeight: '700' }}>{databaseSearchUsername}</span> <span style={{ color: '#374151' }}>·</span> <span style={{ fontFamily: 'monospace', color: '#93c5fd' }}>{databaseSearchId}</span></span>
                        ) : loadingPastRecords ? (recordsLoadingStage || '⏳ Searching...') : 'Enter a CitizenID to search records'}
                    </div>
                </div>
                <button
                    onClick={() => { setShowDatabaseHistory(false); setPastRecords([]); setDatabaseSearchId(''); setDatabaseSearchUsername(''); }}
                    style={{ width: '32px', height: '32px', minWidth: '32px', minHeight: '32px', borderRadius: '8px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#f87171', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', flexShrink: 0, padding: 0 }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.2)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.4)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.08)'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.2)'; }}>
                    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            {/* Search Bar */}
            <div style={{ padding: '16px 24px', borderBottom: '1px solid rgba(59,130,246,0.1)', background: 'rgba(15,23,42,0.3)', flexShrink: 0 }}>
                <div style={{ display: 'flex',
                    gap: '16px',
                    alignItems: 'stretch'
                }}>
                    <input
                        type="text"
                        placeholder="Enter Discord User ID (CitizenID)..."
                        value={databaseSearchId}
                        onChange={(e) => {
                            setDatabaseSearchId(e.target.value);
                            console.log('📝 User ID changed:', e.target.value);
                        }}
                        onKeyPress={(e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault(); // Prevent multiple triggers
                                if (searchCooldown) {
                                    // Don't show error if already cooling down
                                    return;
                                }
                            if (e.key === 'Enter' && databaseSearchId.trim() && !loadingPastRecords) {
                                searchPastRecords(databaseSearchId);
                            }
                            }
                        }}
                        disabled={loadingPastRecords}
                        style={{
                            flex: 3,
                            padding: '16px 24px',
                            background: loadingPastRecords ? 'rgba(100, 116, 139, 0.1)' : 'rgba(255, 255, 255, 0.08)',
                            border: '2px solid rgba(59, 130, 246, 0.3)',
                            borderRadius: '12px',
                            color: 'white',
                            fontSize: '16px',
                            fontWeight: '500',
                            outline: 'none',
                            transition: 'all 0.2s',
                            fontFamily: 'monospace',
                            letterSpacing: '0.5px'
                        }}
                        onFocus={(e) => {
                            e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.6)';
                            e.currentTarget.style.background = 'rgba(255, 255, 255, 0.12)';
                            e.currentTarget.style.boxShadow = '0 0 0 4px rgba(59, 130, 246, 0.1)';
                        }}
                        onBlur={(e) => {
                            e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.3)';
                            e.currentTarget.style.background = 'rgba(255, 255, 255, 0.08)';
                            e.currentTarget.style.boxShadow = 'none';
                        }}
                    />
                    
                    <button
                        onClick={() => {
                            if (databaseSearchId.trim() && !loadingPastRecords) {
                                console.log('🔍 Search button clicked');
                                searchPastRecords(databaseSearchId);
                            }
                        }}
                        disabled={loadingPastRecords}
                        style={{
                            padding: '16px 32px',
                            background: loadingPastRecords 
                                ? 'rgba(100, 116, 139, 0.3)' 
                                : 'rgba(59, 130, 246, 0.2)',
                            border: '2px solid ' + (loadingPastRecords 
                                ? 'rgba(100, 116, 139, 0.4)' 
                                : 'rgba(59, 130, 246, 0.4)'),
                            borderRadius: '12px',
                            color: loadingPastRecords ? '#94a3b8' : '#93c5fd',
                            fontSize: '16px',
                            fontWeight: '700',
                            cursor: loadingPastRecords ? 'not-allowed' : 'pointer',
                            whiteSpace: 'nowrap',
                            transition: 'all 0.2s',
                            minWidth: '140px',
                            maxWidth: '140px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '10px'
                        }}
                        onMouseEnter={(e) => {
                            if (!loadingPastRecords) {
                                e.currentTarget.style.background = 'rgba(59, 130, 246, 0.3)';
                                e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.6)';
                                e.currentTarget.style.transform = 'scale(1.02)';
                            }
                        }}
                        onMouseLeave={(e) => {
                            if (!loadingPastRecords) {
                                e.currentTarget.style.background = 'rgba(59, 130, 246, 0.2)';
                                e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.4)';
                                e.currentTarget.style.transform = 'scale(1)';
                            }
                        }}
                    >
                        {loadingPastRecords ? 'Searching...' : 'SEARCH'}
                    </button>
                </div>
            </div>
            
            {/* Content Area */}
            <div style={{
                flex: 1,
                overflowY: 'auto',
                padding: '24px 32px',
                position: 'relative'
            }}>
                {/* Loading State */}
                {loadingPastRecords && (
                    <div style={{
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '80px 20px',
                        gap: '24px'
                    }}>
                        <div style={{
                            width: '80px',
                            height: '80px',
                            border: '6px solid rgba(59, 130, 246, 0.2)',
                            borderTop: '6px solid #3b82f6',
                            borderRadius: '50%',
                            animation: 'spin 1s linear infinite'
                        }}></div>
                        <div style={{
                            color: '#93c5fd',
                            fontSize: '20px',
                            fontWeight: '600'
                        }}>
                            Searching Database...
                        </div>
                        <div style={{
                            color: '#94a3b8',
                            fontSize: '15px',
                            textAlign: 'center'
                        }}>
                            Fetching all messages from government database channel<br/>
                            This may take a moment for large channels...
                        </div>
                    </div>
                )}
                
                {/* Records List */}
                {!loadingPastRecords && pastRecords?.length > 0 && (
                    <div style={{
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '12px'
                    }}>
                        {pastRecords.map((record, index) => (
                            <div
                                key={record.id || index}
                                style={{
                                    background: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'linear-gradient(135deg, rgba(239,68,68,0.12), rgba(220,38,38,0.06))'
                                        : 'linear-gradient(135deg, rgba(30,58,138,0.12), rgba(59,130,246,0.04))',
                                    border: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? '1px solid rgba(239,68,68,0.35)'
                                        : '1px solid rgba(59,130,246,0.18)',
                                    borderRadius: '12px',
                                    padding: '0',
                                    transition: 'all 0.15s',
                                    overflow: 'hidden',
                                    position: 'relative',
                                    animation: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'pulse-border-warrant 2s infinite'
                                        : 'none'
                                }}
                                onMouseEnter={(e) => {
                                    e.currentTarget.style.background = record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'linear-gradient(135deg, rgba(239,68,68,0.18), rgba(220,38,38,0.1))'
                                        : 'linear-gradient(135deg, rgba(30,58,138,0.2), rgba(59,130,246,0.08))';
                                    e.currentTarget.style.borderColor = record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'rgba(239,68,68,0.55)' : 'rgba(59,130,246,0.4)';
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.background = record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'linear-gradient(135deg, rgba(239,68,68,0.12), rgba(220,38,38,0.06))'
                                        : 'linear-gradient(135deg, rgba(30,58,138,0.12), rgba(59,130,246,0.04))';
                                    e.currentTarget.style.borderColor = record.type === 'Bench Warrant' || record.type === 'Arrest Warrant'
                                        ? 'rgba(239,68,68,0.35)' : 'rgba(59,130,246,0.18)';
                                }}
                            >
                                {/* Top accent bar — credits style */}
                                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '2px', background: record.type === 'Bench Warrant' || record.type === 'Arrest Warrant' ? 'linear-gradient(90deg, transparent, rgba(239,68,68,0.6), transparent)' : 'linear-gradient(90deg, transparent, rgba(59,130,246,0.4), transparent)' }} />
                                <div style={{ padding: '20px 24px' }}>
                                {/* Record Header */}
                                <div style={{
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center',
                                    marginBottom: '20px',
                                    paddingBottom: '16px',
                                    borderBottom: '1px solid rgba(255, 255, 255, 0.1)'
                                }}>
                                    <div style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '16px'
                                    }}>
                                        {/* Record Type Badge */}
                                        <div style={{
                                            padding: '10px 20px',
                                            background: record.type === 'Citation' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Mailed Citation' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Written Warning' ? 'rgba(234, 179, 8, 0.2)' :
                                                      record.type === 'Vehicle Removal' ? 'rgba(168, 85, 247, 0.2)' :
                                                      record.type === 'Summons' ? 'rgba(249, 115, 22, 0.2)' :
                                                      record.type === 'Arrest' ? 'rgba(239, 68, 68, 0.2)' :
                                                      record.type === 'Points Amend' ? 'rgba(34, 197, 94, 0.2)' :
                                                      record.type === 'Bench Warrant' ? 'rgba(220, 38, 38, 0.3)' :
                                                      record.type === 'Arrest Warrant' ? 'rgba(220, 38, 38, 0.3)' :
                                                      'rgba(59, 130, 246, 0.2)',
                                            border: '2px solid ' + (
                                                record.type === 'Citation' ? 'rgba(234, 179, 8, 0.4)' :
                                                record.type === 'Summons' ? 'rgba(249, 115, 22, 0.4)' :
                                                record.type === 'Arrest' ? 'rgba(239, 68, 68, 0.4)' :
                                                record.type === 'Points Amend' ? 'rgba(34, 197, 94, 0.4)' :
                                                record.type === 'Bench Warrant' ? 'rgba(220, 38, 38, 0.6)' :
                                                record.type === 'Arrest Warrant' ? 'rgba(220, 38, 38, 0.6)' :
                                                'rgba(59, 130, 246, 0.4)'
                                            ),
                                            borderRadius: '10px',
                                            color: record.type === 'Citation' ? '#fbbf24' :
                                                  record.type === 'Summons' ? '#fb923c' :
                                                  record.type === 'Arrest' ? '#f87171' :
                                                  record.type === 'Points Amend' ? '#4ade80' :
                                                  record.type === 'Bench Warrant' ? '#fca5a5' :
                                                  record.type === 'Arrest Warrant' ? '#fca5a5' :
                                                  '#93c5fd',
                                            fontSize: '14px',
                                            fontWeight: '700',
                                            textTransform: 'uppercase',
                                            letterSpacing: '1.2px'
                                        }}>
                                            {(record.type === 'Bench Warrant' || record.type === 'Arrest Warrant') ? '! ' : ''}
                                            {record.type}
                                        </div>
                                        
                                        {/* Date */}
                                        <div style={{
                                            color: '#94a3b8',
                                            fontSize: '14px',
                                            fontWeight: '500'
                                        }}>
                                            DATE: {new Date(record.timestamp).toLocaleString('en-US', {
                                                month: '2-digit',
                                                day: '2-digit',
                                                year: 'numeric',
                                                hour: '2-digit',
                                                minute: '2-digit',
                                                hour12: false
                                            })}
                                        </div>
                                    </div>
                                    
                                    {/* Author */}
                                    <div style={{
                                        color: '#cbd5e1',
                                        fontSize: '14px',
                                        fontWeight: '600',
                                        padding: '8px 16px',
                                        background: 'rgba(255, 255, 255, 0.05)',
                                        borderRadius: '8px',
                                        border: '1px solid rgba(255, 255, 255, 0.1)'
                                    }}>
                                        Issued by: {record.authorUsername}
                                    </div>
                                </div>
                                
                                {/* Raw Discord Message */}
                                {record.content && (
                                    <div style={{ marginBottom: '16px', background: 'rgba(0,0,0,0.25)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: '10px', overflow: 'hidden' }}>
                                        <div style={{ padding: '6px 12px', background: 'rgba(255,255,255,0.03)', borderBottom: '1px solid rgba(255,255,255,0.06)', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                            <span style={{ color: '#4b5563', fontSize: '9px', fontWeight: '700', letterSpacing: '2px', textTransform: 'uppercase' }}>RECORD CONTENT</span>
                                        </div>
                                        <div style={{ padding: '12px 16px' }}>
                                            {record.content.split('\n').filter(l => l.trim()).map((line, li) => {
                                                const isHeader = line.includes('**') || line.startsWith('__') || /^[A-Z\s]{4,}:/.test(line);
                                                const clean = line.replace(/\*\*/g, '').replace(/__/g, '');
                                                const colonIdx = clean.indexOf(':');
                                                const hasLabel = colonIdx > 0 && colonIdx < 30;
                                                return (
                                                    <div key={li} style={{ display: 'flex', gap: '8px', padding: '3px 0', borderBottom: li < record.content.split('\n').filter(l => l.trim()).length - 1 ? '1px solid rgba(255,255,255,0.03)' : 'none' }}>
                                                        {hasLabel ? (
                                                            <>
                                                                <span style={{ color: '#6b7280', fontSize: '11px', fontWeight: '700', minWidth: '120px', flexShrink: 0, fontFamily: 'monospace' }}>{clean.substring(0, colonIdx).trim()}</span>
                                                                <span style={{ color: '#e2e8f0', fontSize: '11px', fontFamily: 'monospace' }}>{clean.substring(colonIdx + 1).trim()}</span>
                                                            </>
                                                        ) : (
                                                            <span style={{ color: isHeader ? '#93c5fd' : '#cbd5e1', fontSize: '11px', fontWeight: isHeader ? '700' : '400', fontFamily: 'monospace', letterSpacing: isHeader ? '0.5px' : 'normal' }}>{clean}</span>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* Record Details Grid */}
                                <div style={{
                                    display: 'flex',
                                    flexWrap: 'wrap',
                                    gap: '10px',
                                    marginBottom: '16px'
                                }}>
                                    {/* Penal Codes */}
                                    {record.penalCodes && record.penalCodes.length > 0 && (
                                        <div style={{
                                            background: 'rgba(59, 130, 246, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(59, 130, 246, 0.2)'
                                        }}>
                                            <div style={{
                                                color: '#93c5fd',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Violations:
                                            </div>
                                            <div style={{
                                                color: 'white',
                                                fontSize: '16px',
                                                fontWeight: '700',
                                                fontFamily: 'monospace'
                                            }}>
                                                {record.penalCodes.join(', ')}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Total Points */}
                                    {record.totalPoints !== null && (
                                        <div style={{
                                            background: 'rgba(234, 179, 8, 0.1)',
                                            padding: '10px 16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(234, 179, 8, 0.2)',
                                            minWidth: '120px'
                                        }}>
                                            <div style={{
                                                color: '#fde047',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Total Points:
                                            </div>
                                            <div style={{
                                                color: '#fef08a',
                                                fontSize: '28px',
                                                fontWeight: '900'
                                            }}>
                                                {record.totalPoints}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Point Change */}
                                    {record.pointChange && (
                                        <div style={{
                                            background: record.pointChange.startsWith('+') 
                                                ? 'rgba(239, 68, 68, 0.1)' 
                                                : 'rgba(34, 197, 94, 0.1)',
                                            padding: '10px 16px',
                                            borderRadius: '10px',
                                            border: '1px solid ' + (record.pointChange.startsWith('+') 
                                                ? 'rgba(239, 68, 68, 0.2)' 
                                                : 'rgba(34, 197, 94, 0.2)'),
                                            minWidth: '120px'
                                        }}>
                                            <div style={{
                                                color: record.pointChange.startsWith('+') ? '#fca5a5' : '#86efac',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                {record.pointChange.startsWith('+') ? 'Points Added:' : 'Points Reduced:'}
                                            </div>
                                            <div style={{
                                                color: record.pointChange.startsWith('+') ? '#f87171' : '#4ade80',
                                                fontSize: '28px',
                                                fontWeight: '900'
                                            }}>
                                                {record.pointChange} PTS
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* Issuer (for warrants) */}
                                    {record.issuer && (
                                        <div style={{
                                            background: 'rgba(167, 139, 250, 0.1)',
                                            padding: '16px',
                                            borderRadius: '10px',
                                            border: '1px solid rgba(167, 139, 250, 0.2)'
                                        }}>
                                            <div style={{
                                                color: '#c4b5fd',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                marginBottom: '8px',
                                                textTransform: 'uppercase',
                                                letterSpacing: '0.5px'
                                            }}>
                                                Issued By Court Staff:
                                            </div>
                                            <div style={{
                                                color: '#e9d5ff',
                                                fontSize: '16px',
                                                fontWeight: '700'
                                            }}>
                                                {record.issuer}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                {/* Attachments */}
                                {record.attachments && record.attachments.length > 0 && (
                                    <div style={{
                                        marginTop: '20px',
                                        paddingTop: '20px',
                                        borderTop: '1px solid rgba(255, 255, 255, 0.1)'
                                    }}>
                                        <div style={{
                                            color: '#93c5fd',
                                            fontSize: '13px',
                                            fontWeight: '700',
                                            marginBottom: '16px',
                                            textTransform: 'uppercase',
                                            letterSpacing: '0.8px'
                                        }}>
                                            Attachments: ({record.attachments.length})
                                        </div>
                                        <div style={{
                                            display: 'grid',
                                            gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))',
                                            gap: '16px'
                                        }}>
                                            {record.attachments.map((att, attIndex) => (
                                                <div
                                                    key={attIndex}
                                                    onClick={() => {
                                                        setImageGallery({
                                                            images: record.attachments,
                                                            currentIndex: attIndex,
                                                            recordType: record.type
                                                        });
                                                    }}
                                                    style={{
                                                        position: 'relative',
                                                        paddingBottom: '100%',
                                                        background: 'rgba(0, 0, 0, 0.4)',
                                                        borderRadius: '12px',
                                                        overflow: 'hidden',
                                                        cursor: 'pointer',
                                                        border: '2px solid rgba(59, 130, 246, 0.3)',
                                                        transition: 'all 0.2s'
                                                    }}
                                                    onMouseEnter={(e) => {
                                                        e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.6)';
                                                        e.currentTarget.style.transform = 'scale(1.05)';
                                                        e.currentTarget.style.boxShadow = '0 8px 24px rgba(59, 130, 246, 0.3)';
                                                    }}
                                                    onMouseLeave={(e) => {
                                                        e.currentTarget.style.borderColor = 'rgba(59, 130, 246, 0.3)';
                                                        e.currentTarget.style.transform = 'scale(1)';
                                                        e.currentTarget.style.boxShadow = 'none';
                                                    }}
                                                >
                                                    <img
                                                        src={att.url}
                                                        alt={att.filename}
                                                        style={{
                                                            position: 'absolute',
                                                            top: 0,
                                                            left: 0,
                                                            width: '100%',
                                                            height: '100%',
                                                            objectFit: 'cover'
                                                        }}
                                                    />
                                                    {record.attachments.length > 1 && (
                                                        <div style={{
                                                            position: 'absolute',
                                                            bottom: '10px',
                                                            right: '10px',
                                                            background: 'rgba(0, 0, 0, 0.8)',
                                                            color: 'white',
                                                            padding: '6px 12px',
                                                            borderRadius: '6px',
                                                            fontSize: '12px',
                                                            fontWeight: '700'
                                                        }}>
                                                            {attIndex + 1}/{record.attachments.length}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        ))}
                    </div>
                )}
                
                {/* No Records */}
                {!loadingPastRecords && (!pastRecords || pastRecords.length === 0) && (
                    <div style={{
                        textAlign: 'center',
                        padding: '100px 20px',
                        color: '#94a3b8'

                {/* Citizens log */}
                {shiftSearchHistory.length > 0 && (
                    <div style={{ background: 'rgba(167,139,250,0.04)', border: '1px solid rgba(167,139,250,0.1)', borderRadius: '14px', padding: '18px', marginBottom: '14px' }}>
                        <div style={{ color: '#a78bfa', fontSize: '10px', fontWeight: '700', letterSpacing: '2px', marginBottom: '12px' }}>CITIZENS SEARCHED ({shiftSearchHistory.length})</div>
                        <div style={{ maxHeight: '160px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                            {shiftSearchHistory.map((s, i) => (
                                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 12px', background: 'rgba(255,255,255,0.02)', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.04)' }}>
                                    <span style={{ color: 'white', fontWeight: '700', fontSize: '12px' }}>{s.username}</span>
                                    {s.hasWarrants && <span style={{ color: '#ef4444', fontSize: '10px', fontWeight: '700' }}>⚠ WARRANT</span>}
                                    <span style={{ color: '#334155', fontSize: '10px', fontFamily: 'monospace' }}>{s.timestamp}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* Breaks log */}
                {shiftBreaks.length > 0 && (
                    <div style={{ background: 'rgba(245,158,11,0.04)', border: '1px solid rgba(245,158,11,0.1)', borderRadius: '14px', padding: '18px', marginBottom: '20px' }}>
                        <div style={{ color: '#fbbf24', fontSize: '10px', fontWeight: '700', letterSpacing: '2px', marginBottom: '12px' }}>BREAKS ({shiftBreaks.length})</div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                            {shiftBreaks.map((b, i) => (
                                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 12px', background: 'rgba(255,255,255,0.02)', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.04)' }}>
                                    <span style={{ color: '#94a3b8', fontSize: '11px', fontFamily: 'monospace' }}>{formatShiftTime(b.start)} &rarr; {formatShiftTime(b.end)}</span>
                                    <span style={{ color: '#fbbf24', fontSize: '11px', fontWeight: '700' }}>{Math.floor(b.duration / 60000)}m {Math.floor((b.duration % 60000) / 1000)}s</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* Buttons */}
                <div style={{ display: 'flex', gap: '10px' }}>
                    <button onClick={async () => {
                        try {
                            addLog('Generating shift report PDF...', 'info');
                            const pdfDoc = await PDFLib.PDFDocument.create();
                            const page = pdfDoc.addPage([612, 792]);
                            const helveticaBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                            const helvetica = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                            const courier = await pdfDoc.embedFont(PDFLib.StandardFonts.Courier);
                            const { width, height } = page.getSize();
                            let y = height - 50;
                            const txt = (t, x, yy, size, font, color = PDFLib.rgb(0,0,0)) => page.drawText(String(t), { x, y: yy, size, font, color });
                            const line = (x1, y1, x2, y2) => page.drawLine({ start:{x:x1,y:y1}, end:{x:x2,y:y2}, thickness:0.5, color: PDFLib.rgb(0.8,0.8,0.8) });

                            // Header
                            page.drawRectangle({ x:40, y:y-80, width:width-80, height:80, color: PDFLib.rgb(0.23,0.51,0.96) });
                            txt('SHIFT RECORD LOG', 55, y-35, 20, helveticaBold, PDFLib.rgb(1,1,1));
                            txt('SHIFT SUMMARY REPORT', 55, y-58, 14, helvetica, PDFLib.rgb(1,1,1));
                            txt(`Generated: ${new Date().toLocaleString()}`, 55, y-74, 9, helvetica, PDFLib.rgb(0.8,0.9,1));
                            y -= 100;

                            // Officer info
                            page.drawRectangle({ x:40, y:y-70, width:width-80, height:70, color: PDFLib.rgb(0.96,0.97,0.99) });
                            txt('OFFICER INFORMATION', 50, y-18, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                            txt(`Name: ${trooperSettings?.FirstName || ''} ${trooperSettings?.LastName || ''}`, 50, y-34, 10, helvetica);
                            txt(`Badge: ${trooperSettings?.BadgeID || 'N/A'}`, 200, y-34, 10, helvetica);
                            txt(`Username: ${trooperSettings?.Username || 'N/A'}`, 50, y-48, 10, helvetica);
                            txt(`Zone: ${trooperSettings?.Zone || 'N/A'}`, 200, y-48, 10, helvetica);
                            txt(`Department: ${trooperSettings?.Department || 'NYSP'}`, 50, y-62, 10, helvetica);
                            const sessName = selectedUserSession === '1011898104670330920' ? 'Session 1' : selectedUserSession === '1390212294478397471' ? 'Session 2' : selectedUserSession === '1390212341005680650' ? 'Session 3' : selectedUserSession === '1411101488146550784' ? 'Whitelisted Session' : 'None';
                            txt(`Session: ${sessName}`, 200, y-62, 10, helvetica);
                            y -= 90;

                            // Times
                            txt('SHIFT TIMES', 50, y-15, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                            txt(`Start: ${formatShiftTime(shiftStartTime)}`, 50, y-30, 10, helvetica);
                            txt(`End:   ${formatShiftTime(shiftEndTime)}`, 50, y-44, 10, helvetica);
                            txt(`Duration: ${getShiftDuration()}`, 50, y-58, 10, helvetica);
                            txt(`Breaks: ${shiftBreaks.length} (${Math.floor(shiftBreaks.reduce((a,b)=>a+b.duration,0)/60000)}m total)`, 50, y-72, 10, helvetica);
                            y -= 92;

                            // Stats
                            page.drawRectangle({ x:40, y:y-60, width:width-80, height:60, color: PDFLib.rgb(0.96,0.97,0.99) });
                            txt('ACTIVITY STATISTICS', 50, y-18, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                            txt(`Plates Searched: ${shiftPlateSearches.length}`, 50, y-34, 10, helvetica);
                            txt(`Citizens Searched: ${shiftSearchHistory.length}`, 200, y-34, 10, helvetica);
                            txt(`Calls Acknowledged: ${shiftAcknowledgedCount}`, 50, y-50, 10, helvetica);
                            txt(`Calls Dismissed: ${shiftDismissedCount}`, 200, y-50, 10, helvetica);
                            y -= 80;

                            // Plates
                            if (shiftPlateSearches.length > 0) {
                                txt('LICENSE PLATES SEARCHED', 50, y-15, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                                y -= 28;
                                shiftPlateSearches.forEach(s => {
                                    if (y < 60) { pdfDoc.addPage([612,792]); y = 742; }
                                    txt(s.plate, 50, y, 9, courier);
                                    txt(s.found ? 'FOUND' : 'NOT FOUND', 180, y, 9, helvetica, s.found ? PDFLib.rgb(0.06,0.73,0.51) : PDFLib.rgb(0.94,0.27,0.27));
                                    txt(s.timestamp, 300, y, 8, helvetica, PDFLib.rgb(0.5,0.5,0.5));
                                    y -= 14;
                                });
                                y -= 10;
                            }

                            // Citizens
                            if (shiftSearchHistory.length > 0) {
                                txt('CITIZENS SEARCHED', 50, y-15, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                                y -= 28;
                                shiftSearchHistory.forEach(s => {
                                    if (y < 60) { pdfDoc.addPage([612,792]); y = 742; }
                                    txt(s.username || s.citizenId, 50, y, 9, helvetica);
                                    if (s.hasWarrants) txt('WARRANT', 200, y, 9, helveticaBold, PDFLib.rgb(0.94,0.27,0.27));
                                    txt(s.timestamp, 300, y, 8, helvetica, PDFLib.rgb(0.5,0.5,0.5));
                                    y -= 14;
                                });
                                y -= 10;
                            }

                            // Breaks
                            if (shiftBreaks.length > 0) {
                                txt('BREAKS', 50, y-15, 10, helveticaBold, PDFLib.rgb(0.23,0.51,0.96));
                                y -= 28;
                                shiftBreaks.forEach((b, i) => {
                                    if (y < 60) { pdfDoc.addPage([612,792]); y = 742; }
                                    txt(`Break ${i+1}: ${formatShiftTime(b.start)} to ${formatShiftTime(b.end)} (${Math.floor(b.duration/60000)}m ${Math.floor((b.duration%60000)/1000)}s)`, 50, y, 9, helvetica);
                                    y -= 14;
                                });
                            }

                            const pdfBytes = await pdfDoc.save();
                            const filename = `Shift_${trooperSettings?.BadgeID || 'REPORT'}_${new Date().toLocaleDateString().replace(/\//g,'')}.pdf`;
                            if (window.require) {
                                const { fs, path, os, shell } = (() => ({
                                    fs: window.require('fs'),
                                    path: window.require('path'),
                                    os: window.require('os'),
                                    shell: window.require('electron').shell
                                }))();
                                const filepath = path.join(os.tmpdir(), filename);
                                fs.writeFileSync(filepath, Buffer.from(pdfBytes));
                                shell.openExternal(`file://${filepath}`);
                            } else {
                                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
                            }
                            addLog('✅ Shift report exported', 'success');
                        } catch(e) { showCustomError('PDF Error', e.message); }
                    }} style={{ flex: 2, padding: '14px', background: 'linear-gradient(135deg, #1e3a8a, #2563eb)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', letterSpacing: '1px', boxShadow: '0 4px 16px rgba(30,58,138,0.5)' }}>
                        📄 EXPORT PDF REPORT
                    </button>
                    <button onClick={() => { setShowShiftSummary(false); setShiftStartTime(null); setShiftEndTime(null); setShiftSearchHistory([]); setShiftPlateSearches([]); setShiftBreaks([]); setShiftAcknowledgedCount(0); setShiftDismissedCount(0); }} style={{ flex: 1, padding: '14px', background: 'linear-gradient(135deg, #10b981, #059669)', border: 'none', borderRadius: '10px', color: 'white', fontSize: '13px', fontWeight: '700', cursor: 'pointer', letterSpacing: '1px' }}>
                        ✓ CLOSE
                    </button>
                </div>
            </div>
        </div>
    </div>
)}

{liveAnnouncements && Object.entries(liveAnnouncements).filter(([id]) => !dismissedAnnouncements.has(id)).length > 0 && (
    <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 9999, pointerEvents: 'none', display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {Object.entries(liveAnnouncements).filter(([id]) => !dismissedAnnouncements.has(id)).map(([id, message]) => (
            <div key={id}
                style={{
                    background: 'linear-gradient(135deg, rgba(15,23,42,0.98), rgba(30,58,138,0.25))',
                    border: '1px solid rgba(239,68,68,0.35)',
                    borderRadius: '14px',
                    padding: '14px 16px',
                    maxWidth: '340px',
                    boxShadow: '0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)',
                    pointerEvents: 'auto',
                    transition: 'transform 0.2s, box-shadow 0.2s',
                    position: 'relative',
                    overflow: 'hidden',
                }}
                onMouseEnter={e => { e.currentTarget.style.transform = 'translateX(-4px)'; e.currentTarget.style.boxShadow = '0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04)'; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'translateX(0)'; e.currentTarget.style.boxShadow = '0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)'; }}
            >
                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '2px', background: 'linear-gradient(90deg, transparent, rgba(239,68,68,0.7), transparent)' }}></div>
                <div style={{ position: 'absolute', top: '-50%', right: '-10%', width: '50%', height: '200%', background: 'radial-gradient(circle, rgba(239,68,68,0.06) 0%, transparent 70%)', pointerEvents: 'none' }}></div>

                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px', position: 'relative', zIndex: 1 }}>
                    <div style={{ width: '28px', height: '28px', background: 'linear-gradient(135deg, rgba(239,68,68,0.2), rgba(220,38,38,0.1))', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', flexShrink: 0 }}>📢</div>
                    <span style={{ color: '#f87171', fontSize: '10px', fontWeight: '800', letterSpacing: '2px', textTransform: 'uppercase' }}>LIVE ANNOUNCEMENT</span>
                    <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '5px' }}>
                            <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#ef4444', boxShadow: '0 0 8px rgba(239,68,68,0.9)', animation: 'pulse-dot 2s ease-in-out infinite' }}></div>
                            <span style={{ color: '#ef4444', fontSize: '9px', fontWeight: '700', letterSpacing: '1px' }}>LIVE</span>
                        </div>
                        <button
                            onClick={() => setDismissedAnnouncements(prev => new Set([...prev, id]))}
                            style={{ width: '18px', height: '18px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '4px', color: '#475569', fontSize: '10px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1, padding: 0, transition: 'all 0.15s', flexShrink: 0 }}
                            onMouseEnter={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.15)'; e.currentTarget.style.color = '#f87171'; e.currentTarget.style.borderColor = 'rgba(239,68,68,0.3)'; }}
                            onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; e.currentTarget.style.color = '#475569'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)'; }}
                            title="Dismiss announcement"
                        >✕</button>
                    </div>
                </div>

                <div style={{ color: '#94a3b8', fontSize: '12px', lineHeight: '1.6', fontWeight: '500', position: 'relative', zIndex: 1, paddingLeft: '2px' }}>
                    {message}
                </div>
            </div>
        ))}
    </div>
)}
<button 
    className={`scroll-to-top ${showScrollTop ? 'visible' : ''}`}
    onClick={scrollToTop}
    title="Scroll to top"
>
    <svg width="24" height="24" fill="none" stroke="white" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 15l7-7 7 7" />
    </svg>
</button>
    </React.Fragment>
);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NYSPLookupTool />);
    </script>
</body>
</html>
